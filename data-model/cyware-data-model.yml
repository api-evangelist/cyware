summary: >-
  Derived from the path templates and id-bearing response fields across the 438 documented
  operations. Intel Exchange's core is a STIX 2.x object graph: a Threat Data Object (an SDO or SCO of
  a given object_type) is the hub, everything else hangs off it — relations to other objects, tags,
  watchlist and allowed-list membership, notes, tasks, enrichment results, sources, kill-chain
  phases and confidence scores. Around that sit the publishing side (Intel Packages / shareable
  intel, collections, subscribers, TAXII) and the administration side (users, groups, feed sources,
  enrichment tools, rules). Orchestrate is a separate, smaller graph: Playbook, Playbook Result,
  Node Result, App, App Action, App Instance, Event and Persistent List.
id_conventions:
  format: UUID v4 for platform objects
  stix_format: "type--uuid for STIX objects (for example indicator--<uuid>)"
  compound_addressing: >-
    Threat data objects are addressed by the pair (object_type, object_id), not by a single opaque
    id — for example GET /ingestion/threat-data/{object_type}/{object_id}/basic/.
  human_id: readable_id appears on Orchestrate events and several Intel Exchange objects alongside
    the UUID.
