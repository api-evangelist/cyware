summary: >-
  Cyware ships no general-purpose client SDK for either Open API — there is no cyware or ctix package
  on npm, PyPI, Maven Central, NuGet, RubyGems, Packagist or crates.io. What Cyware Labs does publish
  is a TAXII 2 client library on PyPI and the Go module behind its open-source MCP server, plus a
  handful of open-source CLI and analysis tools on GitHub that are not pushed to a registry. Both
  Open APIs are documented for direct HTTP use with hand-rolled HMAC-SHA1 signing (Python and Postman
  pre-request snippets are published in the authentication pages).
