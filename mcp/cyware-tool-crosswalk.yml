summary: >-
  Binds every tool registered by the open-source Cyware MCP server to the Intel Exchange and
  Orchestrate operations that back it. Bindings were read from the server's Go source (each tool
  carries the literal endpoint path it calls), then matched against the operationIds in the two
  OpenAPI documents in this repo. Two things this crosswalk makes visible: (1) the MCP server covers
  roughly 8% of the published REST surface — 40 tools against 438 documented operations — and is
  concentrated on threat-data triage, tagging, enrichment and playbook execution; (2) several
  Orchestrate tools call internal product paths (integrations/apps/, playbooks/, execute/,
  /soarapi/integrations/sync-exec-action/, /cpapi/rest-auth/*) that are NOT the documented v1 Open API
  paths, so those bindings are semantic rather than literal and are marked medium confidence.
