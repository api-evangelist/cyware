method: searched
status: published
source: https://github.com/cyware-labs/cyware-mcpserver
server:
  name: cywaremcp
  vendor: Cyware Labs
  transport: [stdio, sse]
  hosting: self-hosted
  url: null
  note: >-
    There is no Cyware-operated remote MCP endpoint. The server is open source (MIT, Go 1.24.2+),
    built and run by the customer next to their own Cyware tenant, and configured through cmd/config.yaml
    with the tenant base URLs (for example https://demo.cyware.com/ctix/ and https://demo.cyware.com/soar/)
    plus Open API credentials (access_id + secret_key), a bearer token, or basic auth.
  repository: https://github.com/cyware-labs/cyware-mcpserver
  language: Go
  license: MIT
  announced: '2025-08-05'
  announcement: https://www.cyware.com/blog/talk-to-your-threat-intelligence-platform-introducing-the-cyware-mcp-server
  setup_docs:
    - https://github.com/cyware-labs/cyware-mcpserver/blob/main/README.md
    - https://github.com/cyware-labs/cyware-mcpserver/blob/main/documentation/cursor_setup.md
    - https://github.com/cyware-labs/cyware-mcpserver/blob/main/documentation/hld.md
authentication:
  modes:
    - type: openapicreds
      fields: [access_id, secret_key]
      note: The same HMAC-SHA1 signed Open API credentials used by the REST APIs.
    - type: token
      fields: [token]
      note: Bearer token taken from the Authorization header of a product API call.
    - type: basic
      fields: [username, password]
applications:
  - key: ctix
    name: Cyware Intel Exchange
    base_url_config: applications.ctix.base_url
    api: openapi/cyware-intel-exchange-openapi.yml
  - key: co
    name: Cyware Orchestrate
    base_url_config: applications.co.base_url
    api: openapi/cyware-orchestrate-openapi.yml
tool_count: 40
