apis:
- name: Cyware MCP Server
  description: >-
    Open-source Model Context Protocol server, written in Go and published under MIT by Cyware Labs, that
    exposes Cyware Intel Exchange and Cyware Orchestrate to LLM agents as MCP tools. Self-hosted alongside
    the customer's own tenant over stdio or SSE transport; 40 tools cover CQL search, threat data object
    details and relations, bulk threat-data actions, tag management, enrichment tools and enrichment execution,
    quick-add intel, and Orchestrate playbook and app-action execution.
  humanURL: https://github.com/cyware-labs/cyware-mcpserver
  baseURL: https://github.com/cyware-labs/cyware-mcpserver
  tags:
  - MCP
