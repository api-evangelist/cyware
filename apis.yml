aid: cyware
name: Cyware
description: >-
  Cyware is a New York-headquartered cybersecurity company, founded in 2016, that builds an AI-powered
  threat intelligence and security operations platform for enterprise SOC teams, ISACs and ISAOs,
  government agencies, CERTs and MSSPs. The Cyware Intelligence Suite spans Intel Exchange (its threat
  intelligence platform, formerly CTIX), Collaborate (bi-directional threat sharing for member
  communities), Orchestrate (security orchestration and automation), Respond (incident case management)
  and Cyware AI (agentic security analyst workflows). The platform ingests, deduplicates, enriches,
  scores and operationalizes structured and unstructured cyber threat intelligence using STIX 2.x,
  TAXII 2.x and MITRE ATT&CK, and pushes it into SIEM, EDR, firewall and ITSM tooling through 400+
  integrations. Programmatic access is delivered through the Intel Exchange v3 Open API and the
  Orchestrate Open API — both tenant-hosted, both authenticated with HMAC-SHA1 signed Open API
  credentials — plus an open-source Model Context Protocol server that exposes threat-intelligence and
  playbook actions to LLM agents.
