    get:
      operationId: listPlaybookRunLogs
      summary: Get Playbook Run Logs
      tags:
      - Playbooks
      description: Retrieves the list of playbook run logs along with the associated playbook data.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/playbook/list-playbook-run-logs
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve the playbook run logs
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve the playbook run logs
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of items to retrieve per page.
          default: '10'
          examples:
          - '10'
        description: Pass the number of items to retrieve per page.
      - name: playbook_status
        in: query
        required: false
        schema:
          type: string
          description: Pass the status of the playbook to retrieve the run logs.
          enum:
          - active
          - inactive
          examples:
          - active
        description: Pass the status of the playbook to retrieve the run logs.
      - name: status
        in: query
        required: false
        schema:
          type: string
          description: Pass the playbook run status to filter playbooks.
          enum:
          - SUCCESS
          - PARTIAL_SUCCESS
          - IN_PROGRESS
          - ERROR
          - SYSTEM_ERROR
          - ON_HOLD
          - IN_QUEUE
          - WAITING
          - TERMINATED
          examples:
          - SUCCESS
        description: Pass the playbook run status to filter playbooks.
      - name: source_playbook_result__is_null
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true or false to filter playbooks based on the master playbook.
          enum:
          - 'true'
          - 'false'
          examples:
          - 'false'
        description: Pass true or false to filter playbooks based on the master playbook.
      - name: apps_list
        in: query
        required: false
        schema:
          type: string
          description: Pass the unique ID of the app. You can retrieve the unique ID of an app using the
            **Get Apps** endpoint.
          examples:
          - '{app_unique_id}'
        description: Pass the unique ID of the app. You can retrieve the unique ID of an app using the
          **Get Apps** endpoint.
      - name: playbook
        in: query
        required: false
        schema:
          type: string
          description: Pass the unique ID of the playbook. You can retrieve the unique ID of a playbook
            using the **Get Playbooks** endpoint.
          examples:
          - '{playbook_unique_id}'
        description: Pass the unique ID of the playbook. You can retrieve the unique ID of a playbook
          using the **Get Playbooks** endpoint.
      - name: actions_list
        in: query
        required: false
        schema:
          type: string
          description: Pass the unique ID of the app action. You can retrieve the unique ID of an action
            using the **Get App Actions** endpoint.
          examples:
          - '{app_action_unique_id}'
        description: Pass the unique ID of the app action. You can retrieve the unique ID of an action
          using the **Get App Actions** endpoint.
      - name: ran_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the unique ID of the user who initiated the playbook run.
          examples:
          - '{user_unique_id}'
        description: Pass the unique ID of the user who initiated the playbook run.
      - name: scheduled
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve scheduled playbooks run logs, else false.
          enum:
          - 'true'
          - 'false'
          examples:
          - 'false'
        description: Pass true to retrieve scheduled playbooks run logs, else false.
      - name: run_at
        in: query
        required: false
        schema:
          type: string
          description: Pass the date to retrieve playbooks based on the playbook last run.
          enum:
          - last_month
          - last_year
          - last_week
          examples:
          - last_month
        description: Pass the date to retrieve playbooks based on the playbook last run.
      - name: run_at__lte
        in: query
        required: false
        schema:
          type: string
          description: Pass the end time in Unix time format to retrieve the playbook run logs.
          examples:
          - '1642530599'
        description: Pass the end time in Unix time format to retrieve the playbook run logs.
      - name: run_at__gte
        in: query
        required: false
        schema:
          type: string
          description: Pass the start time in Unix time format to retrieve the playbook run logs.
          examples:
          - '1641234600'
        description: Pass the start time in Unix time format to retrieve the playbook run logs.
      - name: ordering
        in: query
        required: false
        schema:
          type: string
          description: Pass the ordering values, such as `modified`, `execution_time`, and `created` to
            filter playbooks.
