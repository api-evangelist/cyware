                                  type: number
                                  description: Returns the number of times the action was rerun by the
                                    Cyware agent.
                                  examples:
                                  - 1
                                action_run_buffer_time:
                                  type: number
                                  description: Returns buffer time set for the Cyware agent to rerun the
                                    action.
                                  examples:
                                  - 1
                                save_result:
                                  type: boolean
                                  description: Returns true to save the output of the node, else returns
                                    false.
                                  examples:
                                  - true
                          conditions:
                            type: array
                            description: Returns the conditions configured to execute the playbook.
                            items: {}
                          extra_params:
                            type: object
                            description: Returns the details of the node position and validation.
                            properties:
                              position:
                                type: object
                                description: Returns the details of the x and y axis of a node in the
