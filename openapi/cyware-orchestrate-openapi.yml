  /v1/integrations/actions/execute/:
    post:
      operationId: executeAction
      summary: Execute Action
      tags:
      - Integrations
      description: Execute an app action by passing the required parameters in the payload.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/integrations/execute-action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_identifier:
                  type: string
                  description: Pass the identifier of the app. For example, *abuse_ipdb*. You can use
                    the **Get Apps** endpoint to retrieve the identifier of an app.
                  examples:
                  - abuse_ipdb
                action_identifier:
                  type: string
                  description: Pass the unique identifier of the action. For example, *check_ip_address*.
                    You can use the **Get App Actions** endpoint to retrieve the identifier of an action.
                  examples:
                  - check_ip_address
                action_params:
                  type: object
                  description: Pass the parameters required to execute the action. You can retrieve the
                    details of the required parameters of the action using the **Get Action Details**
                    endpoint.
                  properties:
                    ip_address:
                      type: string
                      description: Pass the required request parameters to execute the action.
                      examples:
                      - 8.8.8.8
                app_instance_slug:
                  type: string
                  description: Pass the resource identifier of the app instance to execute an action.
                    You can retrieve the identifier of an instance using the **Get App Instances** endpoint.
                  examples:
                  - uat_instance
              required:
              - app_identifier
              - action_identifier
              - action_params
              - app_instance_slug
            example:
              app_identifier: abuse_ipdb
              action_identifier: check_ip_address
              action_params:
                ip_address: 8.8.8.8
              app_instance_slug: uat_instance
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Returns the results of the executed action, with response details varying
                      based on the specific action performed.
                    properties:
                      result:
                        type: object
                        description: Returns the details of the action executed.
                        properties:
                          filescan_id:
                            type: object
                            description: Returns the response parameters and the values after the action
                              execution.
                          permalink:
                            type: string
                            description: URL link to the source execution.
                            examples:
                            - https://www.virustotal.com/gui/url/cf4b367e49bf0b22041c6f065f4aa19f3cfe39c8d5abc0617343d1a66c6a26f5/detection/u-cf4b367e49bf0b22041c6f065f4aa19f3cfe39c8d5abc0617343d1a66c6a26f5-1642656275
                          resource:
                            type: string
                            description: Resource passed to the action.
                            examples:
                            - google.com
                          response_code:
                            type: number
                            description: Response code of the action after execution.
                            examples:
                            - 1
                          scans:
                            type: object
                            description: Returns the details of all the scans performed with their result.
                          total:
                            type: number
                            description: Total number of scans.
                            examples:
                            - 93
                          url:
                            type: string
                            description: Returns the URL passed.
                            examples:
                            - http://google.com/
                      status_code:
                        type: number
                        description: Returns the status code of the action execution.
                        examples:
                        - 200
                  execution_status:
                    type: string
                    description: Returns the status of the action execution.
                    enum:
                    - SUCCESS
                    - ERROR
                    - WAITING
                    - UNTESTED
                    examples:
                    - SUCCESS
              example:
                result:
                  result:
                    filescan_id: {}
                    permalink: https://www.virustotal.com/gui/url/cf4b367e49bf0b22041c6f065f4aa19f3cfe39c8d5abc0617343d1a66c6a26f5/detection/u-cf4b367e49bf0b22041c6f065f4aa19f3cfe39c8d5abc0617343d1a66c6a26f5-1642656275
                    resource: google.com
                    response_code: 1
                    scans: {}
                    total: 93
                    url: http://google.com/
                  status_code: 200
                execution_status: SUCCESS
  /v1/integrations/app-actions/{action_id}/:
    get:
      operationId: getActionDetails
      summary: Get Action Details
      tags:
      - Integrations
      description: Returns the details of a specific action.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/integrations/get-action-details
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          description: "Pass the unique ID of the action to retrieve the action details. \nExample: *52091b28-5daa-42f3-9eb9-926994a91ca5*.\n\
            You can retrieve unique ID of an action using the **Get App Actions** endpoint."
          examples:
          - 09ee5c03-32d1-4a96-9223-e0bf15c9f9bf
        description: "Pass the unique ID of the action to retrieve the action details. \nExample: *52091b28-5daa-42f3-9eb9-926994a91ca5*.\n\
          You can retrieve unique ID of an action using the **Get App Actions** endpoint."
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                    description: Returns the title of the app action.
                    examples:
                    - Action to scan URL
                  description:
                    type: string
                    description: Returns the description of the action.
                    examples:
                    - Enter a valid url to scan
                  action_identifier:
                    type: string
                    description: Returns the unique identifier of the action.
                    examples:
                    - url_scan
                  app_identifier:
                    type: string
                    description: Returns the unique identifier of the app associated with the action.
                    examples:
                    - virus_total_alpha
                  accepted_params:
                    type: array
                    description: Returns the details of the accepted parameters to execute the action.
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Returns the title of the request parameter to perform the action.
                          examples:
                          - url
                        field_key:
                          type: string
                          description: Returns the field key of the request parameter to perform the action.
                          examples:
                          - url
                        field_type:
                          type: string
                          description: Returns the field type of the request parameter to perform the
                            action.
                          examples:
                          - any
                        description:
                          type: string
                          description: Returns the description of the request parameter to perform the
                            action.
                          examples:
                          - Check for malicious activity
                        is_required:
                          type: boolean
                          description: Returns if the parameter is required to perform the action.
                          examples:
                          - 'false'
                        options:
                          type: array
                          description: Returns the configured default values for the parameter.
                          items: {}
                        option_type:
                          type: string
                          description: Returns the type of the default values configured.
                  unique_id:
                    type: string
                    description: Returns the unique ID of the action.
                    examples:
                    - 09ee5c03-32d1-4a96-9223-e0bf15c9f9bf
                  app_unique_id:
                    type: string
                    description: Returns the unique ID of the app associated with the action.
                    examples:
                    - e591047c-8879-4579-b2db-f6a1eae44c15
                  created_by:
                    type: string
                    description: Returns the unique ID of the user who created the action.
                    examples:
                    - 49c5781f-ed52-4e13-ad25-9deffdfba7a8
                  modified_by:
                    type: string
                    description: Returns the unique ID of the user who last modified the action.
                    examples:
                    - 49c5781f-ed52-4e13-ad25-9deffdfba7a8
                  created_at:
                    type: string
                    description: Returns the date and time when the action was created.
                    examples:
                    - '2021-06-30T20:48:22.273Z'
                  modified_at:
                    type: string
                    description: Returns the date and time when the action was last modified.
                    examples:
                    - '2021-09-28T08:47:58.328Z'
                  app_slug:
                    type: string
                    description: Returns the resource identifier of the app associated with the action.
                    examples:
                    - virus_total_alpha_1_0_1
                  connector_version:
                    type: string
                    description: Returns the app version.
                    examples:
                    - 1.0.1
                  app_title:
                    type: string
                    description: Returns the title of the app.
                    examples:
                    - Virus Total Alpha
                  return_values:
                    type: array
                    description: Returns the details of the response parameters you will receive after
                      the action is executed.
                    items: {}
                  system_app:
                    type: boolean
                    description: Returns true if the app is a Cyware app or false if the app is a custom
                      app.
                    examples:
                    - 'false'
                  created_by_data:
                    type: object
                    description: Returns the details of the user who created the action.
                    properties:
                      unique_id:
                        type: string
                        description: Returns the unique ID of the user who created the action.
                        examples:
                        - 49c5781f-ed52-4e13-ad25-9deffdfba7a8
                      first_name:
                        type: string
                        description: Returns the first name of the user who created the action.
                        examples:
                        - Bob
                      last_name:
                        type: string
                        description: Returns the last name of the user who created the action.
                        examples:
                        - David
                      full_name:
                        type: string
                        description: Returns the full name of the user who created the action.
                        examples:
                        - Bob David
                  modified_by_data:
                    type: object
                    description: Returns the details of the user who last modified the action.
                    properties:
                      unique_id:
                        type: string
                        description: Returns the unique ID of the user who last modified the action.
                        examples:
                        - 49c5781f-ed52-4e13-ad25-9deffdfba7a8
                      first_name:
                        type: string
                        description: Returns the first name of the user who last modified the action.
                        examples:
                        - Bob
                      last_name:
                        type: string
                        description: Returns the last name of the user who last modified the action.
                        examples:
                        - David
                      full_name:
                        type: string
                        description: Returns the full name of the user who last modified the action.
                        examples:
                        - Bob David
              example:
                title: Action to scan URL
                description: Enter a valid url to scan
                action_identifier: url_scan
                app_identifier: virus_total_alpha
