    put:
      operationId: deletePersistentStorageObject
      summary: Delete Persistent Storage Object
      tags:
      - Persistent List
      description: Delete a persistent list by passing the unique ID. You can delete the persistent list
        only if it is not used in a playbook. A successful request returns a 200 status code, else the
        response includes a `non_field_error` object.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/persistent-list/delete-persistent-storage-object
      parameters:
      - name: persistent_storage_unique_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the unique ID of the persistent list to retrieve the details. You can retrieve
            the unique ID of a persistent list using the **Get Persistent Lists** endpoint.
          examples:
          - '{persistent_storage_unique_id}'
        description: Pass the unique ID of the persistent list to retrieve the details. You can retrieve
          the unique ID of a persistent list using the **Get Persistent Lists** endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_removed:
                  type: string
                  description: Pass true to delete the persistent list.
                  examples:
                  - 'true'
              required:
              - is_removed
            example:
              is_removed: 'true'
      responses:
        '400':
          description: HTTP 400 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Returns an object explaining why the deletion of the persistent list
                      was unsuccessful.
                    properties:
                      non_field_error:
                        type: string
                        description: Returns the reason the persistent list was not deleted.
                        examples:
                        - This persistent list has associated playbooks
                  status_code:
                    type: number
                    description: Returns a status code for the failure of the deletion. For example, *400*.
                    examples:
                    - '400'
              example:
                result:
                  non_field_error: This persistent list has associated playbooks
                status_code: '400'
