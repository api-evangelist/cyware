                  count:
                    type: number
                    description: Returns the total number of playbooks created by Orchestrate users.
                    examples:
                    - 2791
                  results:
                    type: array
                    description: Returns the list of playbooks as JSON objects.
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          description: Returns the title of the Playbook.
                          examples:
                          - 'BlueCoat :: Enrich IOCs'
                        readable_id:
                          type: string
                          description: Returns the readable ID of the playbook.
                          examples:
                          - PLB3387
                        status:
                          type: string
                          description: Returns the status of the playbook.
                          enum:
                          - active
