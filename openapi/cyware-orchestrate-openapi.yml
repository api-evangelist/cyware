                      \       \"\"\"\n        api_version = \"v2\"\n        url = \"https://api.abuseipdb.com/api\"\
                      \n        self.base_url = \"{0}/{1}\".format(url, api_version)\n        self.api_token\
                      \ = api_token\n\n    def test_connection(self, **kwargs):\n        \"\"\"\n    \
                      \    description: test connection\n        :param kwargs:\n        :return:\n  \
                      \      \"\"\"\n        try:\n            endpoint = self.base_url\n            response\
