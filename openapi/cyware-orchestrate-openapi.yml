  /v1/playbook/run/:
    post:
      operationId: runPlaybook
      summary: Run Playbook
      tags:
      - Playbooks
      description: Run a playbook by passing the playbook unique ID through the payload.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/playbook/run-playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playbook_unique_id:
                  type: string
                  description: Pass the unique ID of the playbook. You can retrieve the unique ID of a
                    playbook using the **Get Playbooks** endpoint.
                  examples:
                  - '{{playbook_unique_id}}'
                data:
                  type: object
                  description: Pass the data or inputs as key-value pairs to run the playbook.
                event:
                  type: string
                  description: Pass the unique ID of the event to fetch the event data for playbook execution.
                    You can retrieve the unique IDs of events using the **Get Source Events** endpoint.
                  examples:
                  - '{{event_unique_id}}'
                runLog:
                  type: string
                  description: Pass the unique ID of the run log to fetch the run log data of playbook
                    execution. You can retrieve the playbook result's unique ID using the **Get Playbook
                    Run Logs** endpoint.
                  examples:
                  - '{{playbook_result_unique_id}}'
                email_notification_details:
                  type: object
                  description: Pass the email addresses to receive notifications when input is required
                    to proceed with the playbook run. Provide a JSON containing `from_email`, `user_emails`,
                    and `redirect_url` to notify external users.
                  properties:
                    user_emails:
                      type: array
                      description: Pass a list of email addresses to notify external users when the playbook
                        requires inputs to proceed with the playbook run.
                      items:
                        type: string
                        description: Pass the email IDs of the users to receive the notifications.
                        examples:
                        - john@cyware.com
                    from_email:
                      type: string
                      description: Pass the email address that will be used to send the email notifications.
                        By default, the system retrieves the `from_email` from the SMTP configuration
                        in Orchestrate.
                      examples:
                      - jane@sample.com
                    redirect_url:
                      type: string
                      description: Pass the redirect URL for the response button in the email. Add the
                        URL of the Orchestrate page where users will be directed after clicking the button.
                      examples:
                      - '{url}'
              required:
              - playbook_unique_id
            example:
              playbook_unique_id: '{{playbook_unique_id}}'
              data: {}
              event: '{{event_unique_id}}'
              runLog: '{{playbook_result_unique_id}}'
              email_notification_details:
                user_emails:
                - john@cyware.com
                from_email: jane@sample.com
                redirect_url: '{url}'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  playbook_result_unique_id:
                    type: string
                    description: Returns the unique ID assigned to the playbook result. You can retrieve
                      the detailed playbook run details using the **Get Playbook Run Log Details** endpoint.
                    examples:
                    - 0b534b3f-7482-4964-9530-a9d7b322e42c
              example:
                playbook_result_unique_id: 0b534b3f-7482-4964-9530-a9d7b322e42c
