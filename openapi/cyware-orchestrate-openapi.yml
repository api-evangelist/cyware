                                    examples:
                                    - false
                          io_params_format:
                            type: object
                            description: Returns a dictionary containing information about the input details
                              of a node.
                          stop_on_error:
                            type: boolean
                            description: Returns true if the abort playbook if the node fails is enabled;
                              otherwise, returns false.
                            examples:
                            - true
                          memory_params:
                            type: object
                            description: Returns the configurations of the memory node.
                          sub_type:
                            type: string
                            description: Returns the sub-type of the node.
                            enum:
                            - PREDEFINED
                            - CUSTOM
                            - PLAYBOOK
                            - EXPRESSION_BASED
                            - STORAGE
                            - START
                            examples:
                            - PREDEFINED
                          condition_type:
                            type: object
                            description: Returns the condition type of the node.
                          io_params_email_details:
                            type: object
                            description: Returns the information related to the email such as the body
                              of the email and subject.
                          enable_io_param_email_details:
                            type: boolean
                            description: Returns whether email notifications are enabled and if the details
                              are configured or not.
                            examples:
                            - false
                          enable_app_notification:
                            type: boolean
                            description: Returns if the email notifications through the platform and mobile
                              app are enabled or not.
                            examples:
                            - false
                  edges:
                    type: array
                    description: Returns the details of the node connection.
                    items:
                      type: object
                      properties:
