                          description: Returns the unique ID that is generated dynamically on playbook
                            creation.
                          examples:
                          - 3a036038-27d2-4ce0-bd9d-9fb8daf27111
                        playbook_last_run:
                          type: string
                          description: Returns date and time when the playbook was last run.
                          examples:
                          - '2022-01-18T08:13:20.325033Z'
                        sub_playbook:
                          type: number
                          description: Returns the number of sub-playbooks.
                          examples:
                          - 0
                        apps_count:
                          type: number
                          description: Returns the number of apps used in the playbook.
                          examples:
                          - 0
                        app_action:
                          type: object
                          description: Returns the app name as the key in the JSON, containing a list
                            of actions.
                        description:
                          type: object
                          description: Returns the description of the playbook.
                        categories:
