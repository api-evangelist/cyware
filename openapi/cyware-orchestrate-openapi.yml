openapi: 3.1.0
info:
  title: Cyware Orchestrate (CO) Open API
  version: v1
  description: 'Public Open API for Cyware Orchestrate, Cyware''s security orchestration, automation and
    response (SOAR) platform. The API covers playbooks (listing, running, run logs, node results, exports,
    bulk terminate), app integrations (apps, app actions, app instances, action execution, custom app
    import), source events, persistent lists (storage manager), code snippets, custom email templates,
    tags, analytics and connectivity/version checks, plus the inbound webhook endpoints used to push events
    into Orchestrate.


    Orchestrate is deployed per tenant, so the server host is the customer''s own Orchestrate deployment;
    the API is mounted under `/soarapi`.


    This document was assembled by API Evangelist from Cyware''s own published, structured API reference
    documents at https://orchestrateapi.cyware.com — each endpoint page is served as machine-readable
    markdown carrying a JSON endpoint model, and every page is indexed from that host''s llms.txt. Paths,
    methods, parameters, descriptions, enumerations and examples are reproduced from those documents;
    nothing is invented.'
  contact:
    name: Cyware
    url: https://www.cyware.com/contact-us
  termsOfService: https://www.cyware.com/legal/terms-of-use
  x-apievangelist-source: https://orchestrateapi.cyware.com/llms.txt
  x-apievangelist-method: generated
externalDocs:
  description: Cyware Orchestrate API Reference
  url: https://orchestrateapi.cyware.com/
servers:
- url: https://{co_host}/soarapi
  description: Tenant Orchestrate deployment. Replace {co_host} with your own Orchestrate host. Cyware
    uses https://demo.cyware.com/soar/ as the example host in the config of its open-source MCP server,
    and its docs reference the /soarapi base path.
  variables:
    co_host:
      default: demo.cyware.com
security:
- coOpenApiSignature: []
tags:
- name: Analytics
  description: Analytics
- name: Authentication
  description: Authentication
- name: Code Snippets
  description: Code Snippets
- name: Custom Email Templates
  description: Custom Email Templates
- name: Events
  description: Events
- name: Integrations
  description: Integrations
- name: Persistent List
  description: Persistent List
- name: Playbooks
  description: Playbooks
- name: Tags
  description: Tags
- name: Webhooks
  description: Webhooks
paths:
  /v1/analytics/data-source/:
    get:
      operationId: mostActiveInstances
      summary: Get Most Active Instances
      tags:
      - Analytics
      description: Returns the most frequently used instances in playbook executions for the non-purged
        data.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/analytics/most-active-instances
      parameters:
      - name: AccessID
        in: query
        required: false
        schema:
          type: string
          description: The Access ID is used to authenticate the Cyware Orchestrate API endpoint.
          examples:
          - 57d008c4-xxxx-4880-xxxx-1feb943d06ac,
        description: The Access ID is used to authenticate the Cyware Orchestrate API endpoint.
      - name: Signature
        in: query
        required: false
        schema:
          type: string
          description: The Signature is used to authenticate the Cyware Orchestrate API endpoint.
          examples:
          - ohaUEcyA8hH3WPUo7Y/QOf+zWY0=
        description: The Signature is used to authenticate the Cyware Orchestrate API endpoint.
      - name: Expires
        in: query
        required: false
        schema:
          type: string
          description: This parameter is used to define an expiry time for the API call.
          examples:
          - 72a48f16-xxxx-4023-xxxx-40f8e58d1f41
        description: This parameter is used to define an expiry time for the API call.
      - name: categorize_by
        in: query
        required: true
        schema:
          type: string
          description: Pass`categorize_by=most_active_instances` to retrieve the most active instances.
          examples:
          - most_active_instances
        description: Pass`categorize_by=most_active_instances` to retrieve the most active instances.
      - name: created__gte
        in: query
        required: false
        schema:
          type: string
          description: Pass the start time in unix time format to retrieve the most active instances.
          examples:
          - '1640131200'
        description: Pass the start time in unix time format to retrieve the most active instances.
      - name: created__lte
        in: query
        required: false
        schema:
          type: string
          description: Pass the end time in unix time format to retrieve the most active instances.
          examples:
          - '1640723199'
        description: Pass the end time in unix time format to retrieve the most active instances.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Returns the analytics data on the most active instance for the specified
                      time range.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: Returns the title of the instance.
                          examples:
                          - Test Instance
                        value:
                          type: number
                          description: Returns the number of times an instance is utilized in playbooks
                            execution.
                          examples:
                          - '8'
              example:
                data:
                - label: Test Instance
                  value: '8'
      x-alternate-documents:
      - title: Get Event Count
        operationId: eventCount
        url: https://orchestrateapi.cyware.com/analytics/event-count
      - title: Get Events With Error
        operationId: eventsWithError
        url: https://orchestrateapi.cyware.com/analytics/events-with-error
      - title: Get Incoming Source Events
        operationId: incomingSourceEvents
        url: https://orchestrateapi.cyware.com/analytics/incoming-source-events
      - title: Get Most Active Actions
        operationId: mostActiveActions
        url: https://orchestrateapi.cyware.com/analytics/most-active-actions
      - title: Get Most Active Apps
        operationId: mostActiveApps
        url: https://orchestrateapi.cyware.com/analytics/most-active-apps
      - title: Get Most Active Playbooks
        operationId: mostActivePlaybook
        url: https://orchestrateapi.cyware.com/analytics/most-active-playbook
      - title: Get Most Used Actions
        operationId: mostUsedActions
        url: https://orchestrateapi.cyware.com/analytics/most-used-actions
      - title: Get Most Used Apps
        operationId: mostUsedApps
        url: https://orchestrateapi.cyware.com/analytics/most-used-apps
      - title: Get Most Used Instance
        operationId: mostUsedInstance
        url: https://orchestrateapi.cyware.com/analytics/most-used-instance
      - title: Get Playbook Average Execution Time
        operationId: playbookAvgExecutionTime
        url: https://orchestrateapi.cyware.com/analytics/playbook-avg-execution-time
      - title: Get Playbook Run Count
        operationId: playbookRunCount
        url: https://orchestrateapi.cyware.com/analytics/playbook-run-count
      - title: Get Unprocessed Events
        operationId: unprocessedEvents
        url: https://orchestrateapi.cyware.com/analytics/unprocessed-events
  /v1/release_version/:
    get:
      operationId: productReleaseVersion
      summary: Product Release Version
      tags:
      - Authentication
      description: Returns the current version of the Orchestrate application.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/authentication/product-release-version
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  release_version:
                    type: string
                    description: Returns the current version of Orchestrate. For example, `3.5.5`
                    examples:
                    - 3.0.4
              example:
                release_version: 3.0.4
  /v1/test_connectivity/:
    get:
      operationId: testConnectivity
      summary: Test Connectivity
      tags:
      - Authentication
      description: Returns the status of the test connectivity with the Orchestrate application.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/authentication/test-connectivity
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns the status of the connection.
                    enum:
                    - ok
                    - invalid credentials
                    examples:
                    - ok
              example:
                status: ok
  /v1/code-snippets/{unique_id}/:
    get:
      operationId: codeSnippetsDetail
      summary: Get Code Snippet Details
      tags:
      - Code Snippets
      description: Returns details of a specific code snippet.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/code-snippets/code-snippets-detail
      parameters:
      - name: unique_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the unique ID of the code snippet to retrieve the details. You can use the
            **Get Code Snippet List** endpoint to retrieve the unique ID of a code snippet.
          examples:
          - '{code_snippet_unique_id}'
        description: Pass the unique ID of the code snippet to retrieve the details. You can use the **Get
          Code Snippet List** endpoint to retrieve the unique ID of a code snippet.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  unique_id:
                    type: string
                    description: Returns the unique ID of the code snippet.
                    examples:
                    - 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                  title:
                    type: string
                    description: Returns the title of the code snippet.
                    examples:
                    - Default Script Template
                  description:
                    type: string
                    description: Returns the description of the code snippet.
                    examples:
                    - This will be the Code Template
                  code:
                    type: string
                    description: Returns the python code added to the code snippet in string format.
                    examples:
                    - "def script_function():\n\treturn 0"
                  is_removed:
                    type: boolean
                    description: Returns if the code snippet is deleted or not.
                    examples:
                    - 'false'
                  created:
                    type: string
                    description: Returns the date and time when the code snippet was created.
                    examples:
                    - '2023-06-07T08:34:05.361364Z'
                  created_by_data:
                    type: object
                    description: Returns the details of the user who created the code snippet.
                    properties:
                      unique_id:
                        type: string
                        description: Returns the unique ID of the user who created the code snippet.
                        examples:
                        - 0832ea94-0252-49b2-80c1-9823b44a3f46
                      first_name:
                        type: string
                        description: Returns the first name of the user who created the code snippet.
                        examples:
                        - john
                      last_name:
                        type: string
                        description: Returns the last name of the user who created the code snippet.
                        examples:
                        - doe
                      full_name:
                        type: string
                        description: Returns the full name of the user who created the code snippet.
                        examples:
                        - john doe
              example:
                unique_id: 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                title: Default Script Template
                description: This will be the Code Template
                code: "def script_function():\n\treturn 0"
                is_removed: 'false'
                created: '2023-06-07T08:34:05.361364Z'
                created_by_data:
                  unique_id: 0832ea94-0252-49b2-80c1-9823b44a3f46
                  first_name: john
                  last_name: doe
                  full_name: john doe
  /v1/code-snippets/:
    get:
      operationId: codeSnippetsList
      summary: Get Code Snippets List
      tags:
      - Code Snippets
      description: Returns the list of code snippets.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/code-snippets/code-snippets-list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve the code snippets list.
          examples:
          - '1'
        description: Pass the page number to retrieve the code snippets list.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of items to retrieve  per page.
          examples:
          - '10'
        description: Pass the number of items to retrieve  per page.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass the title to search for a code snippet.
          examples:
          - example-snippet
        description: Pass the title to search for a code snippet.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    description: Indicates the next and previous URLs of the code snippets list.
                    properties:
                      next:
                        type: string
                        description: Returns the API endpoint to the next page.
                        examples:
                        - code-snippets/?page=2&page_size=1
                  count:
                    type: number
                    description: Returns the total count of the code snippets.
                    examples:
                    - '1'
                  results:
                    type: array
                    description: Returns the list of the code snippets.
                    items:
                      type: object
                      properties:
                        unique_id:
                          type: string
                          description: Returns the unique ID of the code snippet.
                          examples:
                          - 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                        title:
                          type: string
                          description: Returns the title of the code snippet.
                          examples:
                          - Default Script Template
                        description:
                          type: string
                          description: Returns the description of the code snippet.
                          examples:
                          - This will be the Code Template
                        is_removed:
                          type: boolean
                          description: Returns if the code snippet is deleted or not.
                          examples:
                          - 'false'
                        created:
                          type: string
                          description: Returns the date and time when the code snippet was created.
                          examples:
                          - '2023-06-07T08:34:05.361364Z'
                        created_by_data:
                          type: object
                          description: Returns the details of the used who created the code snippet.
                          properties:
                            unique_id:
                              type: string
                              description: Returns the unique ID of the user who created the code snippet.
                              examples:
                              - 0832ea94-0252-49b2-80c1-9823b44a3f46
                            first_name:
                              type: string
                              description: Returns the first name of the user who created the code snippet.
                              examples:
                              - John
                            last_name:
                              type: string
                              description: Returns the last name of the user who created the code snippet.
                              examples:
                              - Doe
                            full_name:
                              type: string
                              description: Returns the full name of the user who created the code snippet.
                              examples:
                              - john doe
              example:
                link:
                  next: code-snippets/?page=2&page_size=1
                count: '1'
                results:
                - unique_id: 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                  title: Default Script Template
                  description: This will be the Code Template
                  is_removed: 'false'
                  created: '2023-06-07T08:34:05.361364Z'
                  created_by_data:
                    unique_id: 0832ea94-0252-49b2-80c1-9823b44a3f46
                    first_name: John
                    last_name: Doe
                    full_name: john doe
  /v1/custom-templates/{unique_id}/:
    get:
      operationId: customTemplateDetail
      summary: Get Custom Email Template Details
      tags:
      - Custom Email Templates
      description: Returns details of a specific custom email template.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/custom-templates/custom-template-detail
      parameters:
      - name: unique_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the unique ID of the custom template. You can retrieve the unique ID of a
            custom email template using the **Get Custom Template List** endpoint.
          examples:
          - '{custom_template_unique_id}'
        description: Pass the unique ID of the custom template. You can retrieve the unique ID of a custom
          email template using the **Get Custom Template List** endpoint.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  unique_id:
                    type: string
                    description: Returns the unique ID of the custom email template.
                    examples:
                    - 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                  title:
                    type: string
                    description: Returns the title of the custom template.
                    examples:
                    - Phishing Template
                  description:
                    type: string
                    description: Returns the description of the custom email template.
                    examples:
                    - This will be the Phishing Template
