                      report\"\n        payload = {\n            \"ip\": ip_address,\n            \"categories\"\
                      : categories,\n            \"comment\": description\n        }\n        response\
                      \ = self.request_handler(\"POST\", endpoint, payload=payload)\n        return response\n\
                      \n    def request_handler(self, method, endpoint, query_params=None,\n         \
                      \               payload=None, **kwargs):\n        \"\"\"\n        description: function\
                      \ used for handling request and response\n        :param method: http method\n \
