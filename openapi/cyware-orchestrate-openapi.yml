  /v1/integrations/apps/:
    get:
      operationId: getApps
      summary: Get Apps
      tags:
      - Integrations
      description: Returns a list of apps from My Apps in Orchestrate.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/integrations/get-apps
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass a value for q to search for apps matching the query string.
        description: Pass a value for q to search for apps matching the query string.
      - name: ordering
        in: query
        required: false
        schema:
          type: string
          description: Use `ordering=title` to sort by title or `ordering=modified_at` to sort by the
            last update date. Add `-` before the parameter to sort in descending order.
        description: Use `ordering=title` to sort by title or `ordering=modified_at` to sort by the last
          update date. Add `-` before the parameter to sort in descending order.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve the apps list.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve the apps list.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of items to retrieve per page.
          default: '10'
          examples:
          - '10'
        description: Pass the number of items to retrieve per page.
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the user ID to retrieve a list of the apps created by a user.
        description: Pass the user ID to retrieve a list of the apps created by a user.
      - name: app_type
        in: query
        required: false
        schema:
          type: string
          description: Pass `READY_TO_USE` to list active apps, `IN_PROGRESS` to list the inactive apps,
            and `INSTALLED` to retrieve apps that are installed.
          enum:
          - IN_PROGRESS
          - READY_TO_USE
          - INSTALLED
        description: Pass `READY_TO_USE` to list active apps, `IN_PROGRESS` to list the inactive apps,
          and `INSTALLED` to retrieve apps that are installed.
      - name: categories
        in: query
        required: false
        schema:
          type: string
          description: Pass the categories to filter apps.
          enum:
          - Authentication
          - Messaging
          - Network Security
          - Configuration Management database(CMDB)
          - Cyware Product
          - Endpoint
          - Data Enrichment & Threat Intelligence
          - Forensics & Malware Analysis
          - Vulnerability Management
          - Case/Ticket Management
          - Email Gateway
          - Analytics & SIEM
          - IT Services
          - Data Loss and Prevention
        description: Pass the categories to filter apps.
      - name: is_system
        in: query
        required: false
        schema:
          type: boolean
          description: Pass false to retrieve custom apps or true to retrieve apps.
          enum:
          - 'true'
          - 'false'
        description: Pass false to retrieve custom apps or true to retrieve apps.
      - name: is_configured
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to get configured apps or false to get non-configured apps.
          enum:
          - 'true'
          - 'false'
        description: Pass true to get configured apps or false to get non-configured apps.
      - name: lite_enabled
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve agent-compatible apps or false to fetch apps that are not
            agent-compatible.
          enum:
          - 'true'
          - 'false'
        description: Pass true to retrieve agent-compatible apps or false to fetch apps that are not agent-compatible.
      - name: created_at
        in: query
        required: false
        schema:
          type: string
          description: Pass the `created_at` value to filter apps created in the last week, month, or
            year.
          enum:
          - last_week
          - last_month
          - last_year
        description: Pass the `created_at` value to filter apps created in the last week, month, or year.
      - name: created_at__gte
        in: query
        required: false
        schema:
          type: string
          description: 'Pass the start time in Unix time format. The list of apps created after the entered
            time will be returned. Example: *1655145000*.'
        description: 'Pass the start time in Unix time format. The list of apps created after the entered
          time will be returned. Example: *1655145000*.'
      - name: created_at__lte
        in: query
        required: false
        schema:
          type: string
          description: 'Pass the end time in Unix time format. The list of apps created before the entered
            time will be returned. Example: *1642530599*.'
        description: 'Pass the end time in Unix time format. The list of apps created before the entered
          time will be returned. Example: *1642530599*.'
