                                    action_identifier:
                                      type: string
                                      description: Returns the unique identifier of the action.
                                      examples:
                                      - check_ip_address
                                    app:
                                      type: string
                                      description: Returns the app name associated with the action.
                                      examples:
                                      - abuse_ipdb
                                    app_slug:
                                      type: string
                                      description: Returns the resource identifier of the app.
                                      examples:
                                      - abuse_ipdb_1_0_0
                                    app_version:
                                      type: string
                                      description: Returns the version of the app used in the playbook.
                                      examples:
                                      - 1.0.0
                                    app_title:
                                      type: string
                                      description: Returns the title of the app associated with the action.
                                      examples:
                                      - AbuseIPDB
                                    action_title:
                                      type: string
                                      description: Returns the title of the action.
                                      examples:
                                      - Get IP Address Reputation Details
                                    is_system:
                                      type: boolean
                                      description: Indicates if the app is a system app or custom app.
                                      examples:
                                      - true
                                output_params:
                                  type: object
                                  description: Returns the node's output parameters if the save node output
                                    option is enabled.
                                save_customized_result:
                                  type: boolean
                                  description: Returns true to save the customized result of the node,
                                    else returns false.
                                  examples:
