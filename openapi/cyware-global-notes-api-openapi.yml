                        examples:
                        - john.doe@cyware.com
                      first_name:
                        type: string
                        description: Returns the first name of the user who created the note.
                        examples:
                        - john
                      id:
                        type: string
                        description: Returns the ID of the user who created the note.
                        examples:
                        - 58a66a94-fe9b-4928-ba44-d38fda6f06f3
                      last_name:
                        type: string
