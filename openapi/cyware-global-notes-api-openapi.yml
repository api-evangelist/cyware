                        examples:
                        - doe
                  id:
                    type: string
                    description: Returns the unique ID of the note.
                    examples:
                    - e30d3246-c793-4f64-ba51-66e418216eeb
                  is_json:
                    type: boolean
                    description: Returns a boolean flag that indicates whether the content of the note is formatted as JSON.
                    examples:
