                        labels:
                          type: array
                          description: Returns any tags associated with the object from the source
                          items: {}
                        source:
                          type: object
                          description: Returns the source details
                          properties:
                            id:
                              type: string
                              description: Returns the source ID.
                              examples:
                              - 003d51d0-d3fd-4442-aa60-7e3d5ec8d93d
                            name:
                              type: string
                              description: Returns the source name.
                              examples:
                              - Import
                            source_type:
                              type: string
                              description: Returns the source type.
                              examples:
                              - CUSTOM_STIX_SOURCES
                        tlp:
                          type: string
                          description: Returns the TLP assigned to the object by the source.
                          examples:
                          - AMBER
              example:
                next: {}
                previous: {}
                total: 2
                page_size: 1
                results:
                - collection:
                    id: decf3ae2-9efd-4c5d-a67c-ea3eba333baa
                    name: Free Text
                  defang_description: 'Detected malicious activity from this address: hxxp://malicious-domain[.]com/path/to/resource'
                  description: 'Detected malicious activity from this address: http://malicious-domain[.]com/path/to/resource'
                  fang_description: 'Detected malicious activity from this address: http://malicious-domain[.]com/path/to/resource'
