    get:
      operationId: enrichThreatData
      summary: Get Enriched Threat Data
      tags:
      - Threat Data Objects
      description: Returns the enriched data of a threat data object using enrichment tools.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data-objects/enrichment/enrich-threat-data
      parameters:
      - name: app_slug
        in: query
        required: true
        schema:
          type: string
          description: Pass the slug of an enrichment tool to retrieve its enriched data. To retrieve the slug of an enrichment tool, use the **GET Enrichment Tools API** endpoint.
          examples:
          - comodo
        description: Pass the slug of an enrichment tool to retrieve its enriched data. To retrieve the slug of an enrichment tool, use the **GET Enrichment Tools API** endpoint.
      - name: value
        in: query
        required: true
        schema:
          type: string
          description: Pass the value of the object. For example, *sco*, *vulnerability*, and more.
          examples:
          - sdo
        description: Pass the value of the object. For example, *sco*, *vulnerability*, and more.
      - name: action_slug
        in: query
        required: false
        schema:
          type: string
          description: Pass the enrichment action name to retrieve specific details. For example, `get_ip` for IPs, `get_domain` for Domain, `get_url` for URL, `get_cve` for Vulnerability.
          examples:
          - get_domain
        description: Pass the enrichment action name to retrieve specific details. For example, `get_ip` for IPs, `get_domain` for Domain, `get_url` for URL, `get_cve` for Vulnerability.
      - name: object_id
        in: query
        required: true
        schema:
          type: string
          description: Pass the ID of an object ID (sco object ID for indicators and vulnerability object ID for vulnerabilities).
          examples:
          - 916e0c84-61a6-412b-a25c-e65d6bcdc96b
        description: Pass the ID of an object ID (sco object ID for indicators and vulnerability object ID for vulnerabilities).
      - name: object_type
        in: query
        required: true
        schema:
          type: string
          description: Pass the object type. SDO object type(indicator /or vulnerability).
          examples:
          - indicator
        description: Pass the object type. SDO object type(indicator /or vulnerability).
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  raw_data:
                    type: object
                    description: Returns the enriched data returned from an enrichment source.
                    properties:
                      asn:
                        type: string
                        description: Returns the ASN assigned the IP.
                        examples:
                        - '13335'
                      undetected_urls:
                        type: array
                        description: Returns the list of associated non-malicious URLs.
                        items:
                          type: array
                          items:
                            type: string
                            description: This is an example value.
                            examples:
                            - http://www.qwhty39.com/
                      undetected_downloaded_samples:
                        type: array
                        description: Returns the list of file samples downloaded from the IP, not flagged as malicious.
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: Returns the scan date.
                              examples:
                              - '2019-08-22 17:44:19'
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '0'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '70'
                            sha256:
                              type: string
                              description: Returns the hash of the file.
                              examples:
                              - a980b60a8922f510d2da527e74ec9443a57dcc65444dbd6a3ae87dceb28090eb
                      detected_downloaded_samples:
                        type: array
                        description: Returns the list of files downloaded that were flagged as malicious.
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: Returns the scan date.
                              examples:
                              - '2018-04-16 02:49:06'
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '23'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '62'
                            sha256:
                              type: string
                              description: Returns the hash of the file.
                              examples:
                              - 0773b94a2e3239eeda0d02f32d8beea116783b48172c116c9b6b382338f8be13
                      response_code:
                        type: string
                        description: Returns the status of the API request.
                        examples:
                        - '1'
                      as_owner:
                        type: string
                        description: Returns the org that owns the ASN.
                        examples:
                        - CLOUDFLARENET
                      detected_referrer_samples:
                        type: array
                        description: Returns a list of files that referenced this IP and were flagged as malicious.
                        items:
                          type: object
                          properties:
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '29'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '67'
                            sha256:
                              type: string
                              description: Returns the hash of the file.
                              examples:
                              - 5ae867ae674046df7d313206fbe5bf8a13e46985e822638d86615687caed7113
                      verbose_msg:
                        type: string
                        description: Returns the status of the message.
                        examples:
                        - IP address in dataset
                      country:
                        type: string
                        description: Returns the country code of the IP address.
                        examples:
                        - AU
                      undetected_referrer_samples:
                        type: array
                        description: Returns the list of samples that referenced the IP but were not flagged as malicious.
                        items:
                          type: object
                          properties:
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '0'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '55'
                            sha256:
                              type: string
                              description: Returns the hash of the file.
                              examples:
                              - d59a490460e82a5fd1fd593fa2910819ac867a6029daccb6f7dd4ab1241ab084
                      detected_urls:
                        type: array
                        description: Returns the list of URLs associated with the IP that were detected as malicious.
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              description: Returns the malicious URL.
                              examples:
                              - https://cuocuopromax.org/
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '1'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '92'
                            scan_date:
                              type: string
                              description: Returns the date of scan.
                              examples:
                              - '2022-04-26 02:01:03'
                      detected_communicating_samples:
                        type: array
                        description: Returns a list of malware samples that communicated with this IP address.
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              description: Returns the scan date.
                              examples:
                              - '2022-04-13 16:35:05'
                            positives:
                              type: string
                              description: Returns the no of detections.
                              examples:
                              - '0'
                            total:
                              type: string
                              description: Indicates the total number of engines that scanned the file, URL, or sample in question.
                              examples:
                              - '73'
                            sha256:
                              type: string
                              description: Returns the hash of the file.
                              examples:
                              - 71a67c5e3ff1cb1455d7aafb6978ccd29de1c4ca6a4b2c0e8395f2c69ed01438
                      resolutions:
                        type: array
                        description: Returns the DNS resolutions where domains pointed to this IP address.
                        items:
                          type: object
                          properties:
                            last_resolved:
                              type: string
                              description: Returns the date the domain last resolved to this IP.
                              examples:
                              - '2019-01-22 12:28:21'
                            hostname:
                              type: string
                              description: Returns the domain name.
                              examples:
                              - 08294765.cn
                      updated:
                        type: number
                        description: Returns the UNIX timestamp of the last update to the enrichment data.
                        examples:
                        - 1651353555
                  parsed_data:
                    type: object
                    description: Returns details of the enriched data.
                    properties:
                      detected_referrer_samples_count:
                        type: number
                        description: Returns the total number of malicious referrer samples.
                        examples:
                        - 100
                      detected_downloaded_samples_count:
                        type: number
