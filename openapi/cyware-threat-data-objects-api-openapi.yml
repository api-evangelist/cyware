  /ingestion/threat-data/action/{action_type}/:
    post:
      operationId: performActionOnThreatDataObject
      summary: Perform Action on Threat Data Object
      tags:
      - Threat Data Objects
      description: Performs an action on a threat data object. You can perform actions such as deprecate, undeprecate, add analyst TLP, add analyst score, and more
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data-objects/quick-action/perform-action-on-threat-data-object
      parameters:
      - name: action_type
        in: path
        required: true
        schema:
          type: string
          description: Pass the action to be performed.
          enum:
          - deprecate
          - un_deprecate
          - reviewed
          - manual_review
          - whitelist
          - un_whitelist
          - false_positive
          - un_false_positive
          - analyst_tlp
          - analyst_score
          - add_tag
          - add_relation
          - delete
          - revoke_intel
          examples:
          - analyst_tlp
        description: Pass the action to be performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_id:
                  type: string
                  description: Pass the ID of a threat data object to perform an action.
                  examples:
                  - 81f699f3-314d-4a6c-a3426b-c5802552c0f7
                object_type:
                  type: string
                  description: Pass the type of threat data object.
                  examples:
                  - malware
                data:
                  type: object
                  description: Pass additional data with the action.
                  properties:
                    analyst_tlp:
                      type: string
                      description: Pass the TLP marked the by analyst.
                      examples:
                      - GREEN
              required:
              - object_id
              - object_type
            example:
              object_id: 81f699f3-314d-4a6c-a3426b-c5802552c0f7
              object_type: malware
              data:
                analyst_tlp: GREEN
      responses:
        '200':
          description: Action Successfully Executed
        '400':
          description: Bad Request (Check if you have passed valid data)
