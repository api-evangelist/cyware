                                type: string
                                description: Returns the source ID.
                                examples:
                                - 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                              name:
                                type: string
                                description: Returns the name of the source.
                                examples:
                                - Feed Source
                              source_type:
                                type: string
                                description: Returns the source type.
                                examples:
                                - RSS_FEED
                        target_ref:
                          type: object
                          description: Returns the details of the target (related) object
                          properties:
                            created:
                              type: number
                              description: Returns the epoch timestamp of when the object was created.
                              examples:
                              - 1745403589
                            id:
                              type: string
                              description: Returns the unique ID of the object.
                              examples:
                              - b45cf121-60fb-43f6-b308-08d2f81cfff9
                            modified:
                              type: number
                              description: Returns the epoch timestamp of when the object was modified.
                              examples:
                              - 1745403589
                            name:
                              type: string
                              description: Returns the object name.
                              examples:
                              - blocktheme.css
                            object_type:
                              type: string
                              description: Returns the object type.
                              examples:
                              - observable
                            sub_type:
                              type: string
                              description: Returns the sub-type of the object.
                              examples:
                              - file
                            tlp:
                              type: string
                              description: Returns the TLP associated with the object.
                              examples:
                              - CLEAR
                  total:
                    type: number
                    description: Returns the total number of relations of the threat data object.
                    examples:
                    - 390
              example:
