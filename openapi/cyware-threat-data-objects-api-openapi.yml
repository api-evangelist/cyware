      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: object_type
        in: path
        required: true
        schema:
          type: string
          description: Pass the type of threat data objects. To get the list of supported object types, see **Supported SDO Types** in **Threat Data** > **Miscellaneous**.
          examples:
          - indicator
        description: Pass the type of threat data objects. To get the list of supported object types, see **Supported SDO Types** in **Threat Data** > **Miscellaneous**.
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the object to retrieve the details. To retrieve a list of object IDs, use the **List Threat Data API** under the Threat Data section.
          examples:
          - b711cafa-719a-4846-93dd-11741f0c10f5
        description: Pass the ID of the object to retrieve the details. To retrieve a list of object IDs, use the **List Threat Data API** under the Threat Data section.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  analyst_description:
                    type: object
                    description: Returns the description given by an analyst.
                  analyst_score:
                    type: object
                    description: Returns the score given by an analyst.
                  analyst_tlp:
                    type: object
                    description: Returns the TLP value given by an analyst.
                  asn:
                    type: object
                    description: Returns the ASN value.
                  attribute_field:
                    type: string
                    description: Specifies the field name that holds the observable's value.
                    examples:
                    - value
                  attribute_value:
                    type: string
                    description: Returns the actual observable or indicator value, such as an IP address, domain name, or file hash.
                    examples:
                    - 47.92.78.238
                  base_type:
                    type: string
                    description: Returns if the object was part of any SDO or has been observed.
                    examples:
                    - sdo
                  confidence_score:
                    type: number
                    description: Returns the confidence score of the object.
                    examples:
                    - 81
                  confidence_type:
                    type: string
                    description: Returns the type of confidence score engine used to calculate the score.
                    examples:
                    - CTIX
                  country:
                    type: string
                    description: Returns the country for a valid object.
                    examples:
                    - China
                  created:
                    type: number
                    description: Returns the STIX defined creation date in epoch format of the object.
                    examples:
                    - 1685352651
                  ctix_created:
                    type: number
                    description: Returns the creation date in epoch format of the object in the CTIX platform .
                    examples:
                    - 1685353115
                  ctix_modified:
                    type: number
                    description: Returns the modified date in epoch format of the object in the CTIX platform .
                    examples:
                    - 1685353115
                  ctix_score:
                    type: number
                    description: Returns the score of an object in Intel Exchange
                    examples:
                    - 81
                  ctix_tlp:
                    type: object
                    description: Returns the TLP of the object in the CTIX platform.
                  defang_analyst_description:
                    type: object
                    description: Returns the defanged description.
                  description:
                    type: object
                    description: Returns the description of the object.
                  fang_analyst_description:
                    type: object
                    description: Returns the fanged description of the object.
                  first_seen:
                    type: object
                    description: Returns the STIX defined date in epoch format on which the object was first observed.
                  last_seen:
                    type: object
                    description: Returns the STIX defined date in epoch format on which the object was last observed.
                  modified:
                    type: number
                    description: Returns the STIX defined date in epoch format on which the object was modified.
                    examples:
                    - 1685352662
                  name:
                    type: string
                    description: Returns the name of the object.
                    examples:
                    - 47.92.78.238
                  sources:
                    type: array
                    description: Returns the list of sources from where the object has been received.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the ID of the source
                          examples:
                          - 99740a47-fb33-4610-90e5-155e1dece960
                        name:
                          type: string
                          description: Returns the name of the source
                          examples:
                          - CrowdStrike
                        source_type:
                          type: string
                          description: Returns the type of sources such as API Feed, RSS Feed, and more.
                          examples:
                          - API_FEEDS
                  sub_type:
                    type: string
                    description: Returns the valid subtype of the object such as an indicator is a valid subtype is a URL, domain, and more.
                    examples:
                    - ipv4-addr
                  tld:
                    type: string
                    description: Returns the Top Level Domain(TLD) value for Domain objects.
                  tlp:
                    type: string
                    description: Returns the TLP of the object.
                    examples:
                    - AMBER
                  type:
                    type: string
                    description: Returns the type of object.
                    examples:
                    - indicator
                  valid_from:
                    type: number
                    description: Returns the STIX defined as valid in epoch format from the date of an object.
                    examples:
                    - 1685352651
                  valid_until:
                    type: number
                    description: Returns the STIX defined as valid in epoch format until the date of an object.
                    examples:
                    - 1745240203
              example:
                analyst_description: {}
                analyst_score: {}
                analyst_tlp: {}
                asn: {}
                attribute_field: value
                attribute_value: 47.92.78.238
                base_type: sdo
                confidence_score: 81
                confidence_type: CTIX
                country: China
                created: 1685352651
                ctix_created: 1685353115
                ctix_modified: 1685353115
                ctix_score: 81
                ctix_tlp: {}
                defang_analyst_description: {}
                description: {}
                fang_analyst_description: {}
                first_seen: {}
                last_seen: {}
                modified: 1685352662
                name: 47.92.78.238
                sources:
                - id: 99740a47-fb33-4610-90e5-155e1dece960
                  name: CrowdStrike
                  source_type: API_FEEDS
                sub_type: ipv4-addr
                tld: ''
                tlp: AMBER
                type: indicator
                valid_from: 1685352651
                valid_until: 1745240203
