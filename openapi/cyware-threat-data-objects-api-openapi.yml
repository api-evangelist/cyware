        description: Pass the threat data object ID. To retrieve the object ID, use the **List Threat Data API** under the Threat Data section. Example, *c39cbf92-1ae6-4952-958a-3f48a90d55f6*.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns the URL of the next page.
                    examples:
                    - threat-data/report/03f74e6e-ad8e-48d2-a7a9-4f3d47940db3/relations/?page=2&page_size=1
                  page_size:
                    type: number
                    description: Returns the number of relations in the page.
                    examples:
                    - 1
                  previous:
                    type: string
                    description: Returns the URL to the previous page.
