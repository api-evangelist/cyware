                page_size: 1
                previous: null
                results:
                - created_by_ref: null
                  id: 22410c4d-c050-4b6e-b0ab-5e0d26e90881
                  is_forward: true
                  is_redacted: false
                  relation_end: null
                  relation_start: null
                  relationship_confidence: null
                  relationship_type: related-to
                  sources:
                  - id: 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                    name: Feed Source
                    source_type: RSS_FEED
                  target_ref:
                    created: 1745403589
                    id: b45cf121-60fb-43f6-b308-08d2f81cfff9
                    modified: 1745403589
                    name: blocktheme.css
                    object_type: observable
                    sub_type: file
                    tlp: CLEAR
                total: 390
