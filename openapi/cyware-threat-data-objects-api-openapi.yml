                              type: string
                              description: Returns the unique identifier of the collection.
                              examples:
                              - decf3ae2-9efd-4c5d-a67c-ea3eba333baa
                            name:
                              type: string
                              description: Returns the name of the collection.
                              examples:
                              - Free Text
