                          type: boolean
                          description: Returns true if this is a reverse relation to the specified threat data object.
                          examples:
                          - false
                        relation_end:
                          type: string
                          description: Returns the epoch timestamp of when the relation ends.
                        relation_start:
                          type: string
                          description: Returns the epoch timestamp of when the relation starts.
                        relationship_confidence:
                          type: string
                          description: Returns the confidence associated with the relation.
                        relationship_type:
                          type: string
                          description: Returns the STIX defined relationship type between the objects.
                          examples:
