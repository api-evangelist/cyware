  /ingestion/threat-data/{object_type}/{object_id}/custom_attributes/:
    get:
      operationId: listCustomAttributesOfThreatDataObject
      summary: Get Custom Attributes List of Threat Data Object
      tags:
      - Threat Data Objects
      description: Retrieves the custom attributes of a threat data object with respect to all the sources the object has received.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data-objects/custom-attributes/list-custom-attributes-of-threat-data-object
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: object_type
        in: path
        required: true
        schema:
          type: string
          description: Pass the type of the object such as indicator, vulnerability, malware, and more.
          examples:
          - report
        description: Pass the type of the object such as indicator, vulnerability, malware, and more.
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the object to retrieve the custom attributes.
          examples:
          - ec572fda-8874-4d58-9e30-7fa961b4c878
        description: Pass the ID of the object to retrieve the custom attributes.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: object
                    description: Returns the URL for the next page.
                  page_size:
                    type: number
                    description: Returns the page size.
                    examples:
                    - 10
                  previous:
                    type: object
                    description: Returns the URL for the previous page.
                  results:
                    type: array
                    description: Returns the list of custom attributes of threat data objects.
                    items:
                      type: object
                      properties:
                        collection:
                          type: object
                          description: Returns the details of the polling collection from which the threat data object was polled
                          properties:
                            id:
                              type: string
                              description: Returns the collection ID.
                              examples:
                              - fb27dd19-2852-4650-80f9-0e6b3545ac7d
                            name:
                              type: string
                              description: Returns the name of the collection.
                              examples:
                              - RSS Feed Collection
                        custom_attribute_count:
                          type: number
                          description: Returns the number of custom attributes associated with the object.
                          examples:
                          - 3
                        id:
                          type: string
                          description: Returns the unique ID of the record.
                          examples:
                          - e2d97257-b61d-484b-9a23-4f3f4d69634b
                        source:
                          type: object
                          description: Returns the source details.
                          properties:
                            id:
                              type: string
                              description: Returns the source ID.
                              examples:
                              - 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                            name:
                              type: string
                              description: Returns the source name.
                              examples:
                              - Y combi
                            source_type:
                              type: string
                              description: Returns the source type.
                              examples:
                              - RSS_FEED
                        source_confidence:
                          type: string
                          description: Returns the source confidence.
                          examples:
                          - HIGH
                        source_confidence_value:
                          type: number
                          description: Returns the source confidence value from 0 to 100.
                          examples:
                          - 0
                        tags:
                          type: array
                          description: Returns the tags associated with the object.
                          items: {}
                  total:
                    type: number
                    description: Returns the total number of sources sharing custom attributes for the threat data object.
                    examples:
                    - 1
              example:
                next: {}
                page_size: 10
                previous: {}
                results:
                - collection:
                    id: fb27dd19-2852-4650-80f9-0e6b3545ac7d
                    name: RSS Feed Collection
                  custom_attribute_count: 3
                  id: e2d97257-b61d-484b-9a23-4f3f4d69634b
                  source:
                    id: 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                    name: Y combi
                    source_type: RSS_FEED
                  source_confidence: HIGH
                  source_confidence_value: 0
                  tags: []
                total: 1
