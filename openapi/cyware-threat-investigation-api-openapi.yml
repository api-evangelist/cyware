                        examples:
                        - ff8fcc0f-4efb-4492-9145-230317fea9c4
                      identifier:
                        type: string
                        description: Returns the internal system identifier of the threat object.
                        examples:
                        - ctix
                      indicator_type:
                        type: string
                        description: Returns the type of the object.
