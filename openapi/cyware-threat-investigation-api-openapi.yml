  /conversion/investigation/create-intel/:
    post:
      operationId: createDraft
      summary: Create Draft
      tags:
      - Threat Investigation
      description: Creates intel in the draft state from the details retrieved from the threat investigation.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-investigation/publishing/create-draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Pass a title for the intel.
                  examples:
                  - visualizer test 1.1
                create_stix:
                  type: boolean
                  description: Pass True to create intel in draft state.
                  examples:
                  - 'true'
                items:
                  type: array
                  description: Pass the details of the report object.
                  items:
                    type: object
                    properties:
                      t:
                        type: string
                        description: Pass the value of the threat data object or the relationship type.
                        examples:
                        - 125.56.67.79
                      prop:
                        type: object
                        description: Pass any additional information about the threat data object or the relationship type.
                        properties:
                          identifier:
                            type: string
                            description: Pass the internal system identifier for the threat object.
                            examples:
                            - added
                          label:
                            type: string
                            description: Pass the label for the object type.
                            examples:
                            - IP
                          type:
                            type: string
                            description: Pass the type of the object.
                            examples:
                            - url
                          parent_type:
                            type: string
                            description: Indicates the category or origin class of the data object being added.
                            examples:
                            - indicator
                      id:
                        type: string
                        description: Pass the ID of the threat data object or the relationship type.
                        examples:
                        - node--54c79961-6d09-4c95-b152-6645dcc757cc
                      type:
                        type: string
                        description: Pass one of the following values
                        enum:
                        - node
                        - link
                        examples:
                        - node
                      added_node:
                        type: boolean
                        description: Pass a boolean flag that marks whether this node is newly introduced in this create-intel operation.
                        examples:
                        - 'true'
                    required:
                    - t
                    - prop
                    - id
                    - type
              required:
              - title
              - create_stix
            example:
              title: visualizer test 1.1
              create_stix: 'true'
              items:
              - t: 125.56.67.79
                prop:
                  identifier: added
                  label: IP
                  type: url
                  parent_type: indicator
                id: node--54c79961-6d09-4c95-b152-6645dcc757cc
                type: node
                added_node: 'true'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                    description: A background task has been initiated to create the intel.
                    examples:
                    - You will be notified once the STIX is created
              example:
                details: You will be notified once the STIX is created
      x-alternate-documents:
      - title: Create Intel
        operationId: createIntel
        url: https://ctixapiv3.cyware.com/threat-investigation/publishing/create-intel
  /ingestion/investigation/edges/:
    post:
      operationId: listExistingRelationships
      summary: List Existing Relationships
      tags:
      - Threat Investigation
      description: Returns the relationship types that exist between two threat data objects.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-investigation/relationship/list-existing-relationships
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  description: Pass a list of threat data object IDs.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - 24859c8e-5482-4d07-a47c-f263d4c1e490
              required:
              - ids
            example:
              ids:
              - 24859c8e-5482-4d07-a47c-f263d4c1e490
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: object
                    description: Returns the pagination link to the next page.
                  previous:
                    type: object
                    description: Returns the pagination link to the previous page.
                  total:
                    type: number
                    description: Returns the total number of items on a page.
                    examples:
                    - '1'
                  results:
                    type: array
                    description: Returns the relationship details between threat data objects.
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Returns the relationship type of the object.
                          examples:
                          - link
                        id:
                          type: string
                          description: Returns the ID of the relation ship type that exists between two threat data objects.
                          examples:
                          - 24859c8e-5482-4d07-a47c-f263d4c1e490647d880d-d100-47a0-bcbf-d01f85d75d4d
                        a2:
                          type: boolean
                          description: A boolean flag indicating the direction or orientation of the relationship.
                          examples:
                          - 'true'
                        id1:
                          type: string
                          description: Returns the ID of the source threat data object.
                          examples:
                          - 24859c8e-5482-4d07-a47c-f263d4c1e490
                        id2:
                          type: string
                          description: Returns the ID of the target threat data object.
                          examples:
                          - 647d880d-d100-47a0-bcbf-d01f85d75d4d
                        t:
                          type: object
                          description: Returns the STIX relationship type.
                        hi:
                          type: boolean
                          description: Returns `true` if the threat data object is hidden from the threat investigations canvas, else returns `false`.
                          examples:
                          - 'false'
                        prop:
                          type: object
                          description: Returns the details of the relationships.
                          properties:
                            relation:
                              type: object
                              description: Returns the relationship between two threat data objects.
                              properties:
                                type:
                                  type: object
                                  description: Specifies the semantic nature of the relationship
                                label1:
                                  type: string
                                  description: Returns the type of the source entity in the relationship.
                                  examples:
                                  - domain-name
                                label2:
                                  type: string
                                  description: Returns the type of the target entity in the relationship.
                                  examples:
                                  - indicator
                        dt:
                          type: array
                          description: Returns a list of timestamps indicating when the relationship was established or last updated.
                          items:
                            type: number
                            description: This is an example value.
                            examples:
                            - '1634536777'
                  page_size:
                    type: number
                    description: Returns the number of results per page.
                    examples:
                    - '10'
              example:
                next: {}
                previous: {}
                total: '1'
                results:
                - type: link
                  id: 24859c8e-5482-4d07-a47c-f263d4c1e490647d880d-d100-47a0-bcbf-d01f85d75d4d
                  a2: 'true'
                  id1: 24859c8e-5482-4d07-a47c-f263d4c1e490
                  id2: 647d880d-d100-47a0-bcbf-d01f85d75d4d
                  t: {}
                  hi: 'false'
                  prop:
                    relation:
                      type: {}
                      label1: domain-name
                      label2: indicator
                  dt:
                  - '1634536777'
                page_size: '10'
