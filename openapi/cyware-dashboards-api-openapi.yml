  /ingestion/analytics/widget/{widget_slug}/data/:
    get:
      operationId: retrieveWidgetData
      summary: Get Widget Data
      tags:
      - Dashboards
      description: Returns the data returned by a widget based on the widget configuration.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/dashboards/widgets/retrieve-widget-data
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: widget_slug
        in: path
        required: true
        schema:
          type: string
          description: 'Pass the slug of a widget. You can retrieve the slug using the **List Widgets** API. For example: *ioc_vs_allowed*.'
        description: 'Pass the slug of a widget. You can retrieve the slug using the **List Widgets** API. For example: *ioc_vs_allowed*.'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  '0':
                    type: object
                    description: Returns the label and value of the aggregated widget data.
                    properties:
                      label:
                        type: string
                        description: Returns the label of the widget data.
                        examples:
                        - indicator
                      value:
                        type: number
                        description: Returns the value of the widget data.
                        examples:
                        - 34207
                  '1':
                    type: object
                    properties:
                      label:
                        type: string
                        examples:
                        - vulnerability
                      value:
                        type: number
                        examples:
                        - 32866
                  '2':
                    type: object
                    properties:
                      label:
                        type: string
                        examples:
                        - observable
                      value:
                        type: number
                        examples:
                        - 704
              example:
                '0':
                  label: indicator
                  value: 34207
                '1':
                  label: vulnerability
                  value: 32866
                '2':
                  label: observable
                  value: 704
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
