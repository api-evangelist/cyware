                              custom_attributes:
                                type: object
                                description: Pass the custom attribute names and the attribute value in key-value pairs. The custom attribute name must start with `x_`. For example, `x_identity`.
                                properties:
                                  x_custom_attribute1:
                                    type: string
                                    description: This is an example value.
