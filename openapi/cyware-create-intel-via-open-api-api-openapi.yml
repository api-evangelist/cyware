  /ingestion/ingestion-api/ingest_bundle/:
    post:
      operationId: withSourceAndCollectionId
      summary: With Source and Collection ID
      tags:
      - Create Intel via Open API
      description: "Use this API to ingest a STIX bundle into Intel Exchange by specifying the source and collection ID. A STIX bundle can include any combination of STIX Domain Objects (SDOs). For more information on supported objects, see the [STIX documentation](https://docs.oasis-open.org/cti/stix/v2.1/csprd01/stix-v2.1-csprd01.html).\n\n<Callout attributes='{\"isFitToPage\":true,\"dataType\":\"info\",\"style\":{\"width\":\"100%\",\"minWidth\":\"100%\"}}'>\n  <p>If you pass an invalid or missing <code class=\"slate-code\">source_id</code> or <code class=\"slate-code\">collection_id</code>, the bundle is ingested with the source set to <strong class=\"slate-bold\">Import</strong> and the collection set to <strong class=\"slate-bold\">STIX2</strong>.</p>\n</Callout>"
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/create-intel-via-open-api/ingest-bundle/with-source-and-collection-id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_id:
                  type: string
                  description: Pass the unique identifier for the source of the bundle being ingested.
                  examples:
                  - d2ab6414-416d-4dba-a23c-fde56a75a17a
                source_type:
                  type: string
                  description: Pass the type of the source. For example, `CUSTOM_STIX_SOURCES`.
                  examples:
                  - CUSTOM_STIX_SOURCES
                collection_id:
                  type: string
                  description: Pass the unique identifier for the collection that should receive the bundle.
                  examples:
                  - 7e8fbe54-abf1-4f5b-82b0-21eb7d9e7fdc
                bundle:
                  type: object
                  description: Pass the STIX bundle that includes one or more STIX objects.
                  properties:
                    type:
                      type: string
                      description: Pass the type of the bundle.
                      examples:
                      - bundle
                    id:
                      type: string
                      description: Pass a unique identifier for the bundle.
                      examples:
                      - bundle--73128ede-df7b-42cb-b073-a04b59acf898
                    objects:
                      type: array
                      description: Pass an array of STIX objects contained in the bundle.
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            description: Pass the object type. For example, `indicator`, `malware`, `threat_actor`.
                            examples:
                            - indicator
                          spec_version:
                            type: string
                            description: Pass the STIX specification version used for the object.
                            examples:
                            - '2.1'
                          id:
                            type: string
                            description: Pass a unique identifier for the specific STIX object.
                            examples:
                            - indicator--88359550-45b9-41d3-9bbd-69bfbb994593
                          created:
                            type: string
                            description: Pass the timestamp when the object was created.
                            examples:
                            - '2024-09-30T10:42:06.935776Z'
                          modified:
                            type: string
                            description: Pass the timestamp when the object was modified.
                            examples:
                            - '2024-09-30T10:42:06.935776Z'
                          name:
                            type: string
                            description: Pass a human-readable name or description of the object.
                            examples:
                            - 205.165.206.118
                          pattern:
                            type: string
                            description: 'Pass the detection pattern that defines the indicator''s characteristics. For example, `[url:value = ''http: //affected-domains.com/test'']`.'
                            examples:
                            - '[ipv4-addr:value = ''205.165.206.118'']'
                          pattern_type:
                            type: string
                            description: Pass the type of pattern used. For example, `stix`.
                            examples:
                            - stix
                          pattern_version:
                            type: string
                            description: Pass the version of the pattern specification. For example, `2.1`.
                            examples:
                            - '2.1'
                          valid_from:
                            type: string
                            description: Pass the timestamp from which the indicator is considered valid.
                            examples:
                            - '2024-09-30T10:42:06.935776Z'
                        required:
                        - type
                        - spec_version
                        - id
                        - created
                        - modified
                        - pattern
                        - pattern_type
                        - valid_from
                  required:
                  - type
                  - id
                  - objects
              required:
              - source_id
              - source_type
              - collection_id
              - bundle
            example:
              source_id: d2ab6414-416d-4dba-a23c-fde56a75a17a
              source_type: CUSTOM_STIX_SOURCES
              collection_id: 7e8fbe54-abf1-4f5b-82b0-21eb7d9e7fdc
              bundle:
                type: bundle
                id: bundle--73128ede-df7b-42cb-b073-a04b59acf898
                objects:
                - type: indicator
                  spec_version: '2.1'
                  id: indicator--88359550-45b9-41d3-9bbd-69bfbb994593
                  created: '2024-09-30T10:42:06.935776Z'
                  modified: '2024-09-30T10:42:06.935776Z'
                  name: 205.165.206.118
                  pattern: '[ipv4-addr:value = ''205.165.206.118'']'
                  pattern_type: stix
                  pattern_version: '2.1'
                  valid_from: '2024-09-30T10:42:06.935776Z'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Returns whether the bundle ingestion was successful.
                    examples:
                    - true
                  message:
                    type: string
                    description: Returns additional details about the ingestion process.
                    examples:
                    - Successfully sent bundle to ingestion.
              example:
                success: true
                message: Successfully sent bundle to ingestion.
      x-alternate-documents:
      - title: With Source and Collection Name
        operationId: withSourceAndCollectionName
        url: https://ctixapiv3.cyware.com/create-intel-via-open-api/ingest-bundle/with-source-and-collection-name
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
