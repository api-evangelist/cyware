  /ingestion/rules/one-rule/:
    get:
      operationId: runRule
      summary: Run Rule
      tags:
      - Rules
      description: Runs a rule asynchronously on the existing threat data created in the specified time interval.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/rules/run-rule
      parameters:
      - name: end_time
        in: query
        required: true
        schema:
          type: string
          description: Filters threat data objects that are created before the passed timestamp value.
          examples:
          - <epoch_time>
        description: Filters threat data objects that are created before the passed timestamp value.
      - name: rule
        in: query
        required: true
        schema:
          type: string
          description: Pass the unique ID of a rule.
          examples:
          - <rule_id>
        description: Pass the unique ID of a rule.
      - name: start_time
        in: query
        required: true
        schema:
          type: string
          description: Filters threat data objects that are created after the passed timestamp value.
          examples:
          - <epoch_time>
        description: Filters threat data objects that are created after the passed timestamp value.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                    description: Returns the details of the rule execution.
                    examples:
                    - Rule is running
              example:
                details: Rule is running
