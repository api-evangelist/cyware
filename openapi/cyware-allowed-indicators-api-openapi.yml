          examples:
          - 'true'
        description: Pass true to list third-party ignored indicators in Intel Exchange.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
          examples:
          - '10'
        description: Pass the number of records to retrieve on each page.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass the domain to search in the third-party ignored indicator list.
          examples:
          - instagram.com
        description: Pass the domain to search in the third-party ignored indicator list.
      - name: type
        in: query
        required: false
        schema:
          type: string
          description: Pass the type of indicator to filter records.
          enum:
          - domain_name
        description: Pass the type of indicator to filter records.
      - name: created_by_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of a user who added the indicators in the third-party allowed indicator list.
          examples:
          - 4711af0a-6e72-45f7-832f-0d4e7d6beb55
        description: Pass the ID of a user who added the indicators in the third-party allowed indicator list.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the created time in epoch format.
          examples:
          - '1685923200'
        description: Pass the created time in epoch format.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the created time in epoch format.
          examples:
          - '1690847999'
        description: Pass the created time in epoch format.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_refreshed:
                    type: number
                    description: Returns the last refreshed time of the ignored list.
                    examples:
                    - '1690761710'
                  next:
                    type: object
                    description: Returns a link to the next page.
                  page_size:
                    type: number
                    description: Returns the number of records returned per page.
                    examples:
                    - '10'
                  previous:
                    type: object
                    description: Returns a link to the previous page.
                  results:
                    type: array
                    description: Returns a list of ignored indicator objects.
                    items:
                      type: object
                      properties:
                        created:
                          type: string
                          description: Returns the time when the indicator was added to the ignored list.
                          examples:
                          - '2023-06-05T13:43:29.205251Z'
                        created_by:
                          type: object
                          description: Returns the details of the user who added the indicator to the ignored list.
                          properties:
