  /conversion/allowed_indicators/parse-ioc/:
    post:
      operationId: parseIoc
      summary: Parse IOC
      tags:
      - Allowed Indicators
      description: Parse the IOCs provided by the user. Further, validate and categorize the IOCs as valid or invalid.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/indicators-allowed/parse-ioc
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Pass the type of IOCs.
                  enum:
                  - ipv4-addr
                  - ipv6-addr
                  - autonomous-system
                  - email-addr
                  - MD5
                  - SHA-1
                  - SHA-224
                  - SHA-256
                  - SHA-384
                  - SHA-512
                  - SSDEEP
                  - url
                  - cidr
                  - domain-name
                  - mutex
                  - windows-registry-key
                  - user-agent
                  examples:
                  - ipv4-addr
                values:
                  type: string
                  description: Pass the value of the IOC.
                  examples:
                  - 23.32.23.121 12.23.3.3
            example:
              type: ipv4-addr
              values: 23.32.23.121 12.23.3.3
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid_ioc:
                    type: array
                    description: Returns a list of valid parsed IOCs.
                    items:
                      type: string
                      description: This is an example value.
                      examples:
                      - 23.32.23.121
                  invalid_ioc:
                    type: array
                    description: Returns a list of invalid parsed IOCs.
                    items: {}
              example:
                valid_ioc:
                - 23.32.23.121
                invalid_ioc: []
