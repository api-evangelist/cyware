                            first_name:
                              type: string
                              description: Returns the first name of the user who added the indicator to the ignored list.
                              examples:
                              - John
                            id:
                              type: string
                              description: Returns the ID of the user who added the indicator to the ignored list.
                              examples:
                              - ff4843c4-1b36-4703-92e9-6b5d4b300f59
                            last_name:
                              type: string
                              description: Returns the last name of the user who added the indicator to the ignored list.
                        id:
                          type: string
                          description: Returns the ID of the indicator.
                          examples:
                          - ab2c26d0-ccc7-44df-b5bc-f68b96f4c3c0
                        is_removed:
                          type: number
                          description: Returns if the indicator is removed.
                          examples:
                          - '0'
                        modified:
                          type: string
                          description: Returns the time when the indicator was last modified in the ignored list.
                          examples:
                          - '2023-06-05T13:43:29.205251Z'
                        modified_by:
                          type: object
                          description: Returns the details of the user who last modified the indicator in the ignored list.
                          properties:
                            email:
                              type: string
                              description: Returns the email address of the user who modified the indicator to the ignored list.
                              examples:
                              - john.doe@cyware.com
                            first_name:
                              type: string
                              description: Returns the first name of the user who modified the indicator to the ignored list.
                              examples:
                              - John
                            id:
                              type: string
                              description: Returns the ID of the user who modified the indicator to the ignored list.
                              examples:
                              - ff4843c4-1b36-4703-92e9-6b5d4b300f59
                            last_name:
                              type: string
                              description: Returns the last name of the user who modified the indicator to the ignored list.
                        source_name:
                          type: string
                          description: Returns the name of the third-party allowed indicator repository.
                          examples:
