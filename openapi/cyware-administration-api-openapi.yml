              name: Priority Score
              helptext: Determines the urgency of addressing the IOC based on current context
              field_type: select
              values:
              - High
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Returns a success message after creating the custom score.
