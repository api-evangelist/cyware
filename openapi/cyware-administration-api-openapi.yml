  /rest-auth/users/{user-id}/:
    put:
      operationId: updateUser
      summary: Update User
      tags:
      - Administration
      description: Updates the details of a user.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/users-and-groups/users/update-user
      parameters:
      - name: user-id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the user to update details.
          examples:
          - 19f7a767-eab7-4057-920b-d971617e5070
        description: Pass the ID of the user to update details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: Pass the first name of the user.
                  examples:
                  - John
                last_name:
                  type: string
                  description: Pass the last name of the user.
                  examples:
                  - Doe
                is_active:
                  type: boolean
                  description: Pass True to make a profile active. Else pass False.
                  examples:
                  - 'true'
                contact_number:
                  type: string
                  description: Pass the phone number or mobile number of the user.
                  examples:
                  - '9876543210'
                country_code:
                  type: string
                  description: Pass the country code in which the user is located.
                  examples:
                  - '91'
                email_alerts:
                  type: boolean
                  description: Pass True if the user wants to receive email alerts on the associated email ID from Intel Exchange. Else, pass False.
                  examples:
                  - 'false'
                sms_alerts:
                  type: boolean
                  description: Pass True if the user wants to receive the sms alerts on the associated contact number from Intel Exchange. Else pass False.
                  examples:
                  - 'false'
                groups:
                  type: array
                  description: Pass the list of permission groups for your user.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Pass the unique group ID for the user.
                        examples:
                        - 780bef65-201e-4f68-b924-57f2689e7af0
                      name:
                        type: string
                        description: Pass the name of the permission group.
                        examples:
                        - Admin
                allowed_tlp:
                  type: array
                  description: Pass the list of allowed TLPs a user can access in the threat data. You can access threat data information for all TLPs if no TLP value is passed.
                  enum:
                  - NONE
                  - WHITE
                  - GREEN
                  - AMBER
                  - RED
                  items:
                    type: string
                    description: Pass the TLP value for the user.
                    examples:
                    - RED
                username:
                  type: string
                  description: Pass the LDAP username of the user.
                  examples:
                  - JohnDoe
                default_page_size:
                  type: number
                  description: Pass the default page size for listing APIs for the user.
                  examples:
                  - '10'
              required:
              - first_name
              - last_name
              - groups
              - username
            example:
              first_name: John
              last_name: Doe
              is_active: 'true'
              contact_number: '9876543210'
              country_code: '91'
              email_alerts: 'false'
              sms_alerts: 'false'
              groups:
              - id: 780bef65-201e-4f68-b924-57f2689e7af0
                name: Admin
              allowed_tlp:
              - RED
              username: JohnDoe
              default_page_size: '10'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                    description: Returns the status of an API success.
                    examples:
                    - Successfully updated
              example:
                details: Successfully updated
    get:
      operationId: userDetails
      summary: Get User Details
      tags:
      - Administration
      description: Returns the user details of a user.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/users-and-groups/users/user-details
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: user-id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the user to retrieve details.
          examples:
          - 19f7a767-eab7-4057-920b-d971617e5070
        description: Pass the ID of the user to retrieve details.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the unique ID of the user. This ID is used across Intel Exchange to perform actions.
                    examples:
                    - cf0e148b-5f7a-4f05-8f4d-081fa1743231
                  first_name:
                    type: string
                    description: Returns the first name of the user.
                    examples:
                    - John
                  last_name:
                    type: string
                    description: Returns the last name of the user.
                    examples:
                    - Doe
                  email:
                    type: string
                    description: Returns the Intel Exchange associated email address of the user. The user receives all Intel Exchange related emails and information on this email address.
                    examples:
                    - johndoe@orgname.com
                  is_active:
                    type: boolean
                    description: Returns True if the user is active in Intel Exchange, else returns False.
                    examples:
                    - 'true'
                  contact_number:
                    type: string
                    description: Returns the contact details, like mobile or telephone number, of the user.
                    examples:
                    - '9876543219'
                  country_code:
                    type: string
                    description: Returns the country code in which the user is located.
                    examples:
                    - '91'
                  user_id:
                    type: string
                    description: Returns the unique ID for the user. This ID is used across Intel Exchange to perform actions.
                    examples:
                    - cf0e148b-5f7a-4f05-8f4d-081fa1743231
                  created:
                    type: number
                    description: Returns the date and time of the creation of the user.
                    examples:
                    - '1645200748'
                  invited_by:
                    type: object
                    description: Returns the details of the user who created this user in Intel Exchange in the form of a dictionary.
                    properties:
                      id:
                        type: string
                        description: Returns the unique identifier of the inviter.
                        examples:
                        - 010f5d90-f510-40e5-82a0-dd90f4546dd2
                      first_name:
                        type: string
                        description: Returns the first name of the inviter.
                        examples:
                        - FirstName
                      last_name:
                        type: string
                        description: Returns the last name of the inviter.
                        examples:
                        - LastName
                      email:
                        type: string
                        description: Returns the email address of the inviter.
                        examples:
                        - username@domain.com
                      is_active:
                        type: boolean
                        description: Returns true if the inviter's account is active, otherwise returns false.
                        examples:
                        - 'true'
                      contact_number:
                        type: string
                        description: Returns the inviter's contact number.
                      country_code:
                        type: string
                        description: Returns the inviter's country code.
                        examples:
                        - '91'
                  invite_status:
                    type: string
                    description: Returns the invitation status of the user, such as ACCEPTED or INVITED.
                    examples:
                    - INVITED
                  email_alerts:
                    type: boolean
                    description: Returns True if the user wants to receive email alerts on the Intel Exchange associated email address, else returns False.
                    examples:
                    - 'true'
                  sms_alerts:
                    type: boolean
                    description: Returns True if the user wants to receive SMS alerts on the Intel Exchange associated contact number, else returns False.
                    examples:
                    - 'true'
                  groups:
                    type: array
                    description: Returns the list of associated user groups for the user. This includes the group ID and the name of the group.
                    items: {}
                  allowed_tlp:
                    type: array
                    description: Returns the list of allowed TLPs from which a user can access and view threat data. You can access threat data from all TLPs if TLPs are not selected.
                    items:
                      type: string
