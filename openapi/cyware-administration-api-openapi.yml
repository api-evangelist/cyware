  /conversion/feed-sources/email/{email_source_id}/folders/:
    get:
      operationId: retrieveEmailFolders
      summary: Get Email Folders
      tags:
      - Administration
      description: Retrieve a list of the folders of an email source.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/integration-management/email-feed-source/retrieve-email-folders
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: email_source_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the email source ID to retrieve details of the email source.
          examples:
          - 1dc46660-8e5c-4a8e-9bcc-484608f3b502
        description: Pass the email source ID to retrieve details of the email source.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  folders:
                    type: array
                    description: Returns the list of email folders available in the connected email account.
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Returns the unique folder ID.
                          examples:
                          - 150
                        display_name:
                          type: string
                          description: Returns the display folder name.
                          examples:
                          - myfolder
                        sub_folders:
                          type: array
                          description: Returns the list of nested folders.
                          items:
                            type: object
                            description: Returns the list of subfolders in the folder.
                            properties:
                              id:
                                type: number
                                description: Returns the unique identifier of the subfolder.
                                examples:
                                - 151
                              display_name:
                                type: string
                                description: Returns the display subfolder name.
                                examples:
                                - subfolder
                              sub_folders:
                                type: array
                                description: Returns the list of nested subfolders.
                                items: {}
                              name:
                                type: string
                                description: Returns the name of the nested subfolder.
                                examples:
                                - myfolder/subfolder
                              create_intel_feed:
                                type: boolean
                                description: Returns the full internal path or name of the folder.
                                examples:
                                - false
                              allowed_to_fetch:
                                type: boolean
                                description: Determines whether the system is allowed to fetch emails from this folder.
                                examples:
                                - false
                        name:
                          type: string
                          description: Returns the name of the folder.
                          examples:
                          - myfolder
                        create_intel_feed:
                          type: boolean
                          description: Returns true if the intel has to be created from the messages in the folder, else returns false.
                          examples:
                          - false
                        allowed_to_fetch:
                          type: boolean
                          description: Returns true if the messages can be polled from the folder, else returns false.
                          examples:
                          - false
              example:
                folders:
                - id: 150
                  display_name: myfolder
                  sub_folders:
                  - id: 151
                    display_name: subfolder
                    sub_folders: []
                    name: myfolder/subfolder
                    create_intel_feed: false
                    allowed_to_fetch: false
                  name: myfolder
                  create_intel_feed: false
                  allowed_to_fetch: false
