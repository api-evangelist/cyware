  /rest-auth/users/bulk-actions/:
    post:
      operationId: bulkUpdate
      summary: Update User Status in Bulk
      tags:
      - Administration
      description: Perform bulk operations like activating, deactivating, and unblocking the users.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/users-and-groups/users/bulk-update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Pass the action the administrator wants to apply in bulk to users in Intel Exchange.
                  enum:
                  - activate
                  - deactivate
                  - unblock
                  examples:
                  - activate
                ids:
                  type: array
                  description: Pass the list of user IDs on which the bulk action has to be applied.
                  items:
                    type: string
                    description: Pass the user ID to perform the action on.
                    examples:
                    - defb41db-937a-4a88-b47c-53fa6d220807
              required:
              - action
              - ids
            example:
              action: activate
              ids:
              - defb41db-937a-4a88-b47c-53fa6d220807
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                    description: Returns the success message that the action has been applied.
                    examples:
                    - Action applied successfully
              example:
                details: Action applied successfully
  /rest-auth/users/:
    post:
      operationId: createUser
      summary: Add User
      tags:
      - Administration
      description: Adds a user in Intel Exchange.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/users-and-groups/users/create-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: Pass the first name of the user.
                  examples:
                  - John
                last_name:
                  type: string
                  description: Pass the last name of the user.
                  examples:
                  - Doe
                username:
                  type: string
                  description: Pass the LDAP username associated with a user.
                  examples:
                  - JohnDoe
                email:
                  type: string
                  description: Pass the Intel Exchange associated email ID of the user to whom all the emails will go.
                  examples:
                  - johndoe@orgname.com
                groups:
                  type: array
                  description: Pass the list of permission groups where the user is enlisted.
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Pass the unique ID of the permission group.
                        examples:
                        - f055f579-da54-467c-a2c4-6aea083945c6
                is_active:
                  type: boolean
                  description: Pass True to make a profile active. Else pass False.
                  examples:
                  - true
                contact_number:
                  type: string
                  description: Pass the contact details, like the phone number or mobile number of the user.
                  examples:
                  - '9876543219'
                country_code:
                  type: string
                  description: Pass the country code in which the user is located.
                  examples:
                  - '91'
                email_alerts:
                  type: boolean
                  description: Pass True if the user wants to receive email alerts on the associated Intel Exchange email ID. Else pass False.
                  examples:
                  - true
                sms_alerts:
                  type: boolean
                  description: Pass True if the user wants to receive SMS alerts on the Intel Exchange associated contact number. Else pass False.
                  examples:
                  - true
                allowed_tlp:
                  type: array
                  description: Pass the list of allowed TLPs that a user can access and view threat data. If no TLPs have been selected, the user can access threat data from all TLPs.
                  enum:
                  - NONE
                  - WHITE
                  - GREEN
                  - AMBER
                  - RED
                  items:
                    type: string
                    description: Pass the TLP value to associate with the user.
                    examples:
                    - WHITE
              required:
              - first_name
              - last_name
              - username
              - email
              - groups
            example:
              first_name: John
              last_name: Doe
              username: JohnDoe
              email: johndoe@orgname.com
              groups:
              - id: f055f579-da54-467c-a2c4-6aea083945c6
              is_active: true
              contact_number: '9876543219'
              country_code: '91'
              email_alerts: true
              sms_alerts: true
              allowed_tlp:
              - WHITE
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the unique ID for the user. This ID is used across the Intel Exchange application to perform actions.
                    examples:
                    - cf0e148b-5f7a-4f05-8f4d-081fa1743231
                  first_name:
                    type: string
                    description: Returns the first name of the user.
                    examples:
                    - John
                  last_name:
                    type: string
                    description: Returns the last name of the user.
                    examples:
                    - Doe
                  email:
                    type: string
                    description: Returns the Intel Exchange associated email ID of the user to whom Intel Exchange sends all the emails.
                    examples:
                    - johndoe@orgname.com
                  is_active:
                    type: boolean
                    description: Returns True if the user is active on the platform, else returns False.
                    examples:
                    - true
                  contact_number:
                    type: string
                    description: Returns the contact details like mobile or telephone number of the user.
                    examples:
                    - '9876543219'
                  country_code:
                    type: string
                    description: Returns the country code of the user where the user is located.
                    examples:
                    - '91'
                  user_id:
                    type: string
                    description: Returns the unique ID of the user. This ID is used across the Intel Exchange application to perform actions.
                  email_alerts:
                    type: boolean
                    description: Returns True if the user wants to receive email alerts on the Intel Exchange associated email address, else returns False.
                    examples:
                    - true
                  sms_alerts:
                    type: boolean
                    description: Returns True if the user wants to receive SMS alerts on the Intel Exchange associated contact number, else returns False.
                    examples:
                    - true
                  allowed_tlp:
                    type: array
                    description: Returns the list of allowed TLPs from which a user can access and view threat data. You can access threat data from all TLPs if no TLPs are selected.
                    items:
                      type: string
                      description: Returns the TLP value to which the user has access to.
                      examples:
                      - WHITE
                  details:
                    type: string
                    description: Returns the status of an API success.
                    examples:
                    - Successfully Created
              example:
                id: cf0e148b-5f7a-4f05-8f4d-081fa1743231
                first_name: John
                last_name: Doe
                email: johndoe@orgname.com
                is_active: true
                contact_number: '9876543219'
                country_code: '91'
                user_id: ''
                email_alerts: true
                sms_alerts: true
                allowed_tlp:
                - WHITE
                details: Successfully Created
    get:
      operationId: retrieveUsers
      summary: Get Users
      tags:
      - Administration
      description: Returns the list of Intel Exchange users in a paginated format.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/users-and-groups/users/retrieve-users
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records to retrieve on each page.
          default: '10'
          examples:
          - '10'
        description: Pass the number of records to retrieve on each page.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the epoch time to filter users created after this timestamp.
          examples:
          - '1622658600'
        description: Pass the epoch time to filter users created after this timestamp.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the epoch time to filter users created before this timestamp.
          examples:
          - '1622744999'
        description: Pass the epoch time to filter users created before this timestamp.
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to include only active users in the response.
          examples:
          - 'false'
        description: Pass true to include only active users in the response.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass the field to sort the user listing based on the field provided. The order can be reversed by prepending `-` before the key. For example, `-created`.
          enum:
          - created
          - name
          - last_active_session
        description: Pass the field to sort the user listing based on the field provided. The order can be reversed by prepending `-` before the key. For example, `-created`.
      - name: invited_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the user ID to filter users who were invited by a specific user.
          examples:
          - 9e2b0468-2a06-410e-bf3e-f5b29e17b077
        description: Pass the user ID to filter users who were invited by a specific user.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass a search keyword to filter users by matching `first_name`, `last_name`, or `email`. The search is case-insensitive.
          examples:
          - cyw
        description: Pass a search keyword to filter users by matching `first_name`, `last_name`, or `email`. The search is case-insensitive.
      - name: is_blocked
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve only blocked users. Pass false to retrieve only unblocked users.
          examples:
          - 'false'
        description: Pass true to retrieve only blocked users. Pass false to retrieve only unblocked users.
      - name: invite_status
        in: query
        required: false
        schema:
          type: string
          description: Pass the invite status to filter users based on whether they have accepted the invite.
          enum:
          - ACCEPTED
          - INVITED
          examples:
          - INVITED
        description: Pass the invite status to filter users based on whether they have accepted the invite.
      - name: activity_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the epoch timestamp to filter users who have been active after this point in time.
          examples:
          - '1624290146'
        description: Pass the epoch timestamp to filter users who have been active after this point in time.
      - name: activity_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the epoch timestamp to filter users who have been active before this point in time.
          examples:
          - '1624299145'
        description: Pass the epoch timestamp to filter users who have been active before this point in time.
      - name: group
        in: query
        required: false
        schema:
          type: string
          description: Pass the permission group ID to filter users belonging to a specific group.
          examples:
          - 139e4dc0-1eb6-443b-8809-f5b4417fee81
        description: Pass the permission group ID to filter users belonging to a specific group.
      responses:
        '200':
          description: HTTP 200 response
          content:
            json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns the URL endpoint of the next page.
                  previous:
                    type: string
                    description: Returns the URL endpoint of the previous page.
                  page_size:
                    type: number
                    description: Returns the number of records on the page.
                    examples:
                    - 10
                  count:
                    type: number
                    description: Returns the total number of results available.
                    examples:
                    - 1
                  results:
                    type: array
                    description: Returns a list of user objects with detailed information.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID assigned to the user. This ID is used across the Intel Exchange application to perform various actions.
                          examples:
                          - 92a767f5-a080-42cd-9407-e186af56f08b
                        first_name:
                          type: string
                          description: Returns the first name of the user.
                          examples:
                          - FirstName
                        last_name:
                          type: string
                          description: Returns the last name of the user.
                          examples:
                          - LastName
                        email:
                          type: string
                          description: Returns the associated email ID of the user on which Intel Exchange sends all the emails.
                          examples:
                          - username@domain.com
                        contact_number:
                          type: string
                          description: Returns the mobile or telephone number of the user.
                        country_code:
                          type: string
                          description: Returns the country code of the user.
                        user_id:
                          type: string
                          description: Returns the unique ID of the user. This ID is used across the Intel Exchange application to perform various actions.
                          examples:
                          - 92a767f5-a080-42cd-9407-e186af56f08b
                        username:
                          type: string
                          description: Returns the LDAP username associated with a user.
                          examples:
                          - UserName
                        invite_status:
                          type: string
                          description: Returns the invitation status of the user, such as Accepted or Invited.
                          examples:
                          - INVITED
                        image_url:
                          type: string
                          description: Return the URL link of the image.
                        is_active:
                          type: boolean
                          description: Returns True if the user is active on the platform. Else returns False.
                          examples:
                          - true
                        is_blocked:
                          type: boolean
                          description: 'Returns True if the user is blocked, else returns False.

                            A user can get blocked if the user has entered the wrong password more than a defined number of times.'
                          examples:
                          - false
                        last_active_session:
                          type: number
                          description: Returns the last active date and time of the user.
                          examples:
                          - 0
                        created:
                          type: number
                          description: Returns the date and time at which the user was created.
                          examples:
                          - 1645189359
                        invited_by:
                          type: object
                          description: Returns the details of the user who created a new user in the form of a dictionary.
                          properties:
                            id:
                              type: string
                              description: Returns the unique identifier of the inviter.
                              examples:
                              - 010f5d90-f510-40e5-82a0-dd90f4546dd2
                            first_name:
                              type: string
                              description: Returns the first name of the inviter.
                              examples:
                              - FirstName
                            last_name:
                              type: string
                              description: Returns the last name of the inviter.
                              examples:
                              - LastName
                            email:
                              type: string
                              description: Returns the email address of the inviter.
                              examples:
                              - username@domain.com
                            is_active:
                              type: boolean
                              description: Returns true if the inviter's account is active. Else, returns false.
                              examples:
                              - true
                            contact_number:
                              type: string
                              description: Returns the inviter's contact number.
                            country_code:
                              type: string
                              description: Returns the inviter's country code.
                              examples:
                              - '91'
                        user_groups:
                          type: array
                          description: Returns the list of associated groups for the user, which includes the group ID and the name of the group.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Returns the unique ID of the user group.
                                examples:
                                - 78a61669-d874-4424-b678-8862452e710f
                              name:
                                type: string
                                description: Returns the name of the user group.
                                examples:
                                - group
                  active_count:
                    type: number
                    description: Returns the number of users who are active.
                    examples:
                    - 1
              example:
                next: ''
                previous: ''
                page_size: 10
                count: 1
                results:
                - id: 92a767f5-a080-42cd-9407-e186af56f08b
                  first_name: FirstName
                  last_name: LastName
                  email: username@domain.com
                  contact_number: ''
                  country_code: ''
                  user_id: 92a767f5-a080-42cd-9407-e186af56f08b
                  username: UserName
                  invite_status: INVITED
                  image_url: ''
                  is_active: true
                  is_blocked: false
                  last_active_session: 0
                  created: 1645189359
                  invited_by:
                    id: 010f5d90-f510-40e5-82a0-dd90f4546dd2
                    first_name: FirstName
                    last_name: LastName
                    email: username@domain.com
                    is_active: true
                    contact_number: ''
                    country_code: '91'
                  user_groups:
                  - id: 78a61669-d874-4424-b678-8862452e710f
                    name: group
                active_count: 1
