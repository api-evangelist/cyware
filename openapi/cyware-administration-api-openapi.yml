                        modified:
                          type: number
                          description: Returns the modified date and time in epoch format.
                          examples:
                          - '1629889385'
                        parsing_error:
                          type: string
                          description: Returns the errors encountered while parsing the data.
                          examples:
                          - '[]'
                        empty_error:
                          type: string
                          description: Returns the logs cases where the data returned was empty.
                          examples:
                          - '[]'
                        status_error:
                          type: string
                          description: Indicates issues related to HTTP response or source availability.
                          examples:
                          - '[]'
                        polling:
                          type: object
                          description: Returns the polling configuration, such as polling type, time, status, and more.
                          properties:
                            status:
                              type: boolean
                              description: Returns the whether polling is currently enabled.
                              examples:
                              - 'true'
                            polled_once:
                              type: boolean
                              description: Indicates if polling has ever occurred.
                              examples:
                              - 'false'
                            type:
                              type: string
                              description: Returns the type of polling, either manual or automatic.
                              examples:
                              - M
                            polling_time:
                              type: number
                              description: Returns the polling frequency in seconds.
                              examples:
                              - '0'
                            last_polling_time:
                              type: number
                              description: Returns the epoch timestamp of the last successful polling attempt.
                              examples:
                              - '0'
                        mapping:
                          type: array
                          description: Returns the mapping configurations such as headers, type and more.
                          items:
                            type: object
                            properties:
                              headers:
                                type: string
                                description: Returns the raw value extracted from the data.
                                examples:
                                - 1.234.20.244
                              value_key:
                                type: string
                                description: Returns the descriptive label for the data source column.
                                examples:
                                - Column 0
                              is_selected:
                                type: boolean
                                description: Whether this column/field is selected for processing.
                                examples:
                                - 'true'
                              type:
                                type: string
                                description: Returns the type of the value.
                                examples:
                                - IPV4
                        content:
                          type: string
                          description: Returns the content type such as text, CSV, JSON.
                          examples:
                          - csv
                        headers:
                          type: object
                          description: Returns additional header configurations if required for parsing.
                        custom_object_name:
                          type: object
                          description: Returns the optional name for a custom object if applicable.
                        separator:
                          type: string
                          description: Returns the separator.
                          examples:
                          - ;
              example:
                next: {}
                previous: {}
                page_size: '10'
                total: '1'
