  /integration/apps/{integration_app_id}/action_configs/:
    get:
      operationId: retrieveActionConfiguration
      summary: Get Action Configurations
      tags:
      - Administration
      description: Retrieves all the actions of an account.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/integration-management/tool-integrations/actions/retrieve-action-configuration
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve per page.
          default: '10'
        description: Pass the number of records to retrieve per page.
      - name: integration_app_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the third-party tool.
          examples:
          - ba4b209c-51cb-4b13-bbdf-955ea6ae50c2
        description: Pass the ID of the third-party tool.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: Returns the list of action configurations.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Returns the name of the account.
                          examples:
                          - test
                        third_party_config_id:
                          type: string
                          description: Returns the account ID of the tool.
                          examples:
                          - 5a5027ea-757d-45b2-9ccd-6a068b12baf9
                        is_active:
                          type: boolean
                          description: Returns true if the account is active, else returns false.
                          examples:
                          - 'true'
                        actions:
                          type: array
                          description: Returns the list of configured for the account.
                          items:
                            type: object
                            properties:
                              polling_type:
                                type: string
                                description: Returns A if the polling type is configured as automatic, whereas returns M if the polling type is configured as manual.
                                examples:
                                - M
                              action_config_id:
                                type: string
                                description: Returns the configuration ID of the action.
                                examples:
                                - 333ecee9-78cf-4f16-b68e-4a590f5eb1c8
                              connector_name:
                                type: string
                                description: Returns the name of the tool associated with this account.
                                examples:
                                - Virus Total
                              name:
                                type: string
                                description: Returns the name of action.
                                examples:
                                - test
                              poll_frequency:
                                type: number
                                description: Returns the frequency of polling if the polling type is automatic.
                                examples:
                                - '0'
                              last_polled:
                                type: object
                                description: Returns the date and time at which the action was last polled in epoch format.
                              action_slug:
                                type: string
                                description: Returns the slug value of the tool. The slug refers to a human-readable unique identifier that can be used to identify a resource.
                                examples:
                                - get_ip
                              component:
                                type: string
                                description: Returns the component of action, such as IP, hash, URL, domain, or more.
                                examples:
                                - ioc-ip
                              is_active:
                                type: boolean
                                description: Returns true if the action is active, else returns false.
                                examples:
                                - 'true'
                              third_party_action_id:
                                type: string
                                description: Returns the unique identifier for the external (third-party) action.
                                examples:
                                - fe0dff7b-3e61-45e6-ba5b-59927cef0a6c
                              collection_id:
                                type: string
                                description: Returns the collection ID.
                              is_configured:
                                type: boolean
                                description: Returns True if the action is configured, else returns false.
                                examples:
                                - 'true'
                              modified:
                                type: string
                                description: Returns the date and time when the action was last modified.
                                examples:
                                - '2021-08-09T12:06:39.483288Z'
                        quota:
                          type: object
                          description: Returns the quota details such as total, available, used, and more.
              example:
                results:
                - name: test
                  third_party_config_id: 5a5027ea-757d-45b2-9ccd-6a068b12baf9
                  is_active: 'true'
                  actions:
                  - polling_type: M
                    action_config_id: 333ecee9-78cf-4f16-b68e-4a590f5eb1c8
                    connector_name: Virus Total
                    name: test
                    poll_frequency: '0'
                    last_polled: {}
                    action_slug: get_ip
                    component: ioc-ip
                    is_active: 'true'
                    third_party_action_id: fe0dff7b-3e61-45e6-ba5b-59927cef0a6c
                    collection_id: ''
                    is_configured: 'true'
                    modified: '2021-08-09T12:06:39.483288Z'
                  quota: {}
