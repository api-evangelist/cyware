        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of policy to view the details.
          examples:
          - bd3af43c-2008-4e19-92c3-1738c80ae1c6
        description: Pass the ID of policy to view the details.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the policy ID.
                    examples:
                    - 33479bb3-b9bc-43e2-bacb-9a79b900c7d1
                  name:
                    type: string
                    description: Returns the name of the policy.
                    examples:
                    - cx
                  is_active:
                    type: boolean
                    description: Returns true if the policy is active, else returns false.
                    examples:
                    - 'true'
                  all_collections:
                    type: boolean
                    description: Returns true if the policy is configured to receive intel from all collections, else returns false.
                    examples:
                    - 'false'
                  all_sources:
                    type: boolean
                    description: Returns true if the policy is configured to receive intel from all sources, else returns false.
                    examples:
                    - 'false'
                  all_inbox_collections:
                    type: boolean
                    description: Returns true if the policy is configured to receive intel from all inbox type sources, else returns false.
                    examples:
                    - 'false'
                  status:
                    type: string
                    description: Returns the status of the policy as Active or Inactive.
                    examples:
                    - ACTIVE
                  created_by:
                    type: string
                    description: Returns the ID of the user who created the policy.
                    examples:
                    - 1d5984de-9abf-437f-8a84-7692506b633e
                  updated_by:
                    type: string
                    description: Returns the ID of the user who last modified the policy.
                    examples:
                    - 987aa2e6-7be2-4f5d-846b-b4950600e666
                  priority:
                    type: number
                    description: Returns the priority of the policy.
                    examples:
                    - '1'
                  created:
                    type: number
                    description: Returns the date and time at which the policy was created in epoch format.
                    examples:
                    - '1641813470'
                  modified:
                    type: number
                    description: Returns the date and time at which the policy was last modified in epoch format.
                    examples:
                    - '1641879762'
                  enrichment_run_type:
                    type: string
                    description: Returns the execution style of the policy as sequential or parallel.
                    examples:
                    - sequentially
                  object_type:
                    type: string
                    description: Returns the type of threat data you want to enrich.
                    examples:
                    - ip
                  enrichment:
                    type: array
                    description: Returns the list of enrichment sources used to enrich the threat data.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID of the enrichment integration.
                          examples:
                          - 3736af52-5eed-46e0-a1c8-d578bc5feb68
                        order:
                          type: number
                          description: Returns the execution order of the enrichment tool.
                          examples:
                          - '0'
                        app_name:
                          type: string
                          description: Returns the name of the enrichment application.
                          examples:
                          - APIVoid
                        app_slug:
                          type: string
                          description: Returns the slug of the enrichment application.
                          examples:
                          - apivoid
                        is_active:
                          type: boolean
                          description: Returns the status of whether the enrichment integration is active.
                          examples:
                          - 'true'
                        third_party_logo:
                          type: string
                          description: Returns the path to the logo of the enrichment provider.
                          examples:
                          - /2627744746342/Integration_APIVoid.png
                  component:
                    type: string
                    description: Returns the type of threat data.
                    examples:
                    - indicator
                  policy_source:
                    type: object
                    description: Returns the list of policy sources.
                    properties:
                      inbox:
                        type: array
                        description: Returns the list of inbox sources.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Returns the unique identifier for the inbox.
                              examples:
                              - 3f1f1efb-9d25-4bc7-a606-851b1b7c711a
                            name:
                              type: string
                              description: Returns the name of the inbox source.
                              examples:
                              - Testf
                            type:
                              type: string
                              description: Returns the source type.
                              examples:
                              - DATA_FEED
                            inbox:
                              type: boolean
                              description: Returns whether the source is an inbox.
                              examples:
                              - 'true'
                            created:
                              type: number
                              description: Returns the epoch timestamp when the inbox was created.
                              examples:
                              - '1641556894'
                            polling:
                              type: boolean
                              description: Returns whether polling is enabled for the inbox.
                              examples:
                              - 'true'
                            is_active:
                              type: boolean
                              description: Returns the activation status of the inbox.
                              examples:
                              - 'true'
                            description:
                              type: string
                              description: Returns the description of the inbox.
                              examples:
                              - Testf
                            is_editable:
                              type: boolean
                              description: Returns whether the inbox configuration is editable.
                              examples:
                              - 'true'
                            has_subscribed:
                              type: object
                              description: Returns subscription-related details.
                      source:
                        type: array
                        description: Returns the list of individual sources targeted by the policy.
                        items: {}
                      collection:
                        type: array
                        description: Returns the list of collections targeted by the policy.
                        items: {}
                  rule:
                    type: array
                    description: Returns the list of conditions applied to the policy.
                    items: {}
                  is_apply_condition:
                    type: boolean
                    description: Returns true if the policy is configured with any conditions, else returns false.
                    examples:
                    - 'false'
              example:
                id: 33479bb3-b9bc-43e2-bacb-9a79b900c7d1
                name: cx
                is_active: 'true'
                all_collections: 'false'
                all_sources: 'false'
                all_inbox_collections: 'false'
                status: ACTIVE
                created_by: 1d5984de-9abf-437f-8a84-7692506b633e
                updated_by: 987aa2e6-7be2-4f5d-846b-b4950600e666
                priority: '1'
                created: '1641813470'
                modified: '1641879762'
                enrichment_run_type: sequentially
                object_type: ip
                enrichment:
                - id: 3736af52-5eed-46e0-a1c8-d578bc5feb68
                  order: '0'
                  app_name: APIVoid
                  app_slug: apivoid
                  is_active: 'true'
                  third_party_logo: /2627744746342/Integration_APIVoid.png
                component: indicator
                policy_source:
                  inbox:
                  - id: 3f1f1efb-9d25-4bc7-a606-851b1b7c711a
                    name: Testf
                    type: DATA_FEED
                    inbox: 'true'
                    created: '1641556894'
                    polling: 'true'
                    is_active: 'true'
                    description: Testf
                    is_editable: 'true'
                    has_subscribed: {}
                  source: []
                  collection: []
                rule: []
                is_apply_condition: 'false'
  /integration/apps/actions/:
    get:
      operationId: enrichmentTools1
      summary: Get Enrichment Tool List
      tags:
      - Administration
      description: Returns the list of enrichment tools configured in Intel Exchange.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/enrichment-management/enrichment-tools/enrichment-tools-1
      parameters:
      - name: action_name
        in: query
        required: false
        schema:
          type: string
          description: Specify a list of comma-separated action names.
          enum:
          - get_ip
          - get_domain
          - get_url
          - get_cve
        description: Specify a list of comma-separated action names.
      - name: full_list
        in: query
        required: false
        schema:
          type: string
          description: Pass true to retrieve tools grouped by individual actions rather than as a flat list.
          examples:
          - 'true'
        description: Pass true to retrieve tools grouped by individual actions rather than as a flat list.
      - name: component
        in: query
        required: false
        schema:
          type: string
          description: Pass the name of the component to return only those enrichment tools that are applicable to that specific module.  For example, if you specify the component as investigation,  it returns only those apps whose enrichment is supported in threat investigation.
          examples:
          - investigation
        description: Pass the name of the component to return only those enrichment tools that are applicable to that specific module.  For example, if you specify the component as investigation,  it returns only those apps whose enrichment is supported in threat investigation.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip:
                    type: array
                    description: Returns the list of enrichment apps that support IP address indicators.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique identifier of the enrichment app.
                          examples:
                          - ad3fb208-dff4-4cc4-992c-80d2f9dd6863
                        app_name:
                          type: string
                          description: Returns the name of the app.
                          examples:
                          - AbuseIPDB
                        app_slug:
                          type: string
                          description: Returns the slug of the app.
                          examples:
                          - abuseipdb
                        is_active:
                          type: boolean
                          description: Returns true if the enrichment app is currently active.
                          examples:
                          - 'false'
                  domain:
                    type: array
                    description: Returns the enrichment apps that support domain name indicators.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID of the domain-based enrichment app.
                          examples:
                          - d2d2e661-182d-4ed8-9d2a-fc0bc68b41e2
                        app_name:
                          type: string
                          description: Returns the name of the app.
                          examples:
                          - Alexa Ranking
                        app_slug:
                          type: string
                          description: Returns the slug of the app.
                          examples:
                          - alexa_ranking
                        is_active:
                          type: boolean
                          description: Returns true if the enrichment app is currently active.
                          examples:
                          - 'false'
                  hash:
                    type: array
                    description: Returns the enrichment apps that support file hash indicators.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID of the hash-based enrichment app.
                          examples:
                          - 82030132-7ac1-423d-b438-35108f10004d
                        app_name:
                          type: string
                          description: Returns the name of the tool.
                          examples:
                          - Alien Vault
                        app_slug:
                          type: string
                          description: Returns the Slug value of the tool.
                          examples:
                          - alien_vault
                        is_active:
                          type: boolean
                          description: Returns true if the tool is active, else returns false.
                          examples:
                          - 'false'
                  url:
                    type: array
                    description: Returns the enrichment apps that support URL indicators.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the ID of the tool.
                          examples:
                          - d2d2e661-182d-4ed8-9d2a-fc0bc68b41e2
                        app_name:
                          type: string
                          description: Returns the name of the tool.
                          examples:
                          - Alexa Ranking
                        app_slug:
                          type: string
                          description: Returns the Slug value of the tool.
                          examples:
                          - alexa_ranking
                        is_active:
                          type: boolean
                          description: Returns true if the tool is active, else returns false.
                          examples:
                          - 'false'
                  cve:
                    type: array
                    description: Returns the enrichment apps that support CVE identifiers.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the ID of the tool.
                          examples:
                          - c6c41165-d2d0-4686-b425-93c888f70af7
                        app_name:
                          type: string
                          description: Returns the name of the tool.
                          examples:
                          - CVE Details
                        app_slug:
                          type: string
                          description: Returns the Slug value of the tool.
                          examples:
                          - cve_details
                        is_active:
                          type: boolean
                          description: Returns true if the tool is active, else returns false.
                          examples:
                          - 'false'
              example:
                ip:
                - id: ad3fb208-dff4-4cc4-992c-80d2f9dd6863
                  app_name: AbuseIPDB
                  app_slug: abuseipdb
                  is_active: 'false'
                domain:
                - id: d2d2e661-182d-4ed8-9d2a-fc0bc68b41e2
                  app_name: Alexa Ranking
                  app_slug: alexa_ranking
                  is_active: 'false'
                hash:
                - id: 82030132-7ac1-423d-b438-35108f10004d
                  app_name: Alien Vault
                  app_slug: alien_vault
                  is_active: 'false'
                url:
                - id: d2d2e661-182d-4ed8-9d2a-fc0bc68b41e2
                  app_name: Alexa Ranking
                  app_slug: alexa_ranking
                  is_active: 'false'
                cve:
                - id: c6c41165-d2d0-4686-b425-93c888f70af7
                  app_name: CVE Details
                  app_slug: cve_details
                  is_active: 'false'
    put:
      operationId: updateAction
      summary: Update Action
      tags:
      - Administration
      description: Updates a particular action of an account.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/integration-management/tool-integrations/actions/update-action
      parameters:
      - name: integration_app_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of the third-party tool.
          examples:
          - 079ed40b-01f6-4c00-9119-6db7afc6bc6f
        description: Pass the ID of the third-party tool.
      - name: integration_action_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of the action of tool.
          examples:
          - ad45f197-0768-42ea-af4c-1acee0eee19f
        description: Pass the ID of the action of tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: Pass true to activate the action, else pass false.
                  examples:
                  - 'false'
                third_party_config_id:
                  type: string
                  description: Pass the ID of the account to activate or deactivate.
                  examples:
                  - '{{integration_account_id}}'
              required:
              - is_active
              - third_party_config_id
            example:
              is_active: 'false'
              third_party_config_id: '{{integration_account_id}}'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  component:
                    type: string
                    description: Returns the component of action, such as IP, hash, URL, domain, or more.
                    examples:
                    - rule
                  id:
                    type: string
                    description: Returns the ID of the action.
                    examples:
                    - 0f63dfa6-88ce-42fc-bebe-c3d43cbe97e4
                  is_active:
                    type: boolean
                    description: Returns true if the action is configured, else returns false.
                    examples:
                    - 'true'
                  is_configured:
                    type: boolean
                    description: Returns true if the action is configured, else returns false.
                    examples:
                    - 'false'
                  name:
                    type: string
                    description: Returns the name of action.
                    examples:
                    - '-'
                  polling_time:
                    type: integer
                    description: Returns the polling frequency configured for the action.
                    examples:
                    - '0'
                  polling_type:
                    type: string
                    description: Returns A if the polling type is automatic, whereas it returns M if the polling type is manual.
                    examples:
                    - A
                  related_fields:
                    type: object
                    description: Returns any related fields that are defined for the action.
                  slug:
                    type: string
                    description: Returns the slug value of the tool. The slug refers to a human-readable unique identifier that can be used to identify a resource.
                    examples:
                    - trigger_rule_v3
                  working_status:
                    type: string
                    description: Returns the action status, such as if the action is in a working state or not.
              example:
                component: rule
                id: 0f63dfa6-88ce-42fc-bebe-c3d43cbe97e4
                is_active: 'true'
                is_configured: 'false'
                name: '-'
                polling_time: '0'
                polling_type: A
                related_fields: {}
                slug: trigger_rule_v3
                working_status: ''
