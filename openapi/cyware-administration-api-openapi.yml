                      first_name:
                        type: string
                        description: Returns the user's first name.
                        examples:
                        - john
                      id:
                        type: string
                        description: Returns the unique identifier of the user.
                        examples:
                        - a2b82e81-8e7d-4e68-8a36-3d2d9cd518ad
                      last_name:
                        type: string
                        description: Returns the user's last name.
                  name:
                    type: string
                    description: Returns the name of the kill chain.
