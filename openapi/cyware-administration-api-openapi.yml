    get:
      operationId: refreshIngestionData
      summary: Refresh Ingestion Data
      tags:
      - Administration
      description: 'Triggers a recomputation of the ingestion overview data.


        ### Changelog


        <Accordion attributes=''{"style":{"width":"100%"}}''>

        <AccordionItem title="Release v3.7.7.1" iconUrl=""><p>Added a new endpoint to refresh the ingestion data in License Management.</p></AccordionItem>

        </Accordion>'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/license-management-system/refresh-ingestion-data
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns the status of the recomputation.
                    examples:
                    - success
                  elapsed_ms:
                    type: number
                    description: Returns the time taken to recompute the data in milliseconds.
                    examples:
                    - 1077
                  refreshed_at:
                    type: string
                    description: Returns the timestamp when the data was recomputed.
                    examples:
                    - '2026-05-26T10:07:30.148188+00:00'
                  log_id:
                    type: string
                    description: Returns the unique ID of the recomputation log.
                    examples:
                    - 7568f8bd-1304-44b3-a90c-066b43a54288
              example:
                status: success
                elapsed_ms: 1077
                refreshed_at: '2026-05-26T10:07:30.148188+00:00'
                log_id: 7568f8bd-1304-44b3-a90c-066b43a54288
  /ingestion/analytics/ingestion-overview/data/:
    get:
      operationId: retrieveIngestionOverviewDara
      summary: Retrieve Ingestion Overview Dara
      tags:
      - Administration
      description: 'Retrieves ingestion counts broken down by source and collection across three time windows.


        ### Changelog


        <Accordion attributes=''{"style":{"width":"100%"}}''>

        <AccordionItem title="Release v3.7.7.1" iconUrl=""><p>Added a new endpoint for retrieving the ingestion data in License Management.</p></AccordionItem>

        </Accordion>'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/license-management-system/retrieve-ingestion-overview-dara
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    description: Returns the list of source-collection ingestion records.
                    items:
                      type: object
                      properties:
                        source_id:
                          type: string
                          description: Returns the unique ID of the source.
                          examples:
                          - c2ca3df4-05f2-481b-b0d0-23000fc24218
                        collection_id:
                          type: string
                          description: Returns the unique ID of the collection.
                          examples:
                          - 0ba7a9b7-dda7-46f0-a7c3-0ff1e272f52a
                        source_name:
                          type: string
                          description: Returns the name of the source.
                          examples:
                          - research.checkpoint
                        collection_name:
                          type: string
                          description: Returns the name of the collection.
                          examples:
                          - research.checkpoint
                        collection_title:
                          type: string
                          description: Returns the display title of the collection. Returns `null` if not set.
                          examples:
                          - research.checkpoint
                        label:
                          type: string
                          description: Returns the combined source and collection label in the format `source_name` / `collection_name`.
                          examples:
                          - research.checkpoint / research.checkpoint
                        count_24h:
                          type: number
                          description: Returns the number of objects ingested in the last 24 hours.
                          examples:
                          - 0
                        count_24_48h:
                          type: number
                          description: Returns the number of objects ingested between 24 and 48 hours ago.
                          examples:
                          - 0
                        count_48h_7d:
                          type: number
                          description: Returns the number of objects ingested between 48 hours and 7 days ago.
                          examples:
                          - 81
                  refreshed_at:
                    type: number
                    description: Returns the Unix timestamp of when the ingestion data was last computed.
                    examples:
                    - 1779789116
              example:
                rows:
                - source_id: c2ca3df4-05f2-481b-b0d0-23000fc24218
                  collection_id: 0ba7a9b7-dda7-46f0-a7c3-0ff1e272f52a
                  source_name: research.checkpoint
                  collection_name: research.checkpoint
                  collection_title: research.checkpoint
                  label: research.checkpoint / research.checkpoint
                  count_24h: 0
                  count_24_48h: 0
                  count_48h_7d: 81
                refreshed_at: 1779789116
