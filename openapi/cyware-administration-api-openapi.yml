                        permission_count:
                          type: number
                          description: Returns the number of permissions associated with the user group from all the available permissions.
                          examples:
                          - '67'
                        user_count:
                          type: number
                          description: Returns the number of users who are part of the user group.
                          examples:
                          - '78'
                  permission_granted:
                    type: number
                    description: Returns the total number of permissions available/granted across groups.
                    examples:
                    - '67'
              example:
                next: {}
                previous: {}
                page_size: '100'
                total: '6'
                results:
                - id: d3c286f7-0867-451d-aceb-357eec30bdb1
                  name: Admin
                  description: Admin group
