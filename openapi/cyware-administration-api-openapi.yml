        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns the URL endpoint of the next page.
                    examples:
                    - configuration/custom-object/?page=3&page_size=1
                  previous:
                    type: string
                    description: Returns the URL endpoint of the previous page.
                    examples:
                    - configuration/custom-object/?page=1&page_size=1
                  total:
                    type: number
                    description: Returns the total number of custom objects available in the platform.
                    examples:
                    - '42'
                  page_size:
                    type: number
                    description: Returns the size of the page.
                    examples:
                    - '1'
                  results:
                    type: array
                    description: Returns the list of the result object.
                    items:
                      type: object
                      properties:
                        id:
