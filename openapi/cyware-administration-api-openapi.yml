                  max_upload_file_size:
                    type: number
                    description: Returns the maximum file size user can upload.
                    examples:
                    - '10485760'
                  tenant_notification:
                    type: boolean
                    description: Returns True if the tenant notifications have been enabled, else returns False.
                    examples:
                    - 'true'
                  mail_service_enabled:
                    type: boolean
                    description: Returns True if the mail service has been enabled, else returns False.
                    examples:
                    - 'true'
                  port_scanner_timeout:
                    type: number
                    description: Returns the port scanner timeout.
                    examples:
                    - '5'
                  timezone:
                    type: string
                    description: Returns the tenant timezone.
                    examples:
                    - UTC
                  logs_delete_time:
                    type: number
                    description: Returns the number of days after which the logs get deleted.
                    examples:
                    - '365'
              example:
                white_label: 'false'
                max_upload_file_size: '10485760'
                tenant_notification: 'true'
                mail_service_enabled: 'true'
                port_scanner_timeout: '5'
                timezone: UTC
                logs_delete_time: '365'
  /rest-auth/tenant/config/access-restriction/:
    get:
      operationId: firewallConfigurationDetails
      summary: Get Firewall Configuration Details
      tags:
      - Administration
      description: Returns the firewall rules defined for a Tenant. This API either allows all the requested IPs or Countries to access the application or blocks all the IPs or Countries.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/configuration/tenant-configuration/firewall-configuration-details
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    description: Returns the details of general firewall configuration settings that govern access behaviour.
                    properties:
                      restricted_access:
                        type: boolean
                        description: Returns True if the firewall is enabled, else returns False.
                        examples:
                        - 'true'
                      blacklist:
                        type: boolean
                        description: Returns True if specific traffic is allowed, else returns False.
                        examples:
                        - 'false'
                  firewall_list:
                    type: array
                    description: Returns the list of firewall rules or entries that define specific IPs or CIDRs and their associated properties.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID of the firewall rule.
                          examples:
                          - 67d2a851-b6ea-47d2-90c1-89fef3ece100
                        reason:
                          type: string
                          description: Returns the reason for adding a user to the rule.
                          examples:
                          - test
                        is_active:
                          type: boolean
                          description: Returns True if a rule has been applied on the traffic, else returns False.
                          examples:
                          - 'true'
                        type:
                          type: string
                          description: Returns the type for which this rule has been defined. Rule type such as CIDR, Country.
                          examples:
                          - cidr
                        value:
                          type: string
                          description: Returns the value on which the rule has been applied. It can be IP or Country name based on type.
                          examples:
                          - 3.7.118.226/24
                        created_at:
                          type: number
                          description: Returns the date and time of the rule creation.
                          examples:
                          - '1645376951'
                        updated_at:
                          type: number
                          description: Returns the date and time when the rule has been updated.
                          examples:
                          - '1645376951'
              example:
                config:
                  restricted_access: 'true'
                  blacklist: 'false'
                firewall_list:
                - id: 67d2a851-b6ea-47d2-90c1-89fef3ece100
                  reason: test
                  is_active: 'true'
                  type: cidr
                  value: 3.7.118.226/24
                  created_at: '1645376951'
                  updated_at: '1645376951'
  /conversion/tenant/config/:
    get:
      operationId: retrieveTenantConfiguration
      summary: Get Tenant Configuration
      tags:
      - Administration
      description: Returns the configurations related to the tenant.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/configuration/tenant-configuration/retrieve-tenant-configuration
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve per page.
          default: '10'
        description: Pass the number of records to retrieve per page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the ID of the tenant configuration.
                    examples:
                    - 28fee803-3be5-439a-aeab-3100bd2500d4
                  tenant_name:
                    type: string
                    description: Returns the name of the tenant.
                    examples:
                    - bugbasket
                  tenant_code:
                    type: string
                    description: Returns the code given for the tenant.
                    examples:
                    - bugbasket
                  server_url:
                    type: string
                    description: Returns the domain name of the server.
                    examples:
                    - https://bugbasket.cywareqa.com
                  tlp:
                    type: string
                    description: 'Returns the value of the default TLP.

                      White, Amber, Green, None, Yellow.'
                    examples:
                    - WHITE
                  is_active:
                    type: boolean
                    description: Returns true if the tenant is enabled, else returns false if disabled.
                    examples:
                    - 'true'
                  max_polling_time:
                    type: number
                    description: Returns the time interval at which the Intel Exchange tenant will automatically retrieve the Threat Intel Packages from the configured sources.
                    examples:
                    - '14400'
                  max_source_limit:
                    type: number
                    description: Returns the maximum number of sources configured.
                    examples:
                    - '20'
                  max_upload_file_size:
                    type: number
                    description: Returns the maximum file size that could be uploaded.
                    examples:
                    - '10485760'
                  max_poll_result_size:
                    type: number
                    description: Returns the max allowed size (in KB) of a single polling result.
                    examples:
                    - '5120'
                  email_sleep_time:
                    type: number
                    description: Returns the time interval at which the application will attempt to retry connecting to the configured Email Inbox server.
                    examples:
                    - '60'
                  email_number_of_retry:
                    type: number
                    description: Returns the number of times the application attempts to connect to the configured Email inbox server.
                    examples:
                    - '5'
                  parse_urls_without_scheme:
                    type: boolean
                    description: Returns true to parse URL without schemes, else returns false.
                    examples:
                    - 'false'
                  parse_domain_from_url:
                    type: boolean
                    description: Returns true if Threat Mail Box and RSS Feeds will automatically parse Domain values from URLs, else returns false.
                    examples:
                    - 'false'
                  parse_domain_from_email_address:
                    type: boolean
                    description: Returns true if Threat Mail Box and RSS Feeds will automatically parse Domain values from Emails, else returns false.
                    examples:
                    - 'false'
                  parse_email_from_url:
                    type: boolean
                    description: Returns true if Threat Mail Box and RSS Feeds will automatically parse Emails from URLs, else returns false.
                    examples:
                    - 'false'
                  parse_file_paths:
                    type: boolean
                    description: Returns true if Threat Mail Box and RSS Feeds will automatically parse file paths, else returns false.
                    examples:
                    - 'false'
                  apart_polling_max_feeds:
                    type: number
                    description: Returns the maximum number of feeds to poll at a single time.
                    examples:
                    - '4'
                  ctix_lite_collections_limit:
                    type: number
                    description: Returns the collections allowed in CTIX Lite.
                    examples:
                    - '3'
                  whitelist_limit:
                    type: number
                    description: Returns the overall whitelist limit.
                    examples:
                    - '100000'
                  blueliv_polling_limit:
                    type: number
                    description: Returns the limit for Blueliv polling.
                    examples:
                    - '4000'
                  rss_article_timeout:
                    type: number
                    description: Returns the timeout (in seconds) for retrieving RSS articles.
                    examples:
                    - '60'
                  dedup_config:
                    type: object
                    description: Returns the deduplication rules per object type.
                    properties:
                      common:
                        type: array
                        description: Returns the fields considered for common object deduplication.
                        items:
                          type: string
                          description: Returns the STIX version for object compliance.
                          examples:
                          - spec_version
                      indicator:
                        type: array
                        description: Returns the additional fields for indicator-level deduplication.
                        items:
                          type: string
                          description: Returns the start of indicator validity.
                          examples:
                          - valid_from
                  conversion_config:
                    type: object
                    description: Returns the configuration for the conversion pipeline.
                    properties:
                      rss_timeout_config:
                        type: number
                        description: Returns the RSS feed timeout in conversion.
                        examples:
                        - '30'
                      object_level_config:
                        type: object
                        description: Returns object-level transformation settings that control how source data is handled during conversion.
                        properties:
                          include_source:
                            type: number
                            description: Returns the include source in conversion.
                            examples:
                            - '1'
                          convert_objects:
                            type: number
                            description: Returns the convert objects flag.
                            examples:
                            - '1'
                          include_collection:
                            type: number
                            description: Whether to include collection during conversion.
                            examples:
                            - '0'
                      batching_config_size:
                        type: number
                        description: Size of each batch for conversion.
                        examples:
                        - '550'
                      batching_exclude_config:
                        type: array
                        description: Returns the sources excluded from batching.
                        items:
                          type: string
                          description: This is an example value.
                          examples:
                          - de74428b-9087-436b-ad98-2c39812961ab
                      source_category_level_config:
                        type: array
                        description: Returns the supported source categories for conversion.
                        items:
                          type: string
                          description: API-based threat data feeds.
                          examples:
                          - API_FEEDS
                  slack_indicator_limit:
                    type: number
                    description: Returns the max number of indicators allowed for Slack integration.
                    examples:
                    - '1000'
                  api_feeds_max_retry:
                    type: number
                    description: Returns the retry attempts for API feed polling.
                    examples:
                    - '3'
                  is_third_party_active:
                    type: boolean
                    description: Returns the third-party ingestion feature enabled.
                    examples:
                    - 'true'
                  third_party_last_refreshed_time:
                    type: object
                    description: Returns the details of the last third-party sync.
                  max_number_priority_polling_actions:
                    type: number
                    description: Returns the maximum concurrent priority polling processes.
                    examples:
                    - '5'
                  system_ignored_whitelist_limit:
                    type: number
                    description: Returns the entries ignored by the system in whitelist logic.
                    examples:
                    - '1000'
                  dedup_enable:
                    type: boolean
                    description: Whether deduplication logic is enabled.
                    examples:
                    - 'true'
                  allow_partial_intel:
                    type: boolean
                    description: Returns true if allow partial threat intelligence entries present.
                    examples:
                    - 'true'
                  ai_assist_allowed:
                    type: boolean
                    description: Whether AI Assist features are enabled.
                    examples:
                    - 'false'
                  deprecated_apps:
                    type: array
                    description: Returns the list of deprecated apps
                    items: {}
                  allowed_third_party_source:
                    type: object
                    description: Returns the currently permitted third-party source.
                    properties:
                      name:
                        type: string
                        description: Returns the name of the allowed third-party source.
                        examples:
                        - Majestic Million
                      id:
                        type: string
                        description: Returns the ID of the allowed third-party source.
                        examples:
                        - cc1f7e54-f7f4-477e-9f6c-9142eba5464a
                  total_third_party_sources:
                    type: array
                    description: Returns the details legal agreement and disclaimer related to the whitelist and third-party data.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Returns the name of all allowed third-party sources.
                          examples:
                          - Majestic Million
                        id:
                          type: string
                          description: Returns the ID of all allowed third-party sources.
                          examples:
                          - cc1f7e54-f7f4-477e-9f6c-9142eba5464a
                  whitelist_user_agreement:
                    type: string
                    description: Returns the user agreement text for whitelist usage.
                    examples:
                    - 'This data is generated by a third party and is not created or maintained by Cyware.

                      If you enable this feature, you are assuming full responsibility for the data.

                      Cyware is not responsible in any manner for the content or risk associated with the data access as Cyware is not the source of the associated data content and platform.'
              example:
                id: 28fee803-3be5-439a-aeab-3100bd2500d4
                tenant_name: bugbasket
                tenant_code: bugbasket
                server_url: https://bugbasket.cywareqa.com
                tlp: WHITE
                is_active: 'true'
                max_polling_time: '14400'
                max_source_limit: '20'
                max_upload_file_size: '10485760'
                max_poll_result_size: '5120'
                email_sleep_time: '60'
                email_number_of_retry: '5'
                parse_urls_without_scheme: 'false'
                parse_domain_from_url: 'false'
                parse_domain_from_email_address: 'false'
                parse_email_from_url: 'false'
                parse_file_paths: 'false'
                apart_polling_max_feeds: '4'
                ctix_lite_collections_limit: '3'
                whitelist_limit: '100000'
                blueliv_polling_limit: '4000'
                rss_article_timeout: '60'
                dedup_config:
                  common:
                  - spec_version
                  indicator:
                  - valid_from
                conversion_config:
                  rss_timeout_config: '30'
                  object_level_config:
                    include_source: '1'
                    convert_objects: '1'
                    include_collection: '0'
                  batching_config_size: '550'
                  batching_exclude_config:
                  - de74428b-9087-436b-ad98-2c39812961ab
                  source_category_level_config:
                  - API_FEEDS
                slack_indicator_limit: '1000'
                api_feeds_max_retry: '3'
                is_third_party_active: 'true'
                third_party_last_refreshed_time: {}
                max_number_priority_polling_actions: '5'
                system_ignored_whitelist_limit: '1000'
                dedup_enable: 'true'
                allow_partial_intel: 'true'
                ai_assist_allowed: 'false'
                deprecated_apps: []
                allowed_third_party_source:
                  name: Majestic Million
                  id: cc1f7e54-f7f4-477e-9f6c-9142eba5464a
                total_third_party_sources:
                - name: Majestic Million
                  id: cc1f7e54-f7f4-477e-9f6c-9142eba5464a
                whitelist_user_agreement: 'This data is generated by a third party and is not created or maintained by Cyware.

