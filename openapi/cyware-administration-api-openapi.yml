  /publishing/subscriber/:
    get:
      operationId: retrieveSubscribers
      summary: Get Subscribers
      tags:
      - Administration
      description: Returns a list of subscribers configured in the Intel Exchange platform.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/subscriber-management/retrieve-subscribers
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records to retrieve on each page.
          default: '10'
          examples:
          - '100'
        description: Pass the number of records to retrieve on each page.
      - name: id
        in: query
        required: false
        schema:
          type: string
          description: Filter the results by the Subscriber ID.
          examples:
          - 5d4f094e-df41-442b-a12b-9977e7128003
        description: Filter the results by the Subscriber ID.
      - name: organization_name
        in: query
        required: false
        schema:
          type: string
          description: Pass the organization name to filter subscribers.
          examples:
          - acme
        description: Pass the organization name to filter subscribers.
      - name: active
        in: query
        required: false
        schema:
          type: string
          description: Pass true to retrieve active subscribers. Pass false to retrieve inactive subscribers.
          examples:
          - 'true'
        description: Pass true to retrieve active subscribers. Pass false to retrieve inactive subscribers.
      - name: created_from
        in: query
        required: false
        schema:
          type: integer
          description: Pass the created time in epoch format to filter subscribers by the created time.
          examples:
          - '1641563275'
        description: Pass the created time in epoch format to filter subscribers by the created time.
      - name: created_to
        in: query
        required: false
        schema:
          type: integer
          description: Pass the created time in epoch format to filter subscribers by the created time.
          examples:
          - '1641564275'
        description: Pass the created time in epoch format to filter subscribers by the created time.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-created` to sort subscribers in descending order based on the created time. Pass `created` to sort subscribers in ascending order.
          examples:
          - -created
        description: Pass `-created` to sort subscribers in descending order based on the created time. Pass `created` to sort subscribers in ascending order.
      - name: last_pull_from
        in: query
        required: false
        schema:
          type: integer
          description: Pass the last pulled from time in epoch format to filter subscribers by the last pull time.
          examples:
          - '1641563275'
        description: Pass the last pulled from time in epoch format to filter subscribers by the last pull time.
      - name: last_pull_to
        in: query
        required: false
        schema:
          type: integer
          description: Pass the last pull time in epoch format to filter subscribers by the last pull time.
          examples:
          - '1641563275'
        description: Pass the last pull time in epoch format to filter subscribers by the last pull time.
      - name: nominal
        in: query
        required: false
        schema:
          type: string
          description: Pass true to retrieve only the name and ID of the subscribers.
          examples:
          - 'true'
        description: Pass true to retrieve only the name and ID of the subscribers.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns a link to the next page.
                    examples:
                    - subscriber/?page=2&page_size=1
                  previous:
                    type: object
                    description: Returns a link to the previous page.
                  page_size:
                    type: integer
                    description: Returns the number of records retrieved per page.
                    examples:
                    - '1'
                  total:
                    type: integer
                    description: Returns the total number of subscribers on the platform.
                    examples:
                    - '100'
                  results:
                    type: array
                    description: Returns the list of subscriber objects. For more information, see the Result Objects.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique identifier for the subscriber.
                          examples:
                          - 62ff1f14-6422-4dc7-a148-5174345af112
                        name:
                          type: string
                          description: Returns the display name of the subscriber.
                          examples:
                          - das
                        username:
                          type: string
                          description: Returns the internal unique username or user ID.
                          examples:
                          - 6dadc533-7335-4d73-b2b4-34aa91ee2bbf
                        created:
                          type: integer
                          description: Returns the timestamp when the subscriber was created (in epoch).
                          examples:
                          - '1712128274'
                        modified:
                          type: integer
                          description: Returns the timestamp when the subscriber record was last modified (in epoch).
                          examples:
                          - '1712131900'
                        last_pull:
                          type: integer
                          description: Returns the timestamp of the last data pull by the subscriber (in epoch).
                          examples:
                          - '1712131900.753041'
                        created_by:
                          type: string
                          description: Returns the ID of the user who created the subscriber.
                          examples:
                          - 029efea0-9324-4b9c-a10a-89db16724e0f
                        last_modified_by:
                          type: string
                          description: Returns the ID of the user who last modified the subscriber details.
                          examples:
                          - 029efea0-9324-4b9c-a10a-89db16724e0f
                        organization_name:
                          type: string
                          description: Returns the name of the subscriber's organization.
                          examples:
                          - acme
                        organization_types:
                          type: array
                          description: List of organization types associated with the subscriber.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Returns the unique identifier for the organization type.
                                examples:
                                - c6b0a364-13d8-4cfd-a64b-7f5625c82624
                              name:
                                type: string
                                description: Returns the name of the organization type.
                                examples:
                                - sample
                        is_active:
                          type: boolean
                          description: Indicates whether the subscriber is currently active.
                          examples:
                          - 'true'
                        primary_contact:
                          type: object
                          description: Returns the primary contact details.
                          properties:
                            name:
                              type: string
                              description: Returns the name of the primary contact person.
                              examples:
                              - john
                            email:
                              type: string
                              description: Returns the email address of the primary contact person.
                              examples:
                              - john.doe@cyware.com
                            number:
                              type: string
                              description: Returns the number of the primary contact person.
                              examples:
                              - '1231241241'
                            address:
                              type: string
                              description: Returns the address of the primary contact person.
                              examples:
                              - sample
                        secondary_contact:
                          type: object
                          description: Returns the secondary contact details.
                          properties:
                            name:
                              type: object
                              description: Returns the name of the secondary contact person.
                            email:
                              type: object
                              description: Returns the email of the secondary contact person.
                            number:
                              type: object
                              description: Returns the number of the secondary contact person.
                            address:
                              type: object
                              description: Returns the address of the secondary contact person.
                        confidence_score:
                          type: integer
                          description: Returns the default confidence score associated with the subscriber.
                          examples:
                          - '50'
                        white_list_ip:
                          type: array
                          description: Returns the list of IPs or CIDRs whitelisted by the subscriber.
                          items:
                            type: string
                            description: This is an example value.
                            examples:
                            - 0.0.0.0/0
                        taxii_enabled:
                          type: boolean
                          description: Indicates whether the subscriber supports TAXII.
                          examples:
                          - 'true'
                        misp_enabled:
                          type: boolean
                          description: Indicates whether the subscriber supports MISP.
                          examples:
                          - 'false'
                  hide_aggregate_col:
                    type: boolean
                    description: Indicates whether to hide aggregated columns in the UI.
                    examples:
                    - 'false'
                  discovery_url:
                    type: string
                    description: Returns the TAXII discovery URL.
                    examples:
                    - https://bugbasket.cywareqa.com/ctixapi/taxii/
                  taxii_enabled:
                    type: boolean
                    description: Returns true if the TAXII requests are enabled, else returns false.
                    examples:
                    - 'true'
                  misp_enabled:
                    type: boolean
                    description: Returns true if the MISP requests are enabled, else returns false.
                    examples:
                    - 'false'
              example:
                next: subscriber/?page=2&page_size=1
                previous: {}
                page_size: '1'
                total: '100'
                results:
                - id: 62ff1f14-6422-4dc7-a148-5174345af112
                  name: das
                  username: 6dadc533-7335-4d73-b2b4-34aa91ee2bbf
                  created: '1712128274'
                  modified: '1712131900'
                  last_pull: '1712131900.753041'
                  created_by: 029efea0-9324-4b9c-a10a-89db16724e0f
                  last_modified_by: 029efea0-9324-4b9c-a10a-89db16724e0f
                  organization_name: acme
                  organization_types:
                  - id: c6b0a364-13d8-4cfd-a64b-7f5625c82624
                    name: sample
                  is_active: 'true'
                  primary_contact:
                    name: john
                    email: john.doe@cyware.com
                    number: '1231241241'
                    address: sample
                  secondary_contact:
                    name: {}
                    email: {}
                    number: {}
                    address: {}
                  confidence_score: '50'
                  white_list_ip:
                  - 0.0.0.0/0
                  taxii_enabled: 'true'
                  misp_enabled: 'false'
                hide_aggregate_col: 'false'
                discovery_url: https://bugbasket.cywareqa.com/ctixapi/taxii/
                taxii_enabled: 'true'
                misp_enabled: 'false'
  /publishing/subscriber/inboxing-report/:
    get:
      operationId: inboxingSubscribersReport
      summary: Get Inboxing Subscribers Report
      tags:
