                        name:
                          type: string
                          description: Returns the name of the subscriber.
                          examples:
                          - CTIX Suscriber
                        weightage:
                          type: integer
                          description: Returns the source Confidence Score assigned to the subscriber.
                          examples:
                          - 50
              example:
                next: {}
                previous: {}
                page_size: 10
                total: 1
                results:
                - id: 19fd643e-b2a1-42fe-bc95-2e89b7d126cc
                  name: CTIX Suscriber
                  weightage: 50
