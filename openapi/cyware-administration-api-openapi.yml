    post:
      operationId: createCustomScore
      summary: Create Custom Score
      tags:
      - Administration
      description: Creates a new custom score. You can add a maximum of five custom scores.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/configuration/custom-scores/create-custom-score
      requestBody:
        required: false
