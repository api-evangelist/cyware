          - malware
        description: Pass the enrichment policy name to retrieve the policy.
      - name: is_active
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve active policies, else pass false.
          examples:
          - 'true'
        description: Pass true to retrieve active policies, else pass false.
      - name: created_by_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the user ID to retrieve policies created by the particular user.
          examples:
          - c0fe874d-6c0e-4ee0-82c9-1b72440fe104
        description: Pass the user ID to retrieve policies created by the particular user.
      - name: updated_by_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the user ID to retrieve policies updated by the particular user.
          examples:
          - c0fe874d-6c0e-4ee0-82c9-1b72440fe104
        description: Pass the user ID to retrieve policies updated by the particular user.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the created from date in epoch format to retrieve policies created in the provided timestamp.
          examples:
          - '1627025129'
        description: Pass the created from date in epoch format to retrieve policies created in the provided timestamp.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the created date in epoch format to retrieve policies created in the provided timestamp.
          examples:
          - '1627025133'
        description: Pass the created date in epoch format to retrieve policies created in the provided timestamp.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-ctix_created` to sort records by the last modified date in descending order. Pass `ctix_created` to sort records by the last modified date in ascending order.
          enum:
          - -ctix_created
          - ctix_created
          default: -ctix_created
          examples:
          - -ctix_created
        description: Pass `-ctix_created` to sort records by the last modified date in descending order. Pass `ctix_created` to sort records by the last modified date in ascending order.
      - name: object_type
        in: query
        required: false
        schema:
          type: string
          description: Pass the object type to filter the enrichment policies on the object type specified in the policy, such as IP, hash, domain, or URL.
          examples:
          - ip,hash
        description: Pass the object type to filter the enrichment policies on the object type specified in the policy, such as IP, hash, domain, or URL.
      - name: published_collections
        in: query
        required: false
        schema:
          type: string
          description: Pass the collection ID to filter the enrichment policies based on published collection IDs.
          examples:
          - d7f7e3ff-94ff-483a-9615-95c6aac7ed2a
        description: Pass the collection ID to filter the enrichment policies based on published collection IDs.
      - name: collection_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the collection ID to filter the enrichment policies based on the collection ID.
          examples:
          - e1183a5e-86cb-47e3-a4a9-0236170efda7
        description: Pass the collection ID to filter the enrichment policies based on the collection ID.
      - name: source_id
        in: query
        required: false
        schema:
          type: string
          description: Pass the source ID to filter the enrichment policies based on the source ID.
          examples:
          - 689773e1-5f0f-42ce-9f50-1cf13c3ee91c
        description: Pass the source ID to filter the enrichment policies based on the source ID.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns a link to the next page of pagination.
                    examples:
                    - policy/?page=2&page_size=10
                  page_size:
                    type: number
                    description: Returns the number of records returned on each page.
                    examples:
                    - '10'
                  previous:
                    type: object
                    description: Returns a link to the previous page of pagination.
                  results:
                    type: array
                    description: Returns JSON objects for the enrichment details.
                    items:
                      type: object
                      properties:
                        all_collections:
                          type: boolean
                          description: Returns true if the policy is configured to receive intel all collections, else returns false.
                          examples:
                          - 'false'
                        all_inbox_collections:
                          type: boolean
                          description: Returns true if the policy is configured to receive intel from all inbox type sources, else returns false.
                          examples:
                          - 'false'
                        all_sources:
                          type: boolean
                          description: Returns true if the policy is configured to receive intel from all sources, else returns false.
                          examples:
                          - 'false'
                        component:
                          type: string
                          description: Returns the type of threat data.
                          examples:
                          - indicator
                        created:
                          type: number
                          description: Returns the date and time at which the policy was created in epoch format.
                          examples:
                          - '1641813470'
                        created_by:
                          type: object
                          description: Returns the details of the user who created the policy.
                          properties:
                            email:
                              type: string
                              description: Returns the user's email address.
                              examples:
                              - youremail@example.com
                            first_name:
                              type: string
                              description: Returns the user's first name.
                              examples:
                              - John
                            id:
                              type: string
                              description: Returns the unique identifier of the user.
                              examples:
                              - 1aa50223-3c1e-4b59-a737-7d913bf9b6bc
                            last_name:
                              type: string
                              description: Returns the user's last name.
                              examples:
                              - Doe
                        enrichment:
                          type: array
                          description: Returns the list of enrichment sources and their details used to enrich the threat data.
                          items:
                            type: object
                            properties:
                              app_name:
                                type: string
                                description: Returns the name of the enrichment app.
                                examples:
                                - APIVoid
                              app_slug:
                                type: string
                                description: Returns the unique slug of the app.
                                examples:
                                - apivoid
                              id:
                                type: string
                                description: Returns the unique ID of the integration.
                                examples:
                                - 3736af52-5eed-46e0-a1c8-d578bc5feb68
                              is_active:
                                type: boolean
                                description: Returns true if the integration is currently active.
                                examples:
                                - 'true'
                              order:
                                type: number
                                description: Returns the order in which this enrichment app is executed.
                                examples:
                                - '0'
                              third_party_logo:
                                type: string
                                description: Returns the URL path to the logo of the third-party app.
                                examples:
                                - /2627744746342/Integration_APIVoid.png
                        enrichment_run_type:
                          type: string
                          description: Returns the execution style of the policy as sequential or parallelly.
                          examples:
                          - sequentially
                        id:
                          type: string
                          description: Returns the policy ID.
                          examples:
                          - 33479bb3-b9bc-43e2-bacb-9a79b900c7d1
                        is_active:
                          type: boolean
                          description: Returns true if the policy is active, else returns false.
                          examples:
                          - 'true'
                        is_apply_condition:
                          type: boolean
                          description: Returns true if a condition is applied to the policy, else returns false.
                          examples:
                          - 'false'
                        modified:
                          type: number
                          description: Returns the date and time at which the policy was last modified in epoch format.
                          examples:
                          - '1641879762'
                        name:
                          type: string
                          description: Returns the name of the policy.
                          examples:
                          - IP Policy
                        object_type:
                          type: string
                          description: Returns the threat data type to enrich. It can be IP, hash, domain, or URL.
                          examples:
                          - ip
                        policy_source:
                          type: object
                          description: Returns the list of policy sources, such as ID, name, and source.
                          properties:
                            collection:
                              type: array
                              description: Returns the list of collections included in the policy.
                              items: {}
                            inbox:
                              type: array
                              description: Returns the list of inbox sources.
                              items:
                                type: object
                                properties:
                                  created:
                                    type: number
                                    description: Returns the timestamp of when the inbox was created.
                                    examples:
                                    - '1641556894'
                                  description:
                                    type: string
                                    description: Returns a brief description of the inbox.
                                    examples:
                                    - CTIX Inbox Source
                                  has_subscribed:
                                    type: object
                                    description: Returns the subscription details.
                                  id:
                                    type: string
                                    description: Returns the ID of the inbox.
                                    examples:
                                    - 3f1f1efb-9d25-4bc7-a606-851b1b7c711a
                                  inbox:
                                    type: boolean
                                    description: Returns true if the source is an inbox.
                                    examples:
                                    - 'true'
                                  is_active:
                                    type: boolean
                                    description: Returns true if the inbox is active.
                                    examples:
                                    - 'true'
                                  is_editable:
                                    type: boolean
                                    description: Returns true if the inbox source can be edited.
                                    examples:
                                    - 'true'
                                  name:
                                    type: string
                                    description: Returns the name of the inbox.
                                    examples:
                                    - CTIX Inbox Source
                                  polling:
                                    type: boolean
                                    description: Returns true if the inbox uses polling.
                                    examples:
                                    - 'true'
                                  type:
                                    type: string
                                    description: Returns the type of inbox.
                                    examples:
                                    - DATA_FEED
                            source:
                              type: array
                              description: Returns the list of direct sources added to the policy.
                              items: {}
                        priority:
                          type: number
                          description: Returns the priority of the policy at which it would be executed.
                          examples:
                          - '1'
                        rule:
                          type: array
                          description: Returns the list of conditions applied to the policy.
                          items: {}
                        status:
                          type: string
                          description: Returns the status of the policy, such as ACTIVE or INACTIVE.
                          examples:
                          - ACTIVE
                        updated_by:
                          type: object
                          description: Returns the name of the user who last modified the policy.
                          properties:
                            email:
                              type: string
                              description: Returns the user's email address.
                              examples:
                              - youremail@example.com
                            first_name:
                              type: string
                              description: Returns the user's first name.
                              examples:
