          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: object
                    description: Returns the link to the next page.
                  previous:
                    type: object
                    description: Returns the link to the previous page.
                  page_size:
                    type: number
                    description: Returns the maximum number of elements that can be present on a page.
                    examples:
                    - '10'
                  total:
                    type: number
                    description: Returns the total record count.
                    examples:
                    - '1'
                  results:
                    type: array
                    description: Returns the list of collection objects.
                    items:
