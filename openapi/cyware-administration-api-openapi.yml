    get:
      operationId: retrieveEnrichmentStatistics
      summary: Get Enrichment Statistics
      tags:
      - Administration
      description: Retrieves enrichment statistics for a provided object ID and the object type. Enrichment statistics include the verdict, number of sources that enriched the object, and their statuses.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/enrichment-management/enrichment-details/retrieve-enrichment-statistics
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      - name: object_type
        in: path
        required: true
        schema:
          type: string
          description: Pass the object type of the threat data object.
          examples:
          - indicator
        description: Pass the object type of the threat data object.
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the object ID of the threat data object.
          examples:
          - beef22f5-e9ff-43e9-9a65-a16e62a32dc5
        description: Pass the object ID of the threat data object.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status_card:
                    type: array
                    description: Returns the label and value for enrichment status and count.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: Returns the status label.
                          examples:
                          - Enrichment
                        value:
                          type: number
                          description: Returns the number of enrichment attempts with that status.
                          examples:
                          - '1'
                  source_reported:
                    type: array
                    description: Returns the tool and the time of data enrichment that the verdict reported as malicious.
                    items:
                      type: object
                      properties:
                        tool_name:
                          type: string
                          description: Returns the name of the tool that performed enrichment.
                          examples:
                          - BlueCoat
                        tool_image:
                          type: object
                          description: Returns the URL of the tool logo.
                        enriched_on:
                          type: number
                          description: Returns the timestamp when the enrichment was performed.
                          examples:
                          - '1631859944'
                  tools-verdict:
                    type: array
                    description: Return values for the key, label, and value for the verdict, verdict label, and count.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                          description: Returns the verdict label.
                          examples:
                          - Malicious
                        value:
                          type: number
                          description: Returns the number of times this verdict was returned.
                          examples:
                          - '1'
                        key:
                          type: string
                          description: Returns the internal identifier for the verdict.
                          examples:
                          - malicious
              example:
                status_card:
                - label: Enrichment
                  value: '1'
                source_reported:
                - tool_name: BlueCoat
                  tool_image: {}
                  enriched_on: '1631859944'
                tools-verdict:
                - label: Malicious
                  value: '1'
                  key: malicious
