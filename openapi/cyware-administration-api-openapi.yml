                  ctix_modified:
                    type: number
                    description: Returns the epoch timestamp indicating when the kill chain was last modified.
                    examples:
                    - '1712925852'
                  id:
                    type: string
                    description: Returns the unique identifier of the kill chain.
                    examples:
                    - 22a47429-603e-440e-83d0-c19323d7b5aa
                  modified_by:
                    type: object
                    description: Returns the details of the user who modified the kill chain.
                    properties:
