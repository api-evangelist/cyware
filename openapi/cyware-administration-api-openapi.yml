  /publishing/config/:
    get:
      operationId: taxiiConfigurationDetails
      summary: Get TAXII Configuration Details
      tags:
      - Administration
      description: This endpoint retrieves the configuration details of the TAXII server on the platform.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/configuration/taxii-server-configuration/taxii-configuration-details
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve on each page.
          maxLength: 100
          default: '10'
        description: Pass the number of records to retrieve on each page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_polling_time:
                    type: number
                    description: The maximum time (in seconds) the server will poll for new data.
                    examples:
                    - '86400'
                  poll_max_result_size:
                    type: number
                    description: The maximum number of records returned in a single poll request.
                    examples:
                    - '1000'
                  live_graph_duration:
                    type: number
                    description: The duration (in seconds) for which live graph data is available.
                    examples:
                    - '180'
                  stix1:
                    type: boolean
                    description: Indicates if STIX 1.1.1 format publishing is enabled.
                    examples:
                    - 'true'
                  stix1_2:
                    type: boolean
                    description: Indicates if STIX 1.2 format publishing is enabled.
                    examples:
                    - 'true'
                  stix2:
                    type: boolean
                    description: Indicates if STIX 2.0 format publishing is enabled.
                    examples:
                    - 'true'
                  stix2_v1:
                    type: boolean
                    description: Indicates if STIX 2.1 format publishing is enabled.
                    examples:
                    - 'true'
                  misp:
                    type: boolean
                    description: Indicates if MISP format publishing is enabled.
                    examples:
                    - 'false'
                  default_content_binding:
                    type: string
                    description: The default binding format for TAXII 1.x server.
                    examples:
                    - urn:stix.mitre.org:xml:1.2
                  auto_process_inbox_feed:
                    type: boolean
                    description: Indicates if the server automatically processes inbox feeds.
                    examples:
                    - 'false'
                  discovery_service_message:
                    type: string
                    description: Message related to the discovery service.
                  poll_service_message:
                    type: string
                    description: Message related to the poll service.
                  collection_service_message:
                    type: string
                    description: Message related to the collection service.
                  inbox_service_message:
                    type: string
                    description: Message related to the inbox service.
                  name_space_url:
                    type: string
                    description: The URL reference for the namespace.
                    examples:
                    - https://cyware.com
                  name_space_name:
                    type: string
                    description: The name identifier for STIX 1.x content.
                    examples:
                    - ctix
              example:
                max_polling_time: '86400'
                poll_max_result_size: '1000'
                live_graph_duration: '180'
                stix1: 'true'
                stix1_2: 'true'
                stix2: 'true'
                stix2_v1: 'true'
                misp: 'false'
                default_content_binding: urn:stix.mitre.org:xml:1.2
                auto_process_inbox_feed: 'false'
                discovery_service_message: ''
                poll_service_message: ''
                collection_service_message: ''
                inbox_service_message: ''
                name_space_url: https://cyware.com
                name_space_name: ctix
  /rest-auth/auth-config/:
    get:
      operationId: authenticationConfiguration
      summary: Get Authentication Configuration
      tags:
      - Administration
      description: Returns the authentication configuration.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/configuration/tenant-configuration/authentication-configuration
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve records.
          default: '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of records to retrieve per page.
          default: '10'
        description: Pass the number of records to retrieve per page.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_expiry_time:
                    type: number
                    description: Returns the number of days in which the notifications expire.
                    examples:
                    - '7'
                  activity_timeout:
                    type: boolean
                    description: Returns True if the user logs out in case of inactivity, else returns False.
                    examples:
                    - 'true'
                  activity_timeout_time:
                    type: number
                    description: Returns the minutes after which the user will automatically be logged out due to inactivity if enabled.
                    examples:
                    - '30'
                  password_tries:
                    type: number
                    description: Returns the maximum number of tries a user can attempt after which the user account will either be temporary or permanently blocked.
                    examples:
                    - '5'
                  is_temporary_lockout:
                    type: boolean
                    description: Returns True if the user has been blocked permanently or temporarily, else returns False.
                    examples:
                    - 'true'
                  lock_out_time:
                    type: number
                    description: Returns the minutes after which the user account unblocks if blocked temporarily.
                    examples:
                    - '10'
                  account_deactivation_enabled:
                    type: boolean
                    description: Returns True if the user account blocks if not logged in for the configured days, else returns False.
                    examples:
                    - 'false'
                  max_inactive_days:
                    type: number
                    description: Returns the maximum number of inactive days a user account can have before getting blocked.
                    examples:
                    - '0'
                  concurrent_sessions:
                    type: boolean
                    description: Returns True if a user can generate multiple authentication tokens at a time, else returns False.
                    examples:
                    - 'true'
                  jwt_token_expiry:
                    type: number
                    description: Returns the expiration time of the JWT token.
                    examples:
                    - '4320'
                  two_factor_auth:
                    type: boolean
                    description: Returns True if two-factor authentication is enabled, else returns False.
                    examples:
                    - 'false'
                  two_factor_auth_type:
                    type: string
                    description: Returns the type of two-factor authentication enabled, such as email or TOTP.
                    examples:
                    - TOTP
                  allow_forgot_password_mail:
                    type: boolean
                    description: Returns True if the forgot password policy has been enabled, else returns False.
                    examples:
                    - 'true'
                  otp_expiry_time:
                    type: number
                    description: Returns the minutes after which the OTP expires if sent over email.
                    examples:
                    - '5'
                  password_link_expiry_time:
                    type: number
                    description: Returns the time after which the reset password link expires if sent over email.
                    examples:
                    - '800'
                  max_inactive_alert_days:
                    type: number
                    description: Returns the number of inactive days, if a user has not logged into the application for a specific period of time as a reminder before the configured days expires.
                    examples:
                    - '1'
                  session_auth:
                    type: boolean
                    description: Returns True if a user can open Intel Exchange in multiple windows simultaneously, else returns False.
                    examples:
                    - 'false'
                  recaptcha:
                    type: boolean
                    description: Returns True if the reCAPTCHA has been enabled, else returns False.
                    examples:
                    - 'false'
              example:
                notification_expiry_time: '7'
                activity_timeout: 'true'
                activity_timeout_time: '30'
                password_tries: '5'
                is_temporary_lockout: 'true'
                lock_out_time: '10'
                account_deactivation_enabled: 'false'
                max_inactive_days: '0'
                concurrent_sessions: 'true'
                jwt_token_expiry: '4320'
                two_factor_auth: 'false'
                two_factor_auth_type: TOTP
                allow_forgot_password_mail: 'true'
                otp_expiry_time: '5'
                password_link_expiry_time: '800'
                max_inactive_alert_days: '1'
                session_auth: 'false'
                recaptcha: 'false'
