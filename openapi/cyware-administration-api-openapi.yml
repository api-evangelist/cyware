                          type: number
                          description: Returns the start time in epoch format.
                          examples:
                          - '1629884194'
                        unsubscribed_time:
                          type: object
                          description: Returns the timestamp of unsubscription.
                        subscribed:
                          type: boolean
                          description: Indicates whether the collection is currently subscribed to fetch data.
