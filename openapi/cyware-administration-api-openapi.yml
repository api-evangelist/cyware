  /ingestion/tags/:
    get:
      operationId: retrieveTags
      summary: Get Tags
      tags:
      - Administration
      description: Returns all tags from Intel Exchange.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/tag-management/retrieve-tags
      parameters:
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of tags to be retrieved on each page.
          maxLength: 100
          default: '10'
          examples:
          - '10'
        description: Pass the number of tags to be retrieved on each page.
      - name: tag_type
        in: query
        required: false
        schema:
          type: string
          description: Pass the type of tag to be retrieved.
          enum:
          - source
          - user
          - system
          - 'privileged '
          examples:
          - user
        description: Pass the type of tag to be retrieved.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass the sorting order of results.
          enum:
          - name
          - -name
          - modified
          - -modified
          examples:
          - name
        description: Pass the sorting order of results.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve tags.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve tags.
      - name: modified_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the modified from in epoch format to filter tags.
          examples:
          - '1715731200'
        description: Pass the modified from in epoch format to filter tags.
      - name: modified_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the modified time in epoch format to filter tags.
          examples:
          - '1717113599'
        description: Pass the modified time in epoch format to filter tags.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the created time in epoch format to filter tags.
          examples:
          - '1716958173'
        description: Pass the created time in epoch format to filter tags.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the created time in epoch format to filter tags.
          examples:
          - '1717012366'
        description: Pass the created time in epoch format to filter tags.
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of the creator to filter tags.
          examples:
          - 2f4c3544-488a-4edb-b69b-95ea1a6a851e
        description: Pass the ID of the creator to filter tags.
      - name: modified_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of the modifier to filter tags.
          examples:
          - 2f4c3544-488a-4edb-b69b-95ea1a6a851e
        description: Pass the ID of the modifier to filter tags.
      - name: is_active
        in: query
        required: false
        schema:
          type: string
          description: Pass true to retrieve enabled tags. Pass false to retrieve disabled tags.
          examples:
          - 'true'
        description: Pass true to retrieve enabled tags. Pass false to retrieve disabled tags.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass the keyword to search tags based on the title.
          examples:
          - rule
        description: Pass the keyword to search tags based on the title.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns a link to the next page.
                    examples:
                    - tags/?page=2&page_size=10
                  page_size:
                    type: number
                    description: Returns the number of tags retrieved per page.
                    examples:
                    - '10'
                  previous:
                    type: object
                    description: Returns the link to the previous page.
                  results:
                    type: array
                    description: Returns an array of results which consists of tags in JSON objects.
                    items:
                      type: object
                      properties:
                        colour_code:
                          type: string
                          description: Returns the hex key of the colour code which denotes type of the tag.
                          examples:
                          - '#0068FA'
                        created:
                          type: number
                          description: Returns the epoch time of tag creation.
                          examples:
                          - '1716966527'
                        created_by:
                          type: object
                          description: Returns the details of the user who created the tag.
                          properties:
                            email:
                              type: string
                              description: Returns the email address of the user who created the tags.
                              examples:
                              - john.doe@mail.com
                            first_name:
                              type: string
                              description: Returns the first name of the user who created the tags.
                              examples:
                              - John
                            id:
                              type: string
                              description: Returns the ID of the user who created the tags.
                              examples:
                              - 09c3sa4a-d258-556c-a57b-b4218d298089
                            last_name:
                              type: string
                              description: Returns the last name of the user who created the tags.
                        id:
                          type: string
                          description: Returns the tag ID.
                          examples:
                          - 547k8564-8810-4818-a578-1577ef715654
                        is_active:
                          type: boolean
                          description: Returns true if the tag is enabled, else false.
                          examples:
                          - 'true'
                        modified:
                          type: number
                          description: Returns the last modified time in epoch format.
                          examples:
                          - '1716966527'
                        modified_by:
                          type: object
                          description: Returns the details of the user who last modified the tag.
                          properties:
                            email:
                              type: string
                              description: Returns the email address of the user who last modified the tag.
                              examples:
                              - john.doe@mail.com
                            first_name:
                              type: string
                              description: Returns the first name of the user who last modified the tag.
                              examples:
                              - John
                            id:
                              type: string
                              description: Returns the user ID of the user who last modified the tag.
                              examples:
                              - 09c3sa4a-d258-556c-a57b-b4218d298089
                            last_name:
                              type: string
                              description: Returns the last name of the user who last modified the tag.
                        name:
                          type: string
                          description: Returns the name of the tag.
                          examples:
                          - sample_tag
                        tag_type:
                          type: object
                          description: Returns details of the tag type such as tag ID and tag name.
                          properties:
                            id:
                              type: string
                              description: Returns the unique identifier of the tag type.
                              examples:
                              - user
                            name:
                              type: string
                              description: Returns the name of the tag type.
                              examples:
                              - User
                  total:
                    type: number
                    description: Returns the total number of tags.
                    examples:
                    - '1'
              example:
                next: tags/?page=2&page_size=10
                page_size: '10'
                previous: {}
                results:
                - colour_code: '#0068FA'
                  created: '1716966527'
                  created_by:
                    email: john.doe@mail.com
                    first_name: John
                    id: 09c3sa4a-d258-556c-a57b-b4218d298089
                    last_name: ''
                  id: 547k8564-8810-4818-a578-1577ef715654
                  is_active: 'true'
                  modified: '1716966527'
                  modified_by:
                    email: john.doe@mail.com
                    first_name: John
                    id: 09c3sa4a-d258-556c-a57b-b4218d298089
                    last_name: ''
                  name: sample_tag
                  tag_type:
                    id: user
                    name: User
                total: '1'
