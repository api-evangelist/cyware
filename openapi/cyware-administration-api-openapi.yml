          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Pass the name of the custom score.
                  examples:
                  - Priority Score
                helptext:
                  type: string
                  description: Pass the help text for the custom score.
                  examples:
                  - Determines the urgency of addressing the IOC based on current context
                field_type:
                  type: string
                  description: Pass the type of field for the custom score. You can specify one of the following field types.
                  enum:
                  - integer
                  - text
                  - select
                  examples:
                  - select
                values:
                  type: array
                  description: Pass a list of allowed values for the custom score. Required if the field type is `select`.
                  items:
                    type: string
                    description: Indicates the IOC requires immediate attention.
                    examples:
                    - High
