                  is_active: 'true'
                  is_removed: '0'
                  application_token: uyid6y45djnizn8sp4kwbkidre
                  created_by: 3b002d22-3bba-42dc-a748-c7fc20ad5c4e
                  modified_by: 3b002d22-3bba-42dc-a748-c7fc20ad5c4e
                  last_access: {}
                  expiry_date: '1625436629'
                  expiry_days: '7'
