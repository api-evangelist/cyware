      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/subscriber-management/subscriber-report/inboxing-subscribers-report
      parameters:
      - name: status
        in: query
        required: true
        schema:
          type: string
          description: Pass the status of the subscribers to retrieve the report.
          enum:
          - active
          - inactive
          examples:
          - inactive
        description: Pass the status of the subscribers to retrieve the report.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records to retrieve on each page.
          default: '10'
          examples:
          - '10'
        description: Pass the number of records to retrieve on each page.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass the name of a subscriber to retrieve the inboxing records.
          examples:
          - nic
        description: Pass the name of a subscriber to retrieve the inboxing records.
      - name: collection_name
        in: query
        required: false
        schema:
          type: string
          description: Pass the name of a collection to filter results.
          examples:
          - grit
        description: Pass the name of a collection to filter results.
      - name: stix_version
        in: query
        required: false
        schema:
          type: string
          description: Pass the STIX version of the inboxed objects to filter results.
          enum:
          - 1.x
          - 2.x
          examples:
          - 1.x
        description: Pass the STIX version of the inboxed objects to filter results.
      - name: created_from
        in: query
        required: false
        schema:
          type: number
          description: Pass the inboxing start date in epoch format to filter results.
          default: Last 15 days
          examples:
          - '1696338596'
        description: Pass the inboxing start date in epoch format to filter results.
      - name: created_to
        in: query
        required: false
        schema:
          type: number
          description: Pass the inboxing end date in epoch format to filter results.
          default: Last 15 days
          examples:
          - '1697634596'
        description: Pass the inboxing end date in epoch format to filter results.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: object
                    description: Returns a link to the next page of pagination.
                  previous:
                    type: object
                    description: Returns a link to the previous page of pagination.
                  page_size:
                    type: integer
                    description: Returns the number of records returned per page.
                    examples:
                    - 10
                  total:
                    type: integer
                    description: Returns the total number of records on the platform.
                    examples:
                    - 2
                  results:
                    type: array
                    description: Returns JSON objects for the subscriber details.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the ID of an inboxing record.
                          examples:
                          - 3e518801-da09-4c14-a818-81e042a5bb19
                        subscriber_id:
                          type: string
                          description: Returns the ID of a subscriber.
                          examples:
                          - 74121986-16d5-46cb-9796-61d3ff722462
                        name:
                          type: string
                          description: Returns the name of a subscriber.
                          examples:
                          - Subscriber1
                        stix_version:
                          type: string
                          description: Returns the STIX version of the threat data objects inboxed for active subscribers. Returns null for inactive subscribers.
                          examples:
                          - 2.x
                        object_count:
                          type: integer
                          description: Returns the number of threat data objects inboxed for active subscribers. Returns 0 for inactive subscribers.
                          examples:
                          - 91
                        last_inbox:
                          type: integer
                          description: Returns the last inboxed time in epoch format for active subscribers. Returns null for inactive subscribers.
                          examples:
                          - 1698305478.585438
                        collection:
                          type: object
                          description: Returns the details of the collection into which threat data objects were inboxed.
                          properties:
                            name:
                              type: string
                              description: Returns the name of the collection.
                              examples:
                              - hsdjcoll
                            id:
                              type: string
                              description: Returns the ID of the collection.
                              examples:
                              - 9e8eef6e-a510-4c72-ab81-1d4d0d02d344
                            "hide_aggregate_col\t":
                              type: boolean
                              description: Returns true of the aggregated columns are hidden, else returns false.
                              examples:
                              - 'true'
              example:
                next: {}
                previous: {}
                page_size: 10
                total: 2
                results:
                - id: 3e518801-da09-4c14-a818-81e042a5bb19
                  subscriber_id: 74121986-16d5-46cb-9796-61d3ff722462
                  name: Subscriber1
                  stix_version: 2.x
                  object_count: 91
                  last_inbox: 1698305478.585438
                  collection:
                    name: hsdjcoll
                    id: 9e8eef6e-a510-4c72-ab81-1d4d0d02d344
                    "hide_aggregate_col\t": 'true'
