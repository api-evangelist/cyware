                            last_name:
                              type: string
                              description: Returns the user's last name.
                              examples:
                              - Doe
                  total:
                    type: number
                    description: Returns the total number of records retrieved.
                    examples:
                    - '2'
              example:
                next: policy/?page=2&page_size=10
                page_size: '10'
