                              is_required:
                                type: boolean
                                description: If true, the field must be filled when creating an object of this type.
                                examples:
                                - 'true'
                        primary_attribute:
                          type: string
                          description: Returns the primary attribute name of the custom object.
                          examples:
                          - analysis
              example:
                next: configuration/custom-object/?page=3&page_size=1
                previous: configuration/custom-object/?page=1&page_size=1
                total: '42'
                page_size: '1'
                results:
                - id: f3ecef79-b35d-45a5-bbfa-c4c7b30ca93b
                  name: sample
