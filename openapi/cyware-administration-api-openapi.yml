                          - x-sample
                        description:
                          type: string
                          description: Returns the description of the custom object.
                          examples:
                          - sample
                        ctix_created:
                          type: number
                          description: Returns the date of creation of the custom object in epoch format.
                          examples:
                          - '1710739021'
                        ctix_modified:
                          type: number
                          description: Returns the date of modification of the custom object in epoch format.
                          examples:
                          - '1710739021'
                        status:
                          type: number
                          description: Returns one if the status of the object is active, else returns a random integer if the status of the object is inactive.
                          examples:
                          - '1'
                        manual:
                          type: boolean
                          description: Returns true if the object is manually created by users, else returns false.
                          examples:
                          - 'true'
                        fields:
                          type: array
                          description: Returns the list of custom attributes of the custom objects.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Returns the unique identifier of the custom field.
                                examples:
                                - 79c35702-cec6-49be-8a7b-13d11a9c8478
                              name:
                                type: string
                                description: Returns the name of the custom field.
                                examples:
                                - analysis
                              name_slug:
                                type: string
                                description: Returns the slug of the custom field name.
                                examples:
                                - analysis
                              type:
                                type: number
                                description: Returns the data type of the custom field.
                                examples:
                                - '2'
                              description:
                                type: object
                                description: Returns the description of the custom field.
                              ctix_created:
                                type: number
                                description: Returns the Unix timestamp indicating when the custom field was created.
                                examples:
                                - '1703243151'
                              ctix_modified:
                                type: number
                                description: Returns the Unix timestamp indicating when the custom field was last modified.
                                examples:
                                - '1703243151'
                              choices:
                                type: array
                                description: Returns a list of predefined choices if the field type is dropdown/select.
                                items: {}
