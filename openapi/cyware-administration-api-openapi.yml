                        type:
                          type: string
                          description: Returns the type of collection.
                          examples:
                          - DATA_FEED
                        is_editable:
                          type: boolean
                          description: Returns true if the collection is editable, else returns false.
                          examples:
                          - 'true'
                        polling:
                          type: boolean
                          description: Returns true if the polling is allowed, else returns false.
                          examples:
                          - 'true'
                        inbox:
                          type: boolean
                          description: Returns true if the inbox is allowed for collection, else returns false.
                          examples:
                          - 'true'
                        created:
                          type: number
                          description: Returns the date and time at which the collection was created.
                          examples:
                          - '1721741850'
                        has_subscribed:
                          type: object
                          description: Returns true if the collection is subscribed by any subscriber, else returns false.
                        marking_config:
                          type: string
                          description: Returns the data marking type.
                          examples:
                          - tlp
                        default_marking_definition:
                          type: object
                          description: Returns the default data marking configuration.
                          properties:
                            id:
                              type: string
                              description: Returns the unique identifier of the marking definition.
                              examples:
                              - marking-definition--f88d31f6-486f-44da-b317-01333bde0b82
                            name:
                              type: string
                              description: Returns the name of the marking definition.
                              examples:
                              - TLP:AMBER
                            type:
                              type: string
                              description: Returns the STIX object type.
                              examples:
                              - marking-definition
                            created:
                              type: string
                              description: Returns the ISO timestamp when the marking was created.
