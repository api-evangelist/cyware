        description: Pass the `modified_to` time in epoch format to filter records based on the Intel Exchange modified time.
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of a user to filter records based on the creator.
          examples:
          - 2e4cc862-08e2-4d77-a73b-16ac2bf5ce44
        description: Pass the ID of a user to filter records based on the creator.
      - name: modified_by
        in: query
        required: false
        schema:
          type: string
          description: Pass the ID of a user to filter records based on the modifier.
          examples:
          - 2e4cc862-08e2-4d77-a73b-16ac2bf5ce44
        description: Pass the ID of a user to filter records based on the modifier.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-ctix_created` to sort records by the last modified date in descending order. Pass `ctix_created` to sort records by the last modified date in ascending order.
          enum:
          - ctix_created
          - -ctix_created
          examples:
          - -ctix_created
        description: Pass `-ctix_created` to sort records by the last modified date in descending order. Pass `ctix_created` to sort records by the last modified date in ascending order.
      - name: q
        in: query
