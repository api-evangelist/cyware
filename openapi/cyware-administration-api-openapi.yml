      description: Retrieves a list of custom objects from the platform.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/custom-entitites-management/custom-objects/list-custom-objects
      parameters:
      - name: manual
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve custom attributes manually created by users. Pass false to retrieve custom attributes created by the system.
          examples:
          - 'true'
        description: Pass true to retrieve custom attributes manually created by users. Pass false to retrieve custom attributes created by the system.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass a keyword to search for objects by the title.
          examples:
          - credit
        description: Pass a keyword to search for objects by the title.
      - name: ctix_created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the `created_from` time in epoch format to filter records based on the Intel Exchange created time.
          examples:
          - '1633093577'
        description: Pass the `created_from` time in epoch format to filter records based on the Intel Exchange created time.
      - name: ctix_created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the `created_to` time in epoch format to filter records based on the Intel Exchange created time.
          examples:
          - '1633093578'
        description: Pass the `created_to` time in epoch format to filter records based on the Intel Exchange created time.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records to retrieve on each page.
          default: '10'
          examples:
          - '10'
        description: Pass the number of records to retrieve on each page.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-ctix_modified` to sort records by the last modified date in descending order. Pass `ctix_modified` to sort records by the last modified date in ascending order.
          enum:
          - ctix_modified
          - -ctix_modified
        description: Pass `-ctix_modified` to sort records by the last modified date in descending order. Pass `ctix_modified` to sort records by the last modified date in ascending order.
      - name: ctix_modified_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the `modified_from` time in epoch format to filter records based on the Intel Exchange modified time.
          examples:
          - '1711929600'
        description: Pass the `modified_from` time in epoch format to filter records based on the Intel Exchange modified time.
      - name: ctix_modified_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the `modified_to` time in epoch format to filter records based on the Intel Exchange modified time.
          examples:
          - '1712620799'
        description: Pass the `modified_to` time in epoch format to filter records based on the Intel Exchange modified time.
