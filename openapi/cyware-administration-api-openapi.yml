                              type: string
                              description: Returns the last name of the creator.
                              examples:
                              - LastName
                            email:
                              type: string
                              description: Returns the email address of the creator.
                              examples:
                              - username@domain.com
                            is_active:
                              type: boolean
                              description: Returns true if the creator's account is active, else returns false.
                              examples:
                              - 'true'
                            contact_number:
                              type: string
                              description: Returns the contact number of the creator.
                            country_code:
                              type: string
                              description: Returns the country code associated with the creator’s contact number.
                              examples:
                              - '91'
                        is_editable:
                          type: boolean
                          description: Returns True if the user group can be edited, else returns False.
                          examples:
                          - 'true'
                        is_active:
                          type: boolean
                          description: Returns True if the user group is active, else returns False.
                          examples:
                          - 'true'
                        created:
                          type: number
                          description: Returns the date and time of the creation of the user group.
                          examples:
