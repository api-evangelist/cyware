  /ingestion/configuration/custom-attribute/:
    post:
      operationId: createCustomAttribute
      summary: Create Custom Attribute
      tags:
      - Administration
      description: Creates a custom attribute in the platform.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/custom-entitites-management/custom-attributes/create-custom-attribute
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: number
                  description: Pass 1 to activate the attribute. Pass 0 to deactivate the attribute.
                  enum:
                  - '0'
                  - '1'
                  default: '1'
                  examples:
                  - '1'
                description:
                  type: string
                  description: Pass a description for the attribute within 500 characters.
                  examples:
                  - location data
                name:
                  type: string
                  description: Pass a name for the attribute within 100 characters.
                  examples:
                  - location
                type:
                  type: number
                  description: Pass the number associated with the type.
                  enum:
                  - '0'
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  - '6'
                  examples:
                  - '3'
                choices:
                  type: array
                  description: Pass the list of choices for a single-select attribute.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - SDO1
                is_actionable:
                  type: boolean
                  description: Pass true to enable the custom attribute to be modified in threat data objects.
                  default: 'false'
                  examples:
                  - 'false'
                sdo_objects:
                  type: array
                  description: 'Pass the list of SDOs on which you want to list this attribute as actionable.

                    To get the list of supported SDO types, see the **Supported SDO Types** table in **Threat Data** > **Miscellaneous**.'
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - indicator
            example:
              status: '1'
              description: location data
              name: location
              type: '3'
              choices:
              - SDO1
              is_actionable: 'false'
              sdo_objects:
              - indicator
      responses:
        '201':
          description: HTTP 201 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the unique ID for the custom attribute.
                    examples:
                    - f63bd86e-441d-4cb8-86d3-9c5e0bdd45d8
                  name:
                    type: string
                    description: Returns the name of the custom attribute.
                    examples:
                    - location
                  type:
                    type: number
                    description: Returns the number associated with the attribute type.
                    examples:
                    - '3'
                  description:
                    type: string
                    description: Returns the description of the custom attribute.
                    examples:
                    - location data
                  ctix_created:
                    type: number
                    description: Returns the creation date of the custom attribute.
                    examples:
                    - '1633107657'
                  ctix_modified:
                    type: number
                    description: Returns the modification date of the custom attribute.
                    examples:
                    - '1633107657'
                  choices:
                    type: array
                    description: Returns the list of options available for a single-select attribute.
                    items:
                      type: string
                      description: This is an example value.
                      examples:
                      - SDO1
                  is_actionable:
                    type: boolean
                    description: Returns true if an attribute can be modified in threat data objects, else returns false.
                    examples:
                    - 'false'
                  status:
                    type: number
                    description: Returns the number associated with the attribute status.
                    examples:
                    - '1'
                  sdo_objects:
                    type: array
                    description: Returns the list of SDOs on which the attribute is applicable.
                    items:
                      type: string
                      description: This is an example value.
                      examples:
                      - indicator
                  manual:
                    type: boolean
                    description: Returns true if the attribute is manually created by users, else returns false.
                    examples:
                    - 'true'
              example:
                id: f63bd86e-441d-4cb8-86d3-9c5e0bdd45d8
                name: location
                type: '3'
                description: location data
                ctix_created: '1633107657'
                ctix_modified: '1633107657'
                choices:
                - SDO1
                is_actionable: 'false'
                status: '1'
                sdo_objects:
                - indicator
                manual: 'true'
    get:
      operationId: listCustomAttributes
      summary: Get Custom Attributes List
      tags:
      - Administration
      description: Returns a list of custom attributes from the platform.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/administration/custom-entitites-management/custom-attributes/list-custom-attributes
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-ctix_modified` to sort records by the last modified date in descending order. Pass `ctix_modified` to sort records by the last modified date in ascending order.
          enum:
          - ctix_modified
          - -ctix_modified
          examples:
          - ctix_modified
        description: Pass `-ctix_modified` to sort records by the last modified date in descending order. Pass `ctix_modified` to sort records by the last modified date in ascending order.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records to retrieve on each page.
          default: '10'
          examples:
          - '5'
        description: Pass the number of records to retrieve on each page.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve records.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve records.
      - name: ctix_created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the `created_from` time in epoch format to filter records based on the Intel Exchange created time.
          examples:
          - '1633090980'
        description: Pass the `created_from` time in epoch format to filter records based on the Intel Exchange created time.
      - name: ctix_created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the `created_to time` in epoch format to filter records based on the Intel Exchange created time.
          examples:
          - '1633090981'
        description: Pass the `created_to time` in epoch format to filter records based on the Intel Exchange created time.
      - name: type
        in: query
        required: false
        schema:
          type: integer
          description: Pass a number for the respective attribute type.
          enum:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          examples:
          - '3'
        description: Pass a number for the respective attribute type.
      - name: status
        in: query
        required: false
        schema:
          type: integer
          description: Pass a number for the respective status.
          enum:
          - '0'
          - '1'
          examples:
          - '1'
        description: Pass a number for the respective status.
      - name: manual
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve custom attributes manually created by users. Pass false to retrieve custom attributes created by the system.
          examples:
          - 'true'
        description: Pass true to retrieve custom attributes manually created by users. Pass false to retrieve custom attributes created by the system.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass a keyword to search for attributes by the title.
          examples:
          - pin
        description: Pass a keyword to search for attributes by the title.
      - name: ctix_modified_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the `modified_from` time in epoch format to filter records based on the Intel Exchange modified time.
          examples:
          - '1711929600'
        description: Pass the `modified_from` time in epoch format to filter records based on the Intel Exchange modified time.
      - name: ctix_modified_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the `modified_to` time in epoch format to filter records based on the Intel Exchange modified time.
          examples:
          - '1712620799'
        description: Pass the `modified_to` time in epoch format to filter records based on the Intel Exchange modified time.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: object
                    description: Returns the URL endpoint of the next page.
                  previous:
                    type: object
                    description: Returns the URL endpoint of the previous page.
                  total:
                    type: number
                    description: Returns the total number of custom attributes available in the platform.
                    examples:
                    - '1'
                  results:
                    type: array
                    description: Returns the list of result objects.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the unique ID for the custom attribute.
                          examples:
                          - 94db014d-a713-4904-9a9a-d6fec593b52e
                        name:
                          type: string
                          description: Returns the name of the custom attribute.
                          examples:
                          - pin
                        type:
                          type: number
                          description: Returns the number associated with the attribute type.
                          examples:
                          - '3'
                        ctix_created:
                          type: number
                          description: Returns the creation date of the custom attribute.
                          examples:
                          - '1633090980'
                        ctix_modified:
                          type: number
                          description: Returns the modification date of the custom attribute.
                          examples:
                          - '1633090980'
                        choices:
                          type: array
                          description: Returns the list of options available for a single-select attribute.
                          items:
                            type: string
                            description: This is an example value.
                            examples:
                            - SDO1
                        is_actionable:
                          type: boolean
                          description: Returns true if an attribute can be modified in threat data objects, else returns false.
                          examples:
                          - 'false'
                        status:
                          type: number
                          description: Returns the number associated with the attribute status.
                          examples:
                          - '1'
                        sdo_objects:
                          type: array
                          description: Returns the list of SDOs on which the attribute is applicable.
                          items:
                            type: string
                            description: This is an example value.
