                              description: Returns the unique identifier of the user who created the group.
                              examples:
                              - 010f5d90-f510-40e5-82a0-dd90f4546dd2
                            first_name:
                              type: string
                              description: Returns the first name of the creator.
                              examples:
                              - FirstName
