          type: string
          description: Filter results by page number.
          examples:
          - '1'
        description: Filter results by page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Filter results by the page size of response.
          maxLength: 100
          examples:
          - '10'
        description: Filter results by the page size of response.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass `-created` to sort by created date in descending order. Pass `created` to sort by created date in ascending order.
          examples:
          - -created
        description: Pass `-created` to sort by created date in descending order. Pass `created` to sort by created date in ascending order.
      - name: is_active
        in: query
        required: false
        schema:
          type: string
          description: Pass true to retrieve active collections.
          examples:
          - 'true'
        description: Pass true to retrieve active collections.
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          description: Pass the created from time to retrieve collection based on the created date.
          examples:
          - '1722124800'
        description: Pass the created from time to retrieve collection based on the created date.
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          description: Pass the created to time to retrieve collection based on the created date.
          examples:
          - '1722643199'
        description: Pass the created to time to retrieve collection based on the created date.
      - name: type
        in: query
        required: false
        schema:
          type: string
          description: Pass the type of collection.
          enum:
          - inbox
          - polling
        description: Pass the type of collection.
      - name: q
        in: query
        required: false
        schema:
          type: string
