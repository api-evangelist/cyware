  /v1/integrations/apps-instances/test-connectivity/{instance_id}/:
    get:
      operationId: testAppInstanceConnectivity
      summary: Test App Instance Connectivity
      tags:
      - Integrations
      description: Verify the connectivity of an app instance.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/integrations/test-app-instance-connectivity
      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
          description: "Enter the unique ID of the instance to test the connectivity. \nExample: *d6a03423-52fd-479b-a79d-85102e53861f*.\nYou can retrieve the instance ID using the **Get App Instances** endpoint."
          examples:
          - dcc1b286-b34f-4f87-a662-3ef45d4aefa9
        description: "Enter the unique ID of the instance to test the connectivity. \nExample: *d6a03423-52fd-479b-a79d-85102e53861f*.\nYou can retrieve the instance ID using the **Get App Instances** endpoint."
      responses:
        '200':
          description: HTTP 200 response
          content:
            json:
              schema:
                type: object
                properties:
                  connectivity_message:
                    type: string
                    description: Returns the message conveying the connectivity status.
                    examples:
                    - Authentication successful
                  connectivity_status:
                    type: string
                    description: Returns the connectivity status,  indicating either SUCCESS or FAIL.
                    examples:
                    - SUCCESS
                  connectivity_detail:
                    type: string
                    description: Returns the details related to the connectivity.
                    examples:
                    - 'null'
                  tested_by:
                    type: string
                    description: Returns the unique ID of the user who tested the app instance.
                    examples:
                    - bf62bdbe-c280-4882-b947-c750b31062fb
                  tested_date:
                    type: string
                    description: Returns the date and time of when the instance was tested.
                    examples:
                    - '2022-07-26T13:31:11.811507596Z'
                  title:
                    type: string
                    description: Returns the title of the app instance.
                    examples:
                    - Instance
                  status_code:
                    type: string
                    description: Returns the status code based on the status of the instance.
                  is_lite:
                    type: boolean
                    description: Indicates if the app instance is agent compatible or not.
                    examples:
                    - false
                  unique_id:
                    type: string
                    description: Returns the unique ID of the app instance.
                    examples:
                    - instance-unique-id
                  tested_by_data:
                    type: object
                    description: Returns the details of the user who tested the instance.
                    properties:
                      unique_id:
                        type: string
                        description: Returns unique ID of the user who tested the instance.
                        examples:
                        - bf62bdbe-c280-4882-b947-c750b31062fb
                      first_name:
                        type: string
                        description: Returns first name of the user who tested the instance.
                        examples:
                        - Jon
                      last_name:
                        type: string
                        description: Returns last name of the user who tested the instance.
                        examples:
                        - Doe
                      full_name:
                        type: string
                        description: Returns full name of the user who tested the instance.
                        examples:
                        - Jon Doe
              example:
                connectivity_message: Authentication successful
                connectivity_status: SUCCESS
                connectivity_detail: 'null'
                tested_by: bf62bdbe-c280-4882-b947-c750b31062fb
                tested_date: '2022-07-26T13:31:11.811507596Z'
                title: Instance
                status_code: null
                is_lite: false
                unique_id: instance-unique-id
                tested_by_data:
                  unique_id: bf62bdbe-c280-4882-b947-c750b31062fb
                  first_name: Jon
                  last_name: Doe
                  full_name: Jon Doe
components:
  securitySchemes:
    coOpenApiSignature:
      type: apiKey
      in: query
      name: access_id
      description: Orchestrate Open API credentials. Every request carries access_id, expires (epoch, current time + up to 30 seconds) and signature query parameters, where StringToSign = access_id + "\n" + expires and Signature = Base64(HMAC-SHA1(secret_key, StringToSign)). See https://orchestrateapi.cyware.com/authentication
externalDocs:
  description: Cyware Orchestrate API Reference
  url: https://orchestrateapi.cyware.com/
