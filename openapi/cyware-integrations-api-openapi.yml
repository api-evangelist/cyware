ion can be used to get the reputation details of an IP address in Abuse IPDB.\",\n            \"accepted_params\": [\n                {\n                    \"title\": \"IP Address\",\n                    \"field_key\": \"ip_address\",\n                    \"field_type\": \"text\",\n                    \"description\": \"Input an IP address.\",\n                    \"is_required\": true\n                },\n                {\n                    \"title\": \"Detailed Report\",\n                    \"field_key\": \"detailed_report\",\n                    \"field_type\": \"boolean\",\n                    \"description\": \"Option to get a detailed report. Default: False\"\n                },\n                {\n                    \"title\": \"Days To Look Back\",\n                    \"field_key\": \"get_report_since\",\n                    \"field_type\": \"integer\",\n                    \"description\": \"Input a number of days to go back for fetch reports.\\nDefault - '30' Days, min - 1 day, max - 365 days\"\n                }\n            ],\n            \"return_values\": [],\n            \"app\": \"abuse_ipdb_1.0.1\",\n            \"action_identifier\": \"check_ip_address\"\n        },\n        {\n            \"title\": \"Check Subnet Reputation\",\n            \"description\": \"This action can be used to get the reputation of a subnet from Abuse IPDB.\",\n            \"accepted_params\": [\n                {\n                    \"title\": \"IP Address Subnet\",\n                    \"field_key\": \"network_subnet\",\n                    \"field_type\": \"text\",\n                    \"description\": \"Input the IP address Subnet (CIDR)\\n- 127.0.0.1/26\",\n                    \"is_required\": true\n                },\n                {\n                    \"title\": \"Days To Look Back\",\n                    \"field_key\": \"get_report_since\",\n                    \"field_type\": \"integer\",\n                    \"description\": \"Input the number of days to go back for fetch reports.\\nDefault - '30' Days, min - 1 day, max - 365 days\"\n                }\n            ],\n            \"return_values\": [],\n            \"app\": \"abuse_ipdb_1.0.1\",\n            \"action_identifier\": \"check_cidr\"\n        },\n        {\n            \"title\": \"Report Malicious IP Address\",\n            \"description\": \"This action can be used to report a malicious IP Address to Abuse IPDB.\",\n            \"accepted_params\": [\n                {\n                    \"title\": \"IP Address\",\n                    \"field_key\": \"ip_address\",\n                    \"field_type\": \"text\",\n                    \"description\": \"Input the IP address.\",\n                    \"is_required\": true\n                },\n                {\n                    \"title\": \"List of Categories\",\n                    \"field_key\": \"categories\",\n                    \"field_type\": \"text\",\n                    \"description\": \"Input the categories; support in a comma separated list of category numbers;\\n3 - Fraud Orders, 4 - DDoS Attack, 5 - FTP Brute-Force, 6 - Ping of Death\\n7 - Phishing, 8 - Fraud VoIP, 9 - Open Proxy, 10 - Web Spam\\n11 - Email Spam, 12 - Blog Spam, 13 - VPN IP, 14 - Port Scan\\n15 - Hacking, 16 - SQL Injection, 17 - Spoofing, 18 - Brute-Force\\n19 - Bad Web Bot, 20 - Exploited Host, 21 - Web App Attack\\n22 - SSH, 23 - IoT Targeted\",\n                    \"is_required\": true\n                },\n                {\n                    \"title\": \"Description\",\n                    \"field_key\": \"description\",\n                    \"field_type\": \"text\",\n                    \"description\": \"Input a description.\"\n                }\n            ],\n            \"return_values\": [],\n            \"app\": \"abuse_ipdb_1.0.1\",\n            \"action_identifier\": \"report_ip_address\"\n        }\n    ],\n    \"supported_versions\": \"1.0.1\",\n    \"connector_version\": \"1.0.1\",\n    \"categories\": [\n        \"Data Enrichment \\u0026 Threat Intelligence\"\n    ],\n    \"lite_enabled\": false,\n    \"published_by\": \"Cyware\",\n    \"published_date\": \"2021-05-27T11:21:50+00:00\",\n    \"documentation_url\": \"\",\n    \"agent_version_slug\": \"\",\n    \"supporting_media\": null,\n    \"app_hash\": \"\",\n    \"publisher_logo_url\": \"\"\n}PKOªPK__init__.pyPKPKv����connector.pyPK��3��*�*��;Logo_abuse_ipdb.pngPKOª��\"Aconfig.jsonPK���S__init__.pyPK�T"
  /v1/integrations/actions/execute/:
    post:
      operationId: executeAction
      summary: Execute Action
      tags:
      - Integrations
      description: Execute an app action by passing the required parameters in the payload.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/integrations/execute-action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_identifier:
                  type: string
                  description: Pass the identifier of the app. For example, *abuse_ipdb*. You can use the **Get Apps** endpoint to retrieve the identifier of an app.
                  examples:
                  - abuse_ipdb
                action_identifier:
                  type: string
                  description: Pass the unique identifier of the action. For example, *check_ip_address*. You can use the **Get App Actions** endpoint to retrieve the identifier of an action.
                  examples:
                  - check_ip_address
                action_params:
                  type: object
                  description: Pass the parameters required to execute the action. You can retrieve the details of the required parameters of the action using the **Get Action Details** endpoint.
                  properties:
                    ip_address:
                      type: string
                      description: Pass the required request parameters to execute the action.
                      examples:
                      - 8.8.8.8
                app_instance_slug:
                  type: string
                  description: Pass the resource identifier of the app instance to execute an action. You can retrieve the identifier of an instance using the **Get App Instances** endpoint.
                  examples:
                  - uat_instance
              required:
              - app_identifier
              - action_identifier
              - action_params
              - app_instance_slug
            example:
              app_identifier: abuse_ipdb
              action_identifier: check_ip_address
              action_params:
                ip_address: 8.8.8.8
              app_instance_slug: uat_instance
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Returns the results of the executed action, with response details varying based on the specific action performed.
                    properties:
                      result:
                        type: object
                        description: Returns the details of the action executed.
                        properties:
                          filescan_id:
                            type: object
                            description: Returns the response parameters and the values after the action execution.
                          permalink:
                            type: string
                            description: URL link to the source execution.
                            examples:
