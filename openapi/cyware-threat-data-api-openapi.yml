                        country:
                          type: object
                          description: Returns the country name where the threat data object was seen.
                        created:
                          type: number
                          description: Returns the date and time of the creation of the threat data object.
                          examples:
                          - '1641555724'
                        ctix_created:
                          type: number
                          description: Returns the date and time of the creation of the threat data object in Intel Exchange.
                          examples:
                          - '1641555726'
                        ctix_modified:
                          type: number
                          description: Returns the date and time of modification of the threat data object in Intel Exchange.
                          examples:
                          - '1641555726'
                        first_seen:
                          type: object
                          description: Returns the epoch time at which the threat data object was first seen.
                        id:
                          type: string
                          description: Returns the ID of the threat data object.
                          examples:
                          - 16c5f2ca-0abb-449c-97f6-b05c3ae475dd
                        indicator_type:
                          type: string
                          description: Returns the type of indicator. Returns null if the threat data object is not an indicator.
                          examples:
                          - url
                        ioc_type:
                          type: string
                          description: Returns the type of indicator. Returns null if the threat data object is not an indicator.
                          examples:
                          - url
                        is_actioned:
                          type: boolean
                          description: Returns true if any action was performed on the threat data object, else returns false.
                          examples:
                          - 'false'
                        is_deprecated:
                          type: boolean
                          description: Returns true if the threat data object is deprecated, else returns false.
                          examples:
                          - 'false'
                        is_false_positive:
                          type: boolean
                          description: Returns true if the threat data object is marked as false positive, else returns false.
                          examples:
                          - 'false'
                        is_reviewed:
                          type: boolean
                          description: Returns true if the threat data object is reviewed, else returns false.
                          examples:
                          - 'false'
                        is_revoked:
                          type: boolean
                          description: Returns true if the threat data object is revoked, else returns false.
                          examples:
                          - 'false'
                        is_whitelisted:
                          type: boolean
                          description: Returns true if the threat data object is marked as an allowed indicator, else returns false.
                          examples:
                          - 'false'
                        last_seen:
                          type: object
                          description: Returns the last seen date and time of the threat data object.
                        modified:
                          type: number
                          description: Returns the modified date and time (epoch) of the threat data object.
                          examples:
                          - '1641977341'
                        name:
                          type: string
                          description: Returns the name of the threat data object.
                          examples:
                          - https://osborne.com/
                        'null':
                          type: array
                          description: The field appears to be a placeholder or artefact from the API response structure.
                          items: {}
                        primary_attribute:
                          type: object
