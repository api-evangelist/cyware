                        analyst_tlp:
                          type: string
                          description: Returns the TLP assigned to a threat data object by an analyst.
                          examples:
                          - GREEN
                        confidence_score:
                          type: number
                          description: Returns the score calculated by the Intel Exchange confidence score engine.
                          examples:
                          - '55.94'
                        confidence_type:
                          type: string
                          description: Returns the type of confidence.
                          enum:
                          - ctix
