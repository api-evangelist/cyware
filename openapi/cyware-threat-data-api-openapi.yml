                          description: Returns the sub-type of an object if it is an indicator.
                          examples:
                          - value
                        subscriber_collections:
                          type: array
                          description: Returns details of subscriber collections.
                          items: {}
                        subscribers:
                          type: array
                          description: Returns details of subscribers.
                          items: {}
                        tags:
                          type: array
                          description: Returns the details of tags associated with the threat data object.
                          items:
                            type: object
                            properties:
                              colour_code:
                                type: object
                                description: Returns the colour code in HEX format associated with the tag.
                              id:
                                type: string
                                description: Returns the tag ID.
                                examples:
                                - 26c9218a-2689-4536-8044-5598c86e410a
                              name:
                                type: string
                                description: Returns the tag name.
                                examples:
                                - international
                        tlp:
                          type: string
                          description: Returns the TLP assigned to the threat data object.
                          examples:
                          - GREEN
                        type:
                          type: string
                          description: Returns the type of threat data object (object type).
                          examples:
