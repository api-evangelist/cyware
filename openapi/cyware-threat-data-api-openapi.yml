  /ingestion/threat-data/bulk-action/run_rule/:
    post:
      operationId: bulkRunRule
      summary: Bulk Run Rule
      tags:
      - Threat Data
      description: Add a rule on multiple threat data objects. You can run rules that are configured for manual execution only.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/bulk-actions/bulk-run-rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object_type:
                  type: string
                  description: Pass the type of threat data objects. To get the list of supported object types, see **Supported SDO Types** in **Threat Data** > **Miscellaneous**.
                  examples:
                  - indicator
                object_ids:
                  type: array
                  description: Pass the list of threat data object IDs to perform the bulk action. To retrieve a list of object IDs, use the **List Threat Data API** under the Threat Data section.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - 49d5e95e-3889-42de-8280-1ebf5c7cb95a
                data:
                  type: object
                  description: Pass the relation data to pass with the request.
                  properties:
                    id:
                      type: string
                      description: Pass the ID of a rule to run. To retrieve the list of rules, use the **List Rules API** under the Rules section.
                      examples:
                      - 5602232e-085b-4c15-89af-404ea45c5703
                  required:
                  - id
              required:
              - object_type
              - object_ids
              - data
            example:
              object_type: indicator
              object_ids:
              - 49d5e95e-3889-42de-8280-1ebf5c7cb95a
              data:
                id: 5602232e-085b-4c15-89af-404ea45c5703
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Returns a success or failure message.
                    examples:
                    - Action Successfully Executed
              example:
                message: Action Successfully Executed
  /ingestion/export/:
    post:
      operationId: generateExportFile
      summary: Generate Export File
      tags:
      - Threat Data
      description: 'Initiates export of threat data objects to a CSV file based on the CQL input. This API returns a file ID to retrieve the export file download link. You can export a maximum of 100,000 threat data objects in one API request.


        ### **The Column Object**


        Each column object includes the key and value of a column. You can include the following columns in the export file:


        name


        Value


        type


        Type


        tlp


        TLP


        tags


        Tags


        sources


        Source


        source_collections


        Source Collection


        published_collections


        Published Collections


        ctix_created


        System Created Date


        ctix_modified


        System Modified Date


        country


        Country


        analyst_score


        Analyst Score


        source_confidence


        Source Confidence'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/export/generate-export-file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: Pass the export file format. Currently, Intel Exchange supports only the CSV format.
                  enum:
                  - csv
                  default: csv
                  examples:
                  - csv
                component:
                  type: string
                  description: "Pass the component you want to export.  \nCurrently, Intel Exchange supports only `threat_data`."
                  enum:
                  - threat_data
                  default: threat_data
                  examples:
                  - threat_data
                query:
                  type: string
                  description: "Pass the CQL query to filter threat data objects.  \nTip: You can copy the CQL from the Intel Exchange user interface. Press the following keys to copy the CQL code to use in the API request payload:  \nWindows: Windows + Shift + C  \nMacOS: Command + Shift + C"
                  examples:
                  - type = "tool"
                columns:
                  type: array
                  description: Pass the list of columns you want to export. For the allowed list of columns, see *The Column Object*.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: Pass the key value.
                        examples:
                        - type
                      label:
                        type: string
                        description: Pass the UI label.
                        examples:
                        - Type
              required:
              - format
              - component
              - query
              - columns
            example:
              format: csv
              component: threat_data
              query: type = "tool"
              columns:
              - key: type
                label: Type
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  details:
                    type: string
                    description: Returns a message that export of the threat data objects is initiated.
                    examples:
                    - Export is in progress. You will receive a notification once the export is complete.
                  file_id:
                    type: string
                    description: Returns the ID of the export file. You can use this ID to retrieve the download link using the Retrieve **Download Link API**.
                    examples:
                    - 48294eb5-ad7a-439e-83e4-d99da6921076
              example:
                details: Export is in progress. You will receive a notification once the export is complete.
                file_id: 48294eb5-ad7a-439e-83e4-d99da6921076
  /ingestion/threat-data/list/:
    post:
      operationId: listThreatData
      summary: Get Threat Data List
      tags:
      - Threat Data
      description: Returns a list of threat data objects from Intel Exchange using a CQL query.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/list-threat-data
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to filter threat data objects by page number.
          default: '1'
        description: Pass the page number to filter threat data objects by page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of records per page to filter the threat data objects by page size.
          default: '10'
        description: Pass the number of records per page to filter the threat data objects by page size.
      - name: page_limit
        in: query
        required: false
        schema:
          type: integer
          description: Pass the total number of threat data objects to be retrieved.
        description: Pass the total number of threat data objects to be retrieved.
      - name: enrichment
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve the details of the last enrichment details for the objects, if available.
          examples:
          - 'true'
        description: Pass true to retrieve the details of the last enrichment details for the objects, if available.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Pass the sorting order for the records.
          enum:
          - -ctix_created
          - ctix_created
          default: -ctix_created
          examples:
          - -ctix_created
        description: Pass the sorting order for the records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Pass a CQL query to filter and fetch results.
                  examples:
                  - type = "indicator"
              required:
              - query
            example:
              query: type = "indicator"
      responses:
