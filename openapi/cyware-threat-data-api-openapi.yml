  /ingestion/threat-data/bulk-lookup-and-create/:
    post:
      operationId: bulkIocLookupAndCreateIntel
      summary: Bulk IOC Lookup and Create Intel
      tags:
      - Threat Data
      description: 'Perform a lookup for IOCs to retrieve the list of objects available in Intel Exchange. If some IOCs are not available in the platform, you can choose to create intel and ingest the missing IOCs. You can look up and ingest a maximum of 1000 IOCs in an API request.


        You can perform a lookup for the following IOC types:


        * IPv4


        * IPv6


        * Email Address


        * MD5


        * SHA1


        * SHA256


        * SHA512


        * SSDEEP


        * URL


        * Domain'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/bulk-actions/bulk-ioc-lookup-and-create-intel
      parameters:
      - name: enrichment
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to retrieve the last enriched details of the IOCs.
          default: 'false'
          examples:
          - 'true'
        description: Pass true to retrieve the last enriched details of the IOCs.
      - name: create
        in: query
        required: false
        schema:
          type: boolean
          description: Pass true to create valid IOCs in the payload as threat data objects in the Threat Data module in Intel Exchange.
          default: 'false'
          examples:
          - 'true'
        description: Pass true to create valid IOCs in the payload as threat data objects in the Threat Data module in Intel Exchange.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ioc_values:
                  type: array
                  description: Pass a list of up to 1000 IOC values to look up.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - 76.77.23.225
                metadata:
                  type: object
                  description: Pass additional information to associate with the intel.
                  properties:
                    tlp:
                      type: string
                      description: Pass the TLP to associate with the intel.
                      enum:
                      - GREEN
                      - AMBER
                      - RED
                      - WHITE
                      - NONE
                      default: NONE
                      examples:
                      - RED
                    confidence:
                      type: number
                      description: Pass the Source Confidence Score to associate with the intel.
                      default: '100'
                      examples:
                      - 100
                    tags:
                      type: array
                      description: Pass a list of tag names to associate with the intel.
                      items:
                        type: string
                        description: Enter the tag name. Example, *Open API IOC*.
                        default: created_using_openapi_lookup
                        examples:
                        - Tag Name
                    description:
                      type: string
                      description: Pass a description for the intel.
                      examples:
                      - Description for all the threat data objects to be created
                source:
                  type: object
                  description: Pass the details of the source, like the source name.
                  properties:
                    source_name:
                      type: string
                      description: Pass the name of the source to map the intel.  If the passed source name does not exists in the platform, then a new source is automatically created with the suffix (OpenAPI) in the Miscellaneous source category.
                      default: OpenAPI Lookup (OpenAPI)
                      examples:
                      - API Source
                collection:
                  type: object
                  description: Pass the details of the collections, like the collection name.
                  properties:
                    collection_name:
                      type: string
                      description: Pass the name of the source collection to associate with the source. If the passed collection name does not exists in the platform, then a new collection is automatically created with the suffix (OpenAPI).
                      default: OpenAPI Lookup (OpenAPI)
                      examples:
                      - Open API Source Collection
              required:
              - ioc_values
            example:
              ioc_values:
              - 76.77.23.225
              metadata:
                tlp: RED
                confidence: 100
                tags:
                - Tag Name
                description: Description for all the threat data objects to be created
              source:
                source_name: API Source
              collection:
                collection_name: Open API Source Collection
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  found_iocs:
                    type: object
                    description: Returns the details of the IOCs that exist in the platform.
                    properties:
                      results:
                        type: array
                        description: Returns a list of JSON objects. Each object includes the details of the IOCs that exists in the platform.
                        items:
                          type: object
                          properties:
                            analyst_cvss_score:
                              type: integer
                              description: Returns the CVSS score assigned to a vulnerability object by an analyst.
                            analyst_markings:
                              type: array
                              description: Returns the analyst marking for the object.
                              items: {}
                            analyst_score:
                              type: string
                              description: Returns the Confidence Score assigned to the IOC by an analyst.
                            analyst_tlp:
                              type: string
                              description: Returns the TLP assigned to the IOC by an analyst.
                            canvas_data:
                              type: string
                              description: Visual enrichment data used for relationship mapping in the threat intelligence canvas.
                            confidence_score:
                              type: string
                              description: Returns the Confidence Score calculated by the Intel Exchange confidence score engine.
                              examples:
                              - NA
                            confidence_type:
                              type: string
                              description: Returns the type of Confidence Score.
                              enum:
                              - ctix
                              - third-party
                              examples:
                              - ctix
                            country:
                              type: string
                              description: Returns the name of the country where the IOC was seen.
                              examples:
                              - India
                            created:
                              type: number
                              description: Returns the source created date and time of the IOC.
                              examples:
                              - 1738323897
                            ctix_created:
                              type: number
                              description: Returns the created date and time of the IOC in Intel Exchange.
                              examples:
                              - 1738323904
                            ctix_modified:
                              type: number
                              description: Returns the modified date and time of the IOC.
                              examples:
                              - 1745229473
                            custom_attributes:
                              type: array
                              description: Returns any custom attributes associated with the threat data object
                              items:
                                type: object
                                properties:
                                  custom_attribute_name:
                                    type: string
                                    description: Returns the name of the custom attribute.
                                    examples:
                                    - csap_card_id
                                  custom_attribute_value:
                                    type: string
                                    description: Returns the value of the custom attribute.
                                    examples:
                                    - 348bc093
                            custom_scores:
                              type: object
                              description: Returns custom scores associated with the threat data object
                              properties:
                                x_ctix_customscore_1:
                                  type: string
                                  description: This is an example value.
                                  examples:
                                  - Medium
                            first_seen:
                              type: string
                              description: Returns the date and time when the IOC was first seen.
                            id:
                              type: string
                              description: Returns the unique ID assigned by Intel Exchange to the IOC.
                              examples:
                              - 83f94ebc-5434-41a5-9b7a-f4267f133a1c
                            indicator_type:
                              type: string
                              description: Returns the type of indicator. Returns null if the threat data object is not an indicator. Returns file for hashes and the indicator type key for other indicators.
                              examples:
                              - ipv4-addr
                            ioc_type:
                              type: string
                              description: Returns the type of indicator. Returns null if the threat data object is not an indicator. Returns file for hashes and the indicator type key for other indicators.
                              examples:
                              - ipv4-addr
                            is_actioned:
                              type: boolean
                              description: Returns true if an action was performed on the threat data object in Intel Exchange. Else, returns false.
                              examples:
                              - false
                            is_deprecated:
                              type: boolean
                              description: Returns true if the IOC is marked as deprecated in Intel Exchange. Else, returns false.
                              examples:
                              - false
                            is_false_positive:
                              type: boolean
                              description: Returns true if the IOC is marked as false positive in Intel Exchange. Else, returns false.
                              examples:
                              - false
                            is_reviewed:
                              type: boolean
                              description: Returns true if the IOC is reviewed. Else, returns false.
                              examples:
                              - false
                            is_revoked:
                              type: boolean
                              description: Returns true if the IOC is revoked. Else, returns false.
                              examples:
                              - false
                            is_under_review:
                              type: boolean
                              description: Returns true if the IOC is marked for manual review. Else, returns false.
                              examples:
                              - false
                            is_watchlist:
                              type: boolean
                              description: Returns true if the IOC is added to the watchlist. Else, returns false.
                              examples:
                              - false
                            is_whitelisted:
                              type: boolean
                              description: Returns true if the IOC is marked as an allowed indicator. Else, returns false.
                              examples:
                              - true
                            last_seen:
                              type: string
                              description: Returns the last seen date and time of the IOC.
                            modified:
                              type: number
                              description: Returns the source modified date and time of the IOC.
                              examples:
                              - 1745228752
                            name:
                              type: string
                              description: Returns the value of the IOC.
                              examples:
                              - 1.1.1.1
                            pattern:
                              type: string
                              description: Returns the ATT&CK pattern of the IOC
                            primary_attribute:
                              type: string
                              description: Returns the primary attribute of the threat data object if the IOC is a custom object.
                            published_collections:
                              type: array
                              description: Returns a list of JSON objects for the collections in which the IOC is published.
                              items: {}
                            received_id:
                              type: string
                              description: Identifier assigned during data ingestion; often used for tracking source-originated records.
                            risk_severity:
                              type: string
                              description: Overall risk level based on threat context or scoring.
                            severity:
                              type: string
                              description: Returns the severity of the threat data object.
                              examples:
                              - UNKNOWN
                            source_collections:
                              type: array
                              description: Returns the list of IDs and names of source collections of the IOC.
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Returns the unique identifier of the source collection.
                                    examples:
                                    - decf3ae2-9efd-4c5d-a67c-ea3eba333baa
                                  name:
                                    type: string
                                    description: Returns the name of the source collection.
                                    examples:
                                    - Free Text
                            source_confidence:
                              type: string
                              description: Returns the confidence score of the IOC as reported by the source.
                              examples:
                              - HIGH
                            source_created:
                              type: number
                              description: Returns the epoch timestamp of when the IOC was created in the source
                              examples:
                              - 1738323897
                            sources:
                              type: array
                              description: Returns the list of sources that reported the IOC.
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Returns the unique identifier of the source.
                                    examples:
                                    - 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                                  name:
                                    type: string
                                    description: Returns the name of the source.
                                    examples:
                                    - Y combi
                                  source_type:
                                    type: string
                                    description: Returns the type of the source.
                                    examples:
                                    - RSS_FEED
                            sub_type:
                              type: string
                              description: Returns the valid subtype of the object such as an indicator is a valid subtype is a URL, domain, and more.
                              examples:
                              - value
                            subscriber_collections:
                              type: array
                              description: Returns the collections in which the IOC is published and subscribers are polling data from the collections.
                              items: {}
                            subscribers:
                              type: array
                              description: Returns the subscribers that are polling the IOC from published collections.
                              items: {}
                            tags:
                              type: array
                              description: Returns the tags associated with the IOC.
                              items:
                                type: object
                                properties:
                                  colour_code:
                                    type: string
                                    description: Returns the colour code in HEX format associated with the tag.
                                    examples:
                                    - '#45505E'
                                  id:
                                    type: string
                                    description: Returns the tag ID.
                                    examples:
                                    - f350fc79-db83-4e7f-95ec-33e92683fb63
                                  name:
                                    type: string
                                    description: Returns the tag name.
                                    examples:
                                    - Actor/ELOQUENTPANDA
                                  tag_type:
                                    type: string
                                    description: Returns the type of the tag.
                                    examples:
                                    - source
                                  theme:
                                    type: string
                                    description: Visual styling cue used for UI grouping or prioritisation.
                                    examples:
                                    - neutral
                            tlp:
                              type: string
                              description: Returns the TLP assigned to the IOC by the source.
                              examples:
                              - AMBER
                            type:
                              type: string
                              description: Returns the SDO type of the threat data object. Returns indicator for IOCs.
                              examples:
                              - indicator
                            valid_from:
                              type: number
                              description: Returns the date and time since when this IOC is valid.
                              examples:
                              - 1738323897
                            valid_until:
                              type: string
                              description: Returns the date and time until when this IOC is valid.
                      total:
                        type: number
                        description: Returns the details of the IOCs that exist in the platform.
                        examples:
                        - 12
                  message:
                    type: string
                    description: Returns the message associated with intel creation
                    examples:
                    - Intel creation successfully inititated for IOCs that were not found in the lookup
                  task_id:
                    type: string
                    description: Returns the task ID of intel creation
                    examples:
                    - 41b9e377-cb6f-41df-9a14-1cc612c0d09a
                  values_not_found:
                    type: object
                    description: Returns the details of the IOCs that do not exist in the platform.
                    properties:
                      invalid_values:
                        type: array
                        description: Returns a list of invalid IOC values. Invalid IOC values will not be ingested into the platform.
                        items:
                          type: string
                          description: This is an example value.
                          examples:
                          - 9c5181033b932df1d0e24271713
                      total_invalid:
                        type: number
                        description: Returns the total count of invalid IOC values.
                        examples:
                        - 5
                      total_valid:
                        type: number
                        description: Returns the total number of valid IOC values.
                        examples:
                        - 1
                      valid_iocs:
                        type: array
                        description: Returns a list of all valid IOC values. All valid IOC values will be ingested into the platform if the query parameter `create=true` is passed with the request.
                        items:
                          type: string
                          description: This is an example value.
                          examples:
                          - 136.19.253.60
              example:
                found_iocs:
                  results:
                  - analyst_cvss_score: null
                    analyst_markings: []
                    analyst_score: null
                    analyst_tlp: null
                    canvas_data: null
                    confidence_score: NA
                    confidence_type: ctix
                    country: India
                    created: 1738323897
                    ctix_created: 1738323904
                    ctix_modified: 1745229473
                    custom_attributes:
                    - custom_attribute_name: csap_card_id
                      custom_attribute_value: 348bc093
                    custom_scores:
                      x_ctix_customscore_1: Medium
                    first_seen: null
                    id: 83f94ebc-5434-41a5-9b7a-f4267f133a1c
                    indicator_type: ipv4-addr
                    ioc_type: ipv4-addr
                    is_actioned: false
                    is_deprecated: false
                    is_false_positive: false
                    is_reviewed: false
                    is_revoked: false
                    is_under_review: false
                    is_watchlist: false
                    is_whitelisted: true
                    last_seen: null
                    modified: 1745228752
                    name: 1.1.1.1
                    pattern: null
                    primary_attribute: null
                    published_collections: []
                    received_id: null
                    risk_severity: null
                    severity: UNKNOWN
                    source_collections:
                    - id: decf3ae2-9efd-4c5d-a67c-ea3eba333baa
                      name: Free Text
                    source_confidence: HIGH
                    source_created: 1738323897
                    sources:
                    - id: 790b1f0c-21e5-46d7-be66-bb57f4bd4074
                      name: Y combi
