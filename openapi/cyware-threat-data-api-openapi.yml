  /ingestion/saved-searches/pin-saved-search/:
    post:
      operationId: pinSavedSearch
      summary: Pin Saved Search
      tags:
      - Threat Data
      description: Pins a saved search in Intel Exchange.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/saved-search/pin-saved-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                saved_search:
                  type: string
                  description: Pass the ID of a saved search. You can retrieve the ID using the **List Saved Searches API**.
                  examples:
                  - 5090a554-05ba-4706-8310-07ddddc9b865
                order:
                  type: number
                  description: Pass the order in which you want the saved search to appear.
                  examples:
                  - '1'
              required:
              - saved_search
            example:
              saved_search: 5090a554-05ba-4706-8310-07ddddc9b865
              order: '1'
      responses:
        '201':
          description: HTTP 201 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Returns success if the saved search is pinned successfully. Else, returns failure.
                    examples:
                    - success
              example:
                result: success
    delete:
      operationId: removePinedSavedSearch
      summary: Remove Pined Saved Search
      tags:
      - Threat Data
      description: Removes a saved search from the pinned search list.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/saved-search/remove-pined-saved-search
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                saved_search:
                  type: string
                  description: Pass the ID of a saved search. You can retrieve the ID using the **List Saved Searches API**.
                  examples:
                  - 5090a554-05ba-4706-8310-07ddddc9b865
            example:
              saved_search: 5090a554-05ba-4706-8310-07ddddc9b865
      responses:
        '204':
          description: The saved search is successfully removed from the pinned search list.
    put:
      operationId: updatePinnedSavedSearch
      summary: Update Pinned Saved Search
      tags:
      - Threat Data
      description: Updates the order of a pinned saved search in Intel Exchange.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/threat-data/saved-search/update-pinned-saved-search
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                saved_search:
                  type: string
                  description: Pass the ID of a saved search. You can retrieve the ID using the **List Saved Searches API**.
                  examples:
                  - 5090a554-05ba-4706-8310-07ddddc9b865
                order:
                  type: number
                  description: Pass the order in which you want the saved search to appear.
                  examples:
                  - '2'
            example:
              saved_search: 5090a554-05ba-4706-8310-07ddddc9b865
              order: '2'
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Returns success if the saved search is pinned successfully. Else, returns failure.
                    examples:
                    - success
              example:
                result: success
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
