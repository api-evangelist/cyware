    post:
      operationId: runReport
      summary: Run Report
      tags:
      - Reports
      description: Runs a report and sends the file to the recipients.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/reports/run-report
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          description: Pass the type of report to run.
          enum:
          - basic
          - advanced
          examples:
          - basic
        description: Pass the type of report to run.
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          description: 'Pass the ID of a report. For example: *87c07bb3-b60c-4279-a5ec-8a38f73f7ea4*.'
          examples:
          - '{{report_id}}'
        description: 'Pass the ID of a report. For example: *87c07bb3-b60c-4279-a5ec-8a38f73f7ea4*.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_types:
                  type: array
                  description: Pass the report types.
                  enum:
                  - csv
                  - xls
                  items:
                    type: string
                    description: This is an example of file type.
                    enum:
                    - csv
                    - xls
                    examples:
                    - csv
                internal_recipients:
                  type: object
                  description: 'Pass the list of details of internal users to share the report.

                    **Note**: At least one internal or external recipient is required.'
                  properties:
                    to:
                      type: array
                      description: Pass the details of an internal user to share the report.
                      items:
                        type: object
                        properties:
                          first_name:
                            type: string
                            description: Pass the first name of the internal recipient.
                            examples:
                            - John
                          last_name:
                            type: string
                            description: Pass the last name of the internal recipient.
                            examples:
                            - Doe
                          email:
                            type: string
                            description: Pass the email address of the internal recipient.
                            examples:
                            - john.doe@orgname.com
                          id:
                            type: string
                            description: Pass the unique identifier of the internal recipient.
                            examples:
                            - af4d8750-b8a4-4197-9a61-6b416b48f752
                query_key:
                  type: string
                  description: Pass the value to specify whether the report must run based on the created time or the last modified time of threat data in CTIX.
                  enum:
                  - ctix_created
                  - ctix_modified
                  examples:
                  - ctix_created
                starttime:
                  type: number
                  description: Pass the start date and time in EPOCH format from which the report captures data available in CTIX.
                  examples:
                  - 1752834255
                endtime:
                  type: number
                  description: Pass the end date and time in EPOCH format until which the report captures data available in CTIX.
                  examples:
                  - 1753439055
                external_recipients:
                  type: object
                  description: 'Pass the list of external users to share the report.

                    **Note**: At least one internal or external recipient is required.'
                  properties:
                    to:
                      type: array
                      description: Pass the email addresses of the external recipients.
                      items:
                        type: string
                        description: Pass the email address of the external recipient.
                        examples:
                        - jane.smith@orgname.com
              required:
              - internal_recipients
              - query_key
              - starttime
              - endtime
              - external_recipients
            example:
              file_types:
              - csv
              internal_recipients:
                to:
                - first_name: John
                  last_name: Doe
                  email: john.doe@orgname.com
                  id: af4d8750-b8a4-4197-9a61-6b416b48f752
              query_key: ctix_created
              starttime: 1752834255
              endtime: 1753439055
              external_recipients:
                to:
                - jane.smith@orgname.com
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Returns the success message
                    examples:
                    - Your Report will be mailed to you as soon as it is ready.
              example:
                result: Your Report will be mailed to you as soon as it is ready.
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
