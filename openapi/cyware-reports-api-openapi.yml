                            properties:
                              type:
                                type: string
                                description: Returns the type of file, such as CSV or XLSX.
                                examples:
                                - xls
                              id:
                                type: string
                                description: Returns the unique ID of the file.
                                examples:
                                - fa3b65eb-d385-45b3-bbdd-6e63572cdfe0
                              url:
                                type: string
                                description: Returns the download URL of the file.
                                examples:
                                - file/fa3b65eb-d385-45b3-bbdd-6e63572cdfe0/
                              name:
                                type: string
                                description: Returns the name of the report.
                                examples:
                                - DONOT Edit - hourly report
                        id:
                          type: string
                          description: Returns the unique ID of the run log.
                          examples:
                          - 06ebeae3-09c2-4fa0-80c1-afcc51a13064
                        last_run:
                          type: number
                          description: Returns the date and time at which the file was last run.
                          examples:
                          - '1650532503'
                        download_link:
                          type: object
                          description: Returns the URL to download the report.
                        run_type:
                          type: string
                          description: Returns the run-type applied on the report, such as scheduled, instant.
                          examples:
                          - scheduled
                        file_types:
                          type: array
                          description: Returns the list of file types in a run log, such as CSV, and XLS.
