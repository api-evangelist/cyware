  /ingestion/watchlist/{watchlist_id}/feeds/:
    get:
      operationId: watchlistFeeds
      summary: Get Watchlist Feeds
      tags:
      - Watchlist
      description: Returns the occurrence details of a watchlist keyword.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/watchlist/watchlist-feeds
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve feeds.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve feeds.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of feeds to retrieve on each page.
          maxLength: 100
          default: '10'
          examples:
          - '10'
        description: Pass the number of feeds to retrieve on each page.
      - name: watchlist_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the ID of the watchlist for which we are receiving feeds.
          examples:
          - 2fcb4f9c-541b-493e-afd5-643cfffb4c3f
        description: Pass the ID of the watchlist for which we are receiving feeds.
      responses:
        '200':
          description: HTTP 200 response
          content:
            json:
              schema:
                type: object
                properties:
                  next:
                    type: string
                    description: Returns a link to the next page of the results.
                  previous:
                    type: string
                    description: Returns a link to the previous page of the results.
                  total:
                    type: number
                    description: Returns the total number of feeds available.
                    examples:
                    - 3
                  page_size:
                    type: number
                    description: Returns the number of feeds returned per page.
                    examples:
                    - 10
                  results:
                    type: array
                    description: Returns the details of the Watchlist feeds.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Returns the ID of the watchlist feed.
                          examples:
                          - 57dbf64b-de91-4170-9db9-9e2a85e6e7b7
                        created:
                          type: number
                          description: Returns the creation time of the watchlist keyword in epoch format.
                          examples:
                          - 1649924653
                        modified:
                          type: number
                          description: Returns the modification time of the watchlist keyword in epoch format.
                          examples:
                          - 1649924653
                        name:
                          type: string
                          description: Returns the keyword value.
                          examples:
                          - abilityworks
                        source:
                          type: object
                          description: Returns the source details of the watchlist feed.
                          properties:
                            id:
                              type: string
                              description: Returns the ID of the watchlist feed.
                              examples:
                              - 39118663-97a3-4cdd-8aad-20e5222d4e99
                            name:
                              type: string
                              description: Returns the keyword value.
                              examples:
                              - Import
                        collection:
                          type: object
                          description: Returns the collection details of the watchlist feed.
                          properties:
                            id:
                              type: string
                              description: Returns the ID of the watchlist feed.
                              examples:
                              - f90debce-f364-46b4-ab4e-b3ac755ad712
                            name:
                              type: string
                              description: Returns the keyword value.
                              examples:
                              - Free Text
                        object_id:
                          type: string
                          description: Returns the ID of the threat data object in which the keyword is found.
                          examples:
                          - 4fda7010-1dc5-4aad-9074-0f23f34c92fb
                        preview:
                          type: object
                          description: Returns the field name, top highlight, object ID and object type in which the keyword is found.
                          properties:
                            highlight:
                              type: string
                              description: Returns the snippet with the keyword highlighted
                              examples:
                              - <mark>abilityworks</mark>
                            object_id:
                              type: string
                              description: Returns the identifier of the related object.
                              examples:
                              - 4fda7010-1dc5-4aad-9074-0f23f34c92fb
                            field_name:
                              type: string
                              description: Returns the field in which the keyword was found
                              examples:
                              - title
                            object_type:
                              type: string
                              description: Return the type of the object.
                              examples:
                              - threat-actor
              example:
                next: null
                previous: null
                total: 3
                page_size: 10
                results:
                - id: 57dbf64b-de91-4170-9db9-9e2a85e6e7b7
                  created: 1649924653
                  modified: 1649924653
                  name: abilityworks
                  source:
                    id: 39118663-97a3-4cdd-8aad-20e5222d4e99
                    name: Import
                  collection:
                    id: f90debce-f364-46b4-ab4e-b3ac755ad712
                    name: Free Text
                  object_id: 4fda7010-1dc5-4aad-9074-0f23f34c92fb
                  preview:
                    highlight: <mark>abilityworks</mark>
                    object_id: 4fda7010-1dc5-4aad-9074-0f23f34c92fb
                    field_name: title
                    object_type: threat-actor
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
