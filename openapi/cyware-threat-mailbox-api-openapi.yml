        description: Pass the query text to search in the subject and body of emails.
      - name: page_size
        in: query
        required: false
        schema:
          type: string
          description: Pass the number of emails to retrieve on each page.
          maxLength: 100
          default: '10'
          examples:
          - '400'
        description: Pass the number of emails to retrieve on each page.
      - name: page
        in: query
        required: false
        schema:
          type: string
          description: Pass the page number to retrieve emails.
          default: '1'
          examples:
          - '10'
        description: Pass the page number to retrieve emails.
      - name: has_attachments
        in: query
        required: false
        schema:
