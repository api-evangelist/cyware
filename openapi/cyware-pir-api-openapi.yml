  /api/v1/pirs/{pir_id}/status/:
    put:
      operationId: updatePirStatus
      summary: Update PIR Status
      tags:
      - PIR
      description: 'Transitions a PIR to a new lifecycle status. Status changes affect whether the PIR participates in match sweeps and signal evaluation and may trigger side effects such as auto-resolving open signals.


        <Accordion attributes=''{"style":{"width":"100%"}}''>

        <AccordionItem title="Lifecycle States" iconUrl=""><p>State</p>

        <p>Behaviour</p>

        <p>Match Sweeps</p>

        <p><code class="slate-code">draft</code></p>

        <p>Saved but not yet submitted for monitoring.</p>

        <p>Excluded</p>

        <p><code class="slate-code">active</code></p>

        <p>Fully operational. Requires at least one category; returns <code class="slate-code">400</code> <code class="slate-code">CPIR-002</code> otherwise.</p>

        <p>Included</p>

        <p><code class="slate-code">inactive</code></p>

        <p>Temporarily suspended. Open signals are auto-resolved on transition.</p>

        <p>Excluded</p>

        <p><code class="slate-code">expired</code></p>

        <p>End-of-life. Open signals are auto-resolved and the CES record is deprecated.</p>

        <p>Excluded</p>

        <p><code class="slate-code">deleted</code></p>

        <p>Soft-deleted. Excluded from list results. Open signals are auto-resolved and matches are marked removed.</p>

        <p>Excluded</p>

        <p></p></AccordionItem>

        </Accordion>'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/pir-management/update-pir-status
      parameters:
      - name: pir_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the KSUID or human-readable ID of the PIR as a path parameter.
        description: Pass the KSUID or human-readable ID of the PIR as a path parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Pass the target lifecycle status.
                  examples:
                  - active
              required:
              - status
            example:
              status: active
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns the new lifecycle status of the PIR.
                    examples:
                    - inactive
              example:
                status: inactive
  /api/v1/pirs/{pir_id}/health/:
    get:
      operationId: getPirHealthScore
      summary: Get PIR Health Score
      tags:
      - PIR
      description: Returns the most recent health snapshot for a specific PIR. The health score is computed by the Health Worker on a schedule and after each match sweep. Returns `404` `CPIR-003` until the Health Worker has run at least once for the PIR.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/pir-metrics/get-pir-health-score
      parameters:
      - name: pir_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the KSUID or human-readable ID of the PIR as a path parameter.
        description: Pass the KSUID or human-readable ID of the PIR as a path parameter.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  pir_id:
                    type: string
                    description: Returns the KSUID of the PIR.
                    examples:
                    - 3DwpvMWyNIuf33QFpyRJXIcKYVB
                  score_total:
                    type: number
                    description: Returns the overall health score on a 0–100 scale, computed as a weighted sum of the four dimensions.
                    examples:
                    - 72
                  band:
                    type: string
                    description: 'Returns the health band derived from `score_total`: `healthy` (70–100), `degrading` (40–69), or `unhealthy` (0–39).'
                    examples:
                    - healthy
                  coverage:
                    type: number
                    description: Returns the coverage dimension score, indicating how broadly the PIR is matched across expected object types.
                    examples:
                    - 80
                  freshness:
                    type: number
                    description: Returns the freshness dimension score, indicating how recently new matches have arrived relative to the PIR's priority.
                    examples:
                    - 65
                  confidence:
                    type: number
                    description: Returns the confidence dimension score, indicating the average strength of the semantic match across matched objects.
                    examples:
                    - 70
                  velocity:
                    type: number
                    description: Returns the signal velocity dimension score, indicating the rate of new intelligence arriving for this PIR.
                    examples:
                    - 75
                  detection_readiness:
                    type: number
                    description: Returns the detection readiness dimension score, indicating the presence of actionable detection artefacts in matched objects.
                    examples:
                    - 68
                  computed_at:
                    type: string
                    description: Returns the timestamp when this snapshot was computed.
                    examples:
                    - '2026-05-12T07:00:00Z'
              example:
                pir_id: 3DwpvMWyNIuf33QFpyRJXIcKYVB
                score_total: 72
                band: healthy
                coverage: 80
                freshness: 65
                confidence: 70
                velocity: 75
                detection_readiness: 68
                computed_at: '2026-05-12T07:00:00Z'
