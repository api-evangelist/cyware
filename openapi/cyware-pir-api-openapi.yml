                      delta_delink:
                        type: number
                        description: Returns the total number of delinks in the past 7 days, including both automatic and manual removals.
                        examples:
                        - 2
                      delta_manual_delink:
                        type: number
                        description: Returns the number of user-initiated delinks in the past 7 days. A subset of `delta_delink`.
                        examples:
                        - 1
                  vulnerability:
