                        type: number
                        description: Returns the total number of delinks in the past 7 days, including both automatic and manual removals.
                        examples:
                        - 0
                      delta_manual_delink:
                        type: number
                        description: Returns the number of user-initiated delinks in the past 7 days. A subset of `delta_delink`.
                        examples:
                        - 0
                  report:
                    type: object
                    description: Returns a per-type breakdown for the report object type with non-zero activity.
                    properties:
                      total:
                        type: number
                        description: Returns the total number of live matches across all reports at the time of the snapshot.
                        examples:
