                - id: 3Esig000000000000000000001
                  title: Emerging Threat
                  description: New activity detected across linked objects for this PIR.
                  signal_type: emerging_threat
                  severity: critical
                  status: triggered
                  confidence: 88
                  recommended_actions:
                  - Validate match relevance to each affected PIR
                  pir_ids:
                  - 3DwpvMWyNIuf33QFpyRJXIcKYVB
                  associated_pirs_count: 1
                  associated_pirs:
                  - id: 3DwpvMWyNIuf33QFpyRJXIcKYVB
                    readable_id: PIR001
                  emitted_at: '2026-05-19T14:57:35.332419Z'
  /api/v1/signals/metrics/prioritized/:
    get:
      operationId: topPrioritizedSignalsTenantWide
      summary: Top Prioritized Signals (Tenant-wide)
      tags:
      - PIR
      description: Returns the top 3 signals across the tenant ranked by a composite of severity and confidence. Only signals in triggered or acknowledged status are eligible. Use this to power the prioritised signals widget on the dashboard.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/signals/top-prioritized-signals-tenant-wide
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_count:
                    type: number
                    description: Returns the total count of signals in `triggered` or `acknowledged` status across the tenant.
                    examples:
                    - 4
                  results:
                    type: array
                    description: Returns up to 3 signal objects ranked by priority.
                    items:
                      type: object
                      properties:
                        signal_id:
                          type: string
                          description: Returns the signal identifier.
                          examples:
                          - sig-1
                        title:
                          type: string
                          description: Returns the signal title.
                          examples:
                          - Emerging Threat
                        description:
                          type: string
                          description: Returns the signal description.
                          examples:
                          - '...'
                        signal_type:
                          type: string
                          description: Returns the signal type.
                          examples:
                          - emerging_threat
                        severity:
                          type: string
                          description: Returns the severity level.
                          examples:
                          - crisis
                        status:
                          type: string
                          description: Returns the current signal status.
                          examples:
                          - triggered
                        confidence:
                          type: number
                          description: Returns the confidence score (0–100).
                          examples:
                          - 92.5
                        emitted_at:
                          type: string
                          description: Returns the timestamp when the signal was emitted.
                          examples:
                          - '2026-05-19T14:57:35.332419Z'
                        recommended_actions:
                          type: array
                          description: Returns the list of recommended analyst actions.
                          items:
                            type: string
                            description: This is an example value.
                            examples:
                            - Validate match relevance to each affected PIR
                        rank_score:
                          type: number
                          description: Returns the composite ranking score used to order signals (`severity_weight × confidence`).
                          examples:
                          - 5
                        pir_ids:
                          type: array
                          description: Returns the complete list of PIR IDs associated with this signal.
                          items:
                            type: string
                            description: This is an example value.
                            examples:
                            - 3DwpvMWyNIuf33QFpyRJXIcKYVB
                        associated_pirs_count:
                          type: number
                          description: Returns the total number of linked PIRs.
                          examples:
                          - 2
                        associated_pirs:
                          type: array
                          description: Returns up to the first 5 associated PIR objects as {`id`, `readable_id`}.
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Returns the KSUID of the associated PIR.
                                examples:
                                - 3DwpvMWyNIuf33QFpyRJXIcKYVB
                              readable_id:
                                type: string
                                description: Returns the human-readable identifier. For example, `PIR001`.
                                examples:
                                - PIR001
              example:
                active_count: 4
                results:
                - signal_id: sig-1
                  title: Emerging Threat
                  description: '...'
                  signal_type: emerging_threat
                  severity: crisis
                  status: triggered
                  confidence: 92.5
                  emitted_at: '2026-05-19T14:57:35.332419Z'
                  recommended_actions:
                  - Validate match relevance to each affected PIR
                  rank_score: 5
                  pir_ids:
                  - 3DwpvMWyNIuf33QFpyRJXIcKYVB
                  associated_pirs_count: 2
                  associated_pirs:
                  - id: 3DwpvMWyNIuf33QFpyRJXIcKYVB
                    readable_id: PIR001
  /api/v1/signals/{signal_id}/:
    post:
      operationId: updateSignalStatus
      summary: Update Signal Status
      tags:
      - PIR
      description: 'Transitions a signal to a new status. Not all transitions are permitted; see the transition rules below. Returns `409` `CPIR-007` when the transition is not allowed from the signal''s current state.


        <Accordion attributes=''{"style":{"width":"100%"}}''>

        <AccordionItem title="Transition Rules" iconUrl=""><p>Target status</p>

        <p>Allowed from</p>

        <p>Failure</p>

        <p><code class="slate-code">acknowledged</code></p>

        <p><code class="slate-code">triggered</code> only</p>

        <p><code class="slate-code">409</code> <code class="slate-code">CPIR-007</code> with "signal is not in triggered state"</p>

        <p><code class="slate-code">resolved</code></p>

        <p><code class="slate-code">triggered</code> or <code class="slate-code">acknowledged</code></p>

        <p><code class="slate-code">409</code> <code class="slate-code">CPIR-007</code> with "signal cannot be resolved from its current state"</p>

        <p><code class="slate-code">dismissed</code></p>

        <p>Any status</p>

        <p>N/A</p>

        <p></p></AccordionItem>

        </Accordion>'
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/signals/update-signal-status
      parameters:
      - name: signal_id
        in: path
        required: true
        schema:
          type: string
          description: Pass the signal identifier as a path parameter.
        description: Pass the signal identifier as a path parameter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Pass the target status. Passing `triggered` or any other value returns `422` `CPIR-008`.
                  examples:
                  - acknowledged
              required:
              - status
            example:
              status: acknowledged
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns the applied target status.
                    examples:
                    - acknowledged
              example:
                status: acknowledged
  /api/health-check/:
    get:
      operationId: livenessCheck
      summary: Liveness Check
      tags:
      - PIR
      description: Confirms the service process is running. Does not probe downstream dependencies. Used by the container orchestrator as a process-level health check.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/system/liveness-check
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns `ok` when the process is running.
                    examples:
                    - ok
              example:
                status: ok
  /metrics:
    get:
      operationId: prometheusMetrics
      summary: Prometheus Metrics
      tags:
      - PIR
      description: Exposes operational metrics in Prometheus text exposition format. Served on a dedicated port (\`:2424\`) separate from the API port. Both the API server and the worker binary expose this endpoint independently on their own `:2424` ports.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/system/prometheus-metrics
      responses:
        '200':
          description: 'Returns Prometheus text format. Metric namespaces:


            HELP cpir_http_requests_total Total HTTP requests.

            TYPE cpir_http_requests_total counter

            cpir_http_requests_total{method="GET",route="/api/v1/pirs/",status="200"} 1423

            HELP cpir_db_query_duration_seconds DB query duration.

            TYPE cpir_db_query_duration_seconds histogram

            cpir_db_query_duration_seconds_bucket{op="select",table="pirs",le="0.005"} 892'
  /api/readiness-check/:
    get:
      operationId: readinessCheck
      summary: Readiness Check
      tags:
      - PIR
      description: Confirms that the service and its dependencies, the database (via PgBouncer) and the Central Embedding Service (CES), are reachable. Returns `200` only when all dependencies are healthy; returns `503` when any dependency is down. Used by the orchestrator to gate traffic routing.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/system/readiness-check
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns `ok` when all dependencies are healthy, or `unhealthy` when one or more are unreachable.
                    examples:
                    - ok
                  components:
                    type: object
                    properties:
                      database:
                        type: string
                        description: Returns `ok` when the database is reachable, or `unhealthy` when it is not.
                        examples:
                        - ok
                      ces:
                        type: string
                        description: Returns `ok` when the database is reachable, or `unhealthy` when it is not.
                        examples:
                        - ok
              example:
                status: ok
                components:
                  database: ok
                  ces: ok
        '503':
          description: HTTP 503 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Returns `ok` when all dependencies are healthy, or `unhealthy` when one or more are unreachable.
                    examples:
                    - unhealthy
                  components:
                    type: object
                    properties:
                      database:
                        type: string
                        description: Returns `ok` when the database is reachable, or `unhealthy` when it is not.
                        examples:
                        - ok
                      ces:
                        type: string
                        description: Returns `ok` when the database is reachable, or `unhealthy` when it is not.
                        examples:
                        - unhealthy
              example:
                status: unhealthy
                components:
                  database: ok
                  ces: unhealthy
  /api/v1/tenant/configuration/:
    get:
      operationId: getTenantConfiguration
      summary: Get Tenant Configuration
      tags:
      - PIR
      description: Returns the tenant's CES tuning parameters, escalation thresholds, and telemetry configuration. The telemetry fields are passed through to the frontend to enable click-event capture and are not stored per tenant.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/tenant-configuration/get-tenant-configuration
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vector_min_score:
                    type: object
                    description: Returns the minimum cosine similarity threshold for CES matches. Contains a `global` default and optional `per_entity` overrides keyed by entity kind.
                    properties:
                      global:
                        type: number
                        description: Returns the default minimum cosine similarity threshold applied to entity kinds without a `per_entity` override.
                        examples:
                        - 0.78
                      per_entity:
                        type: object
                        description: Returns per-entity-kind overrides of the minimum cosine similarity threshold, keyed by entity kind. Omitted when no overrides are configured.
                        properties:
                          threat_object:
                            type: number
                            description: Returns the minimum cosine similarity threshold override for `threat_object` matches.
                            examples:
                            - 0.7
                          alert:
                            type: number
                            description: Returns the minimum cosine similarity threshold override for `alert` matches.
                            examples:
                            - 0.6
                  top_k:
                    type: object
                    description: Returns the maximum number of CES candidates considered per sweep. Same shape as `vector_min_score`.
                    properties:
                      global:
                        type: number
                        description: Returns the default maximum number of CES candidates considered per sweep for entity kinds without a `per_entity` override.
                        examples:
                        - 100
                      per_entity:
                        type: object
                        description: Returns per-entity-kind overrides of the maximum candidate count, keyed by entity kind. Omitted when no overrides are configured.
                        properties:
                          threat_object:
                            type: number
                            description: Returns the maximum candidate count override for `threat_object` matches.
                            examples:
                            - 20
                          alert:
                            type: number
                            description: Returns the maximum candidate count override for `alert` matches.
                            examples:
                            - 30
                  base_config:
                    type: object
                    description: Returns tenant-wide operational tunables such as `pir__max_active`.
                    properties:
                      pir__max_active:
                        type: number
                        description: Returns the maximum number of PIRs that can be in `active` status simultaneously for the tenant.
                        examples:
                        - 1000
                  auto_escalation_count:
                    type: number
                    description: Returns the signal count threshold that triggers a Medium to High severity escalation.
                    examples:
                    - 2
                  auto_escalation_window_hours:
                    type: number
                    description: Returns the time window in hours for the Medium to High escalation evaluation.
                    examples:
                    - 4
                  telemetry_token:
                    type: string
                    description: Returns the per-product telemetry token used by the frontend to connect to the telemetry service.
                    examples:
                    - <per-product token>
                  telemetry_type:
                    type: string
                    description: Returns the telemetry provider identifier. For example, `mixpanel`.
                    examples:
                    - mixpanel
              example:
                vector_min_score:
                  global: 0.78
                  per_entity:
                    threat_object: 0.7
                    alert: 0.6
                top_k:
                  global: 100
                  per_entity:
                    threat_object: 20
                    alert: 30
                base_config:
                  pir__max_active: 1000
                auto_escalation_count: 2
                auto_escalation_window_hours: 4
                telemetry_token: <per-product token>
                telemetry_type: mixpanel
components:
  securitySchemes:
    ctixOpenApiSignature:
      type: apiKey
      in: query
      name: AccessID
      description: 'Intel Exchange Open API credentials. Every request carries three query parameters: AccessID (the access ID of the Open API credential), Expires (an epoch timestamp, at most 30 seconds in the future) and Signature - an HMAC-SHA1 of "AccessID\nExpires" keyed with the secret key, Base64 encoded and then URL encoded. See https://ctixapiv3.cyware.com/authentication'
externalDocs:
  description: Cyware Intel Exchange API Reference
  url: https://ctixapiv3.cyware.com/
