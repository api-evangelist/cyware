  /api/v1/pirs/enhance-intent/:
    post:
      operationId: enhanceIntent
      summary: Enhance Intent
      tags:
      - PIR
      description: "Rewrites a vague or incomplete intent into a precise, well-structured monitoring requirement using an LLM. Returns the enhanced text for analyst review before it is committed. Only `intent` is required. Passing quality context from a prior Analyze Intent call focuses the rewrite on the weakest dimensions.\n\n<Callout attributes='{\"isFitToPage\":true,\"dataType\":\"success\",\"style\":{\"width\":\"100%\",\"minWidth\":\"100%\"}}'>\n  <p>Returns <code class=\"slate-code\">500</code> when LiteLLM is unavailable.</p>\n</Callout>"
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/pir/pir-management/enhance-intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  type: string
                  description: Pass the original intent text to enhance.
                  examples:
                  - track APT activity
                quality_dimensions:
                  type: object
                  description: Pass the dimension scores from a prior Analyze Intent response. When supplied, the LLM targets the lowest-scoring dimensions in the rewrite.
                  properties:
                    scope_clarity:
                      type: number
                      description: Pass the scope clarity score, indicating how well the intent defines the geographic, sector, or asset boundary.
                      examples:
                      - 1
                    threat_focus:
                      type: number
                      description: Pass the threat focus score, indicating how precisely the intent identifies the threat surface.
                      examples:
                      - 2
                    specificity:
                      type: number
                      description: Pass the specificity score, indicating how concretely the intent names entities, techniques, or indicators.
                      examples:
                      - 0
                    atomicity:
                      type: number
                      description: Pass the atomicity score, indicating whether the intent covers a single focused monitoring need.
                      examples:
                      - 2
                quality_score:
                  type: number
                  description: Pass the composite quality score from a prior Analyze Intent response.
                  examples:
                  - 62.5
                suggestion_chips:
                  type: array
                  description: Pass the suggestion labels from a prior Analyze Intent response. The LLM uses these as rewrite directives.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - Narrow the geographic or sector scope
              required:
              - intent
            example:
              intent: track APT activity
              quality_dimensions:
                scope_clarity: 1
                threat_focus: 2
                specificity: 0
                atomicity: 2
              quality_score: 62.5
              suggestion_chips:
              - Narrow the geographic or sector scope
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_intent:
                    type: string
                    description: Returns the original intent text unchanged.
                    examples:
                    - Track APT29 against US government
                  enhanced_intent:
                    type: string
                    description: Returns the LLM-rewritten intent with improved clarity, specificity, and scope.
                    examples:
                    - Monitor APT29 (Cozy Bear) intrusion campaigns targeting U.S. federal government networks, focusing on spearphishing, credential theft, and cloud-service abuse TTPs.
              example:
                original_intent: Track APT29 against US government
                enhanced_intent: Monitor APT29 (Cozy Bear) intrusion campaigns targeting U.S. federal government networks, focusing on spearphishing, credential theft, and cloud-service abuse TTPs.
