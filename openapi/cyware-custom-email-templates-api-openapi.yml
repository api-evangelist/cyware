  /v1/custom-templates/:
    get:
      operationId: customTemplateList
      summary: Get Custom Email Template List
      tags:
      - Custom Email Templates
      description: Returns the list of custom email templates.
      externalDocs:
        description: Cyware Orchestrate API reference
        url: https://orchestrateapi.cyware.com/custom-templates/custom-template-list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: Pass the page number to retrieve the templates list.
          default: '1'
          examples:
          - '1'
        description: Pass the page number to retrieve the templates list.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: Pass the number of items to retrieve per page.
          default: '10'
          examples:
          - '1'
        description: Pass the number of items to retrieve per page.
      - name: q
        in: query
        required: false
        schema:
          type: string
          description: Pass a value to q to search for custom templates. You can search email templates using the title.
          examples:
          - example-template
        description: Pass a value to q to search for custom templates. You can search email templates using the title.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    description: Indicates the next and the previous URLs of the email templates list.
                    properties:
                      next:
                        type: string
                        description: Returns the endpoint to the next page.
                        examples:
                        - custom-templates/?page=2&page_size=1
                  count:
                    type: number
                    description: Returns the total count of the custom email templates.
                    examples:
                    - '18'
                  results:
                    type: array
                    description: Returns the list of the custom templates.
                    items:
                      type: object
                      properties:
                        unique_id:
                          type: string
                          description: Returns the unique ID of the custom email template.
                          examples:
                          - 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                        title:
                          type: string
                          description: Returns the title of the custom email template.
                          examples:
                          - Phishing Template
                        description:
                          type: string
                          description: Returns the description of the custom email template.
                          examples:
                          - This will be the Phishing Template
                        is_removed:
                          type: boolean
                          description: Indicates if the email template is deleted or not.
                          examples:
                          - 'false'
                        created:
                          type: string
                          description: Returns the date and time the custom template was created.
                          examples:
                          - '2023-06-07T08:34:05.361364Z'
                        created_by_data:
                          type: object
                          description: Returns the details of the user who created the custom email template.
                          properties:
                            unique_id:
                              type: string
                              description: Returns the unique ID of the user who created the custom template.
                              examples:
                              - 0832ea94-0252-49b2-80c1-9823b44a3f46
                            first_name:
                              type: string
                              description: Returns the first name of the user who created the custom template.
                              examples:
                              - john
                            last_name:
                              type: string
                              description: Returns the last name of the user who created the custom template.
                              examples:
                              - doe
                            full_name:
                              type: string
                              description: Returns the full name of the user who created the custom template.
                              examples:
                              - john doe
              example:
                link:
                  next: custom-templates/?page=2&page_size=1
                count: '18'
                results:
                - unique_id: 6bd5a80a-722c-45d0-a24d-8a0ab72ae12a
                  title: Phishing Template
                  description: This will be the Phishing Template
                  is_removed: 'false'
                  created: '2023-06-07T08:34:05.361364Z'
                  created_by_data:
                    unique_id: 0832ea94-0252-49b2-80c1-9823b44a3f46
                    first_name: john
                    last_name: doe
                    full_name: john doe
components:
  securitySchemes:
    coOpenApiSignature:
      type: apiKey
      in: query
      name: access_id
      description: Orchestrate Open API credentials. Every request carries access_id, expires (epoch, current time + up to 30 seconds) and signature query parameters, where StringToSign = access_id + "\n" + expires and Signature = Base64(HMAC-SHA1(secret_key, StringToSign)). See https://orchestrateapi.cyware.com/authentication
externalDocs:
  description: Cyware Orchestrate API Reference
  url: https://orchestrateapi.cyware.com/
