        description: Pass the last modified value to filter tags.
      responses:
        '200':
          description: HTTP 200 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    description: Returns the endpoints for the next and previous pages.
                    properties:
                      next:
