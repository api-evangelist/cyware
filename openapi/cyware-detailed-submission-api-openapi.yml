    post:
      operationId: createDraftIntel
      summary: Create DRAFT Intel
      tags:
      - Detailed Submission
      description: Request to create/start a STIX form detailed submission, the API returns a unique Identifier that will be used for all the subsequent calls in the create intel/detailed submission.
      externalDocs:
        description: Cyware Intel Exchange API reference
        url: https://ctixapiv3.cyware.com/detailed-submission/draft/create-draft-intel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Pass the title of the STIX detailed submission.
                  examples:
                  - Package 3
                status:
                  type: string
                  description: Pass the current status of the submission.
                  examples:
                  - DRAFT
                component:
                  type: string
                  description: Pass the Intel Exchange component, For detailed submission "stix-form" value is used.
                  examples:
                  - stix-form
                enabled_stix_objects:
                  type: array
                  description: Specifies the STIX objects the user can configure/modify for the current detailed submission.
                  items:
                    type: string
                    description: This is an example value.
                    examples:
                    - indicator
              required:
              - title
              - status
              - component
            example:
              title: Package 3
              status: DRAFT
              component: stix-form
              enabled_stix_objects:
              - indicator
      responses:
        '201':
          description: HTTP 201 response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Returns the unique Identifier for the initiated detailed submission/create-intel.
                    examples:
                    - 1f09d6df-4856-44f1-a948-189faa232090
                  status:
                    type: string
                    description: Returns the current status of the detailed submission.
                    examples:
                    - DRAFT
                  component:
                    type: string
                    description: Returns the Intel Exchange component; for detailed submission to "stix-form" value is returned.
                    examples:
                    - stix-form
                  enabled_stix_objects:
                    type: array
                    description: Returns the STIX objects the user can configure/modify for the current detailed submission.
                    items:
                      type: string
                      description: This is an example value.
                      examples:
                      - indicator
                  created:
                    type: number
                    description: Returns the created timestamp for the submission.
                    examples:
                    - '1631874062'
                  modified:
                    type: number
                    description: Returns the modified timestamp for the submission
                    examples:
                    - '1631874062'
                  title:
                    type: string
                    description: Returns the title of the stix detailed submission.
                    examples:
                    - Package 3
              example:
                id: 1f09d6df-4856-44f1-a948-189faa232090
                status: DRAFT
                component: stix-form
                enabled_stix_objects:
                - indicator
                created: '1631874062'
                modified: '1631874062'
                title: Package 3
