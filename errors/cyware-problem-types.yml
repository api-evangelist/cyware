summary: >-
  Cyware publishes no error reference for either Open API. Across 438 documented operations only
  three non-2xx responses are modelled (one 400 in Intel Exchange, one 400 in Orchestrate, one 503
  readiness response). The authoritative list of statuses the Open API actually returns is published
  indirectly: the subscriber polling-log and API activity-log endpoints expose a response_code filter
  whose enumeration is the set of HTTP statuses the platform records against Open API calls. That
  enumeration is reproduced below as the de-facto status catalog, with the two modelled error bodies
  captured verbatim. Nothing here is invented — where Cyware documents no title or remediation, the
  field is left empty rather than filled in.
